{
  id:'ch5', num:5,
  titleEn:'Chapter 5 — Aerodynamics of Flight',
  titleZh:'第五章 — 飛行空氣動力學',
  subEn:'Original pages 5-1 to 5-51 (the longest chapter).',
  subZh:'原文頁碼 5-1 至 5-51（全書篇幅最長的一章）。',
  blocks:[
{t:'h2', en:'Forces Acting on the Aircraft', zh:'作用於飛機上的力'},
{t:'p', en:'Four forces: Thrust, Lift, Weight, Drag. In steady flight, the sum of all upward force components = sum of all downward components; sum of all forward components = sum of all backward components — not simply "thrust=drag, lift=weight" in every case (e.g., in a climb part of thrust acts upward like lift; in a glide part of weight acts forward like thrust).',
 zh:'四種作用力：推力、升力、重量、阻力。在穩定飛行狀態下，所有向上分量的總和＝所有向下分量的總和；所有向前分量的總和＝所有向後分量的總和——並非每種情況都單純是「推力＝阻力、升力＝重量」（例如爬升時，部分推力會像升力一樣向上作用；滑翔時，部分重量則會像推力一樣向前作用）。'},
{t:'p', en:'Angle of Attack (AOA): the acute angle between the airfoil\'s chord line and the direction of the relative wind — fundamental to performance, stability, and control.',
 zh:'攻角（AOA）：翼弦線與相對氣流方向之間的銳角——是性能、穩定性與操控性的根本要素。'},
{t:'img', src:'figs/ch5/fig5-1.png', en:'Figure 5-1. Relationship of forces acting on an aircraft.', zh:'圖5-1。作用於飛機上各力之間的關係。'},
{t:'img', src:'figs/ch5/fig5-2.png', en:'Figure 5-2. Force vectors during a stabilized climb.', zh:'圖5-2。穩定爬升時的力向量。'},
{t:'h3', en:'Thrust', zh:'推力'},
{t:'p', en:'As speed decreases, required AOA increases; if speed drops enough, AOA reaches critical AOA → stall. Extra vigilance needed at low thrust/low speed.',
 zh:'隨著速度降低，所需的攻角會增加；若速度降得夠低，攻角將達到臨界攻角→發生失速。在低推力／低速狀態下須格外提高警覺。'},
{t:'img', src:'figs/ch5/fig5-3.png', en:'Figure 5-3. Angle of attack at various speeds.', zh:'圖5-3。不同速度下的攻角。'},
{t:'img', src:'figs/ch5/fig5-4.png', en:'Figure 5-4. Some aircraft have the ability to change the direction of thrust.', zh:'圖5-4。部分飛機具備改變推力方向的能力。'},
{t:'h3', en:'Lift', zh:'升力'},
{t:'p', en:'Lift equation: L = CL × (ρV²/2) × S — lift depends on air density, velocity squared, wing area, and coefficient of lift. Lift is proportional to velocity squared — double the airspeed = 4× the lift. Since an airfoil always stalls at the same AOA, a heavier aircraft needs higher airspeed to generate the extra lift needed at that same AOA.',
 zh:'升力公式：L＝CL×（ρV²/2）×S——升力取決於空氣密度、速度平方、機翼面積與升力係數。升力與速度平方成正比——空速加倍，升力就變為4倍。由於同一翼型總是在相同攻角下失速，較重的飛機必須以更高空速飛行，才能在同一攻角下產生足夠的額外升力。'},
{t:'img', src:'figs/ch5/fig5-5.png', en:'Figure 5-5. Coefficients of lift and drag at various angles of attack.', zh:'圖5-5。不同攻角下的升力係數與阻力係數。'},
{t:'h3', en:'Lift/Drag Ratio', zh:'升阻比'},
{t:'p', en:'L/D-MAX = the AOA/airspeed combo yielding the most lift for the least drag — the most efficient AOA. Total drag is lowest at L/D-MAX; below/above that speed, total drag increases.',
 zh:'最大升阻比（L/D-MAX）＝能以最少阻力產生最多升力的攻角／空速組合——即最有效率的攻角。總阻力在L/D-MAX時最低；低於或高於該速度，總阻力都會增加。'},
{t:'img', src:'figs/ch5/fig5-6.png', en:'Figure 5-6. Drag versus speed.', zh:'圖5-6。阻力與速度的關係。'},
{t:'h3', en:'Drag', zh:'阻力'},
{t:'p', en:'Parasite drag (form drag + interference drag + skin friction drag) increases with the square of airspeed. Induced drag ("the price of lift") varies inversely with airspeed — high at low speed (high AOA needed), low at high speed. Total drag = parasite + induced, summing to a minimum at L/D-MAX.',
 zh:'寄生阻力（形狀阻力＋干擾阻力＋表面摩擦阻力）隨空速平方增加。誘導阻力（「升力的代價」）則與空速成反比——低速（需要高攻角）時較大，高速時較小。總阻力＝寄生阻力＋誘導阻力，兩者相加的總和在L/D-MAX處達到最小值。'},
{t:'img', src:'figs/ch5/fig5-7.png', en:'Figure 5-7. Form drag.', zh:'圖5-7。形狀阻力。'},
{t:'img', src:'figs/ch5/fig5-8.png', en:'Figure 5-8. A wing root can cause interference drag.', zh:'圖5-8。翼根處可能產生干擾阻力。'},

{t:'h2', en:'Wingtip Vortices', zh:'翼尖渦流'},
{t:'p', en:'High pressure under the wing spills around the wingtip to the low pressure above → rotating vortex trails behind each wingtip. Vortex strength is greatest when the generating aircraft is heavy, clean (gear/flaps up), and slow (high AOA).',
 zh:'機翼下方的高壓氣流繞過翼尖，流向上方的低壓區→在每個翼尖後方形成旋轉的渦流。當產生渦流的飛機越重、外形越乾淨（起落架／襟翼收起）、速度越慢（攻角越大），渦流強度就越強。'},
{t:'img', src:'figs/ch5/fig5-9.png', en:'Figure 5-9. Wingtip vortex from a crop duster.', zh:'圖5-9。農業噴灑機所產生的翼尖渦流。'},
{t:'img', src:'figs/ch5/fig5-10.png', en:'Figure 5-10. The difference in wingtip vortex size at altitude versus near the ground.', zh:'圖5-10。翼尖渦流在高空與近地面時大小的差異。'},
{t:'img', src:'figs/ch5/fig5-11.png', en:'Figure 5-11. The difference in downwash at altitude versus near the ground.', zh:'圖5-11。下洗流在高空與近地面時的差異。'},
{t:'img', src:'figs/ch5/fig5-12.png', en:'Figure 5-12. Wingtip vortices.', zh:'圖5-12。翼尖渦流。'},
{t:'p', en:'Avoiding wake turbulence: rotate prior to the point where the preceding aircraft rotated, stay above its flight path; when landing behind a larger aircraft, land beyond its touchdown point; avoid flight below/behind another aircraft\'s flight path.',
 zh:'避免尾流亂流的方法：在前機拉起點之前就先拉起，並保持在其飛行路徑上方；在較大型飛機後方落地時，須落於其觸地點之後；避免飛行於其他飛機飛行路徑的下方或後方。'},
{t:'img', src:'figs/ch5/fig5-13.png', en:'Figure 5-13. Avoid following another aircraft at an altitude within 1,000 feet.', zh:'圖5-13。應避免在另一架飛機下方1,000呎範圍內尾隨飛行。'},
{t:'img', src:'figs/ch5/fig5-14.png', en:'Figure 5-14. Avoid turbulence from another aircraft.', zh:'圖5-14。應避免另一架飛機所產生的亂流。'},
{t:'img', src:'figs/ch5/fig5-15.png', en:'Figure 5-15. When the vortices of larger aircraft sink close to the ground, they tend to move laterally over the ground; a crosswind changes the drift of the upwind and downwind vortices.', zh:'圖5-15。當大型飛機的渦流下沉接近地面時，會沿地面橫向移動；側風會改變上風側與下風側渦流的飄移情形。'},

{t:'h2', en:'Ground Effect', zh:'地面效應'},
{t:'p', en:'Within about one wingspan of the surface, airflow/wingtip vortices are restricted → reduces induced drag, changes thrust required. In ground effect: less induced drag, less AOA needed, reduced elevator down-force needed (tendency to pitch up). Aircraft can seem to "float" landing (excess speed in ground effect); on takeoff, may become airborne before reaching safe climb speed, then settle back as it climbs out of ground effect.',
 zh:'在距地面約一個翼展以內的高度，氣流與翼尖渦流會受到限制→降低誘導阻力，並改變所需推力。處於地面效應中：誘導阻力較小、所需攻角較小、升降舵所需的下壓力也較小（有機首上仰的傾向）。落地時飛機可能會出現「飄浮」感（地面效應中速度過剩）；起飛時，飛機可能在達到安全爬升速度前就先離地，離開地面效應範圍爬升時則可能再度下沉。'},
{t:'img', src:'figs/ch5/fig5-16.png', en:'Figure 5-16. Ground effect changes airflow.', zh:'圖5-16。地面效應會改變氣流型態。'},
{t:'img', src:'figs/ch5/fig5-17.png', en:'Figure 5-17. Ground effect changes drag and lift.', zh:'圖5-17。地面效應會改變阻力與升力。'},

{t:'h2', en:'Axes of an Aircraft', zh:'飛機的三軸'},
{t:'p', en:'Longitudinal axis (nose-to-tail) → rolling → ailerons. Lateral axis (wingtip-to-wingtip) → pitching → elevator/stabilator. Vertical axis (top-to-bottom through CG) → yawing → rudder.',
 zh:'縱軸（機首至機尾）→滾轉→由副翼控制。橫軸（翼尖至翼尖）→俯仰→由升降舵／全動平尾控制。垂直軸（通過重心的上下方向）→偏航→由方向舵控制。'},
{t:'img', src:'figs/ch5/fig5-18.png', en:'Figure 5-18. Axes of an airplane.', zh:'圖5-18。飛機的三軸。'},
{t:'img', src:'figs/ch5/fig5-19.png', en:'Figure 5-19. A weight-shift control aircraft.', zh:'圖5-19。重心操控式飛行器。'},
{t:'img', src:'figs/ch5/fig5-20.png', en:'Figure 5-20. A powered parachute.', zh:'圖5-20。動力傘。'},

{t:'h2', en:'Aircraft Design Characteristics — Stability', zh:'飛機設計特性——穩定性'},
{t:'h3', en:'Static and Dynamic Stability', zh:'靜穩定性與動穩定性'},
{t:'p', en:'Positive static stability — initial tendency to return toward equilibrium after a disturbance. Neutral — tendency to remain in the new position. Negative (instability) — tendency to continue diverging. Dynamic stability describes the response over time: damped (oscillations decrease, positive), neutral (constant amplitude), divergent (oscillations increase, negative).',
 zh:'正靜穩定性——受到擾動後，有回到平衡狀態的初始傾向。中性靜穩定性——傾向維持在新的位置。負靜穩定性（不穩定）——傾向持續偏離。動穩定性描述的則是隨時間演變的反應：阻尼型（振盪逐漸減小，屬正動穩定）、中性型（振幅維持不變）、發散型（振盪逐漸增大，屬負動穩定）。'},
{t:'img', src:'figs/ch5/fig5-21.png', en:'Figure 5-21. Types of static stability.', zh:'圖5-21。靜穩定性的類型。'},
{t:'img', src:'figs/ch5/fig5-22.png', en:'Figure 5-22. Damped versus undamped stability.', zh:'圖5-22。阻尼與無阻尼穩定性的比較。'},
{t:'h3', en:'Longitudinal Stability (Pitching)', zh:'縱向穩定性（俯仰）'},
{t:'p', en:'The most important stability an aircraft should possess. CG typically forward of the wing\'s center of lift → constant nose-down tendency, balanced by a down load on the horizontal tail. Aft CG → less stable, more responsive, easier to stall. Forward CG → more stable, higher control forces, especially at low speed.',
 zh:'飛機最重要應具備的穩定性。重心通常位於機翼升力中心之前→產生持續的機首下俯傾向，並靠水平尾翼上的向下負荷來平衡。重心偏後→穩定性較差、操縱反應較靈敏、也更容易失速。重心偏前→穩定性較佳，但操縱桿力較大，尤其在低速時更為明顯。'},
{t:'img', src:'figs/ch5/fig5-23.png', en:'Figure 5-23. Longitudinal stability.', zh:'圖5-23。縱向穩定性。'},
{t:'img', src:'figs/ch5/fig5-24.png', en:'Figure 5-24. Effect of speed on downwash.', zh:'圖5-24。速度對下洗流的影響。'},
{t:'img', src:'figs/ch5/fig5-25.png', en:'Figure 5-25. Reduced power allows pitch down.', zh:'圖5-25。減少動力會使機首下俯。'},
{t:'img', src:'figs/ch5/fig5-26.png', en:'Figure 5-26. Thrust line affects longitudinal stability.', zh:'圖5-26。推力線位置會影響縱向穩定性。'},
{t:'img', src:'figs/ch5/fig5-27.png', en:'Figure 5-27. Power changes affect longitudinal stability.', zh:'圖5-27。動力變化會影響縱向穩定性。'},
{t:'h3', en:'Lateral Stability (Rolling)', zh:'側向穩定性（滾轉）'},
{t:'p', en:'Primary design feature: dihedral (wings angled upward from root to tip) — in a sideslip, the lower wing has a greater effective AOA → generates more lift → rolls back level. Sweepback also contributes. Keel effect: high-wing aircraft — the fuselage hangs like a pendulum below the wing\'s CL, naturally righting the aircraft — more laterally stable than low-wing designs.',
 zh:'主要設計特徵：上反角（機翼由翼根至翼尖向上傾斜）——側滑時，下方機翼的有效攻角較大→產生較多升力→使飛機滾轉回水平狀態。後掠角也有助於此效果。龍骨效應：高單翼飛機的機身如同鐘擺般懸掛在機翼升力中心下方，能自然地使飛機回正——因此側向穩定性比低單翼設計更佳。'},
{t:'img', src:'figs/ch5/fig5-28.png', en:'Figure 5-28. Dihedral is the upward angle of the wings from a horizontal axis.', zh:'圖5-28。上反角即機翼相對於水平軸向上傾斜的角度。'},
{t:'img', src:'figs/ch5/fig5-29.png', en:'Figure 5-29. Sideslip causing different AOA on each wing.', zh:'圖5-29。側滑導致兩側機翼產生不同的攻角。'},
{t:'img', src:'figs/ch5/fig5-30.png', en:'Figure 5-30. Sweepback wings.', zh:'圖5-30。後掠翼。'},
{t:'img', src:'figs/ch5/fig5-31.png', en:'Figure 5-31. Keel area for lateral stability.', zh:'圖5-31。有助於側向穩定性的龍骨面積。'},
{t:'h3', en:'Directional Stability (Yawing)', zh:'方向穩定性（偏航）'},
{t:'p', en:'Achieved mainly via the vertical stabilizer/fin — acts like a weathervane, keeping the nose pointed into the relative wind.',
 zh:'主要透過垂直安定面／垂尾達成——作用如同風向標，使機首保持指向相對氣流的方向。'},
{t:'img', src:'figs/ch5/fig5-32.png', en:'Figure 5-32. Fuselage and fin for directional stability.', zh:'圖5-32。機身與垂尾對方向穩定性的貢獻。'},
{t:'h3', en:'Spiral Instability', zh:'螺旋不穩定'},
{t:'p', en:'Occurs when directional stability is strong relative to lateral (dihedral) stability — a disturbed aircraft tends to increase bank in a slow spiral rather than return to wings-level; pilot must actively correct.',
 zh:'當方向穩定性相對於側向（上反角）穩定性過強時會發生此現象——受擾動的飛機會傾向於在緩慢的螺旋中持續增加坡度，而非自行恢復水平；飛行員必須主動修正。'},

{t:'h2', en:'Effect of Wing Planform', zh:'機翼平面形狀的影響'},
{t:'p', en:'Aspect ratio (span²/area) — higher aspect ratio (long, narrow wings, e.g., gliders) = more efficient lift/less induced drag but structurally heavier and less maneuverable; lower aspect ratio = more induced drag but lighter/more maneuverable.',
 zh:'展弦比（翼展²÷面積）——展弦比越高（機翼細長，例如滑翔機），升力效率越高、誘導阻力越小，但結構較重、機動性較差；展弦比越低則誘導阻力較大，但結構較輕、機動性較佳。'},
{t:'img', src:'figs/ch5/fig5-33.png', en:'Figure 5-33. Different types of wing planforms.', zh:'圖5-33。不同類型的機翼平面形狀。'},

{t:'h2', en:'Aerodynamic Forces in Flight Maneuvers', zh:'飛行機動中的空氣動力'},
{t:'p', en:'Banking splits lift into a vertical component (opposing weight) and a horizontal component (turning force). Steeper bank → more back pressure/higher AOA needed to maintain altitude → higher stall speed and load factor. Slipping turn = insufficient rate of turn for the bank angle; skidding turn = excess rate of turn for the bank angle.',
 zh:'坡度會將升力分解為垂直分量（對抗重量）與水平分量（轉彎力）。坡度越陡→需要越大的拉桿力／攻角才能維持高度→失速速度與負載因數也隨之提高。內滑轉彎＝坡度相對於轉彎率而言過大；外滑轉彎＝坡度相對於轉彎率而言過小。'},
{t:'img', src:'figs/ch5/fig5-34.png', en:'Figure 5-34. Forces during normal, coordinated turn at constant altitude.', zh:'圖5-34。等高度正常協調轉彎時的各力。'},
{t:'img', src:'figs/ch5/fig5-35.png', en:'Figure 5-35. Normal, slipping, and skidding turns at a constant altitude.', zh:'圖5-35。等高度下的正常轉彎、內滑轉彎與外滑轉彎。'},
{t:'img', src:'figs/ch5/fig5-36.png', en:'Figure 5-36. Changes in lift during climb entry.', zh:'圖5-36。進入爬升時升力的變化。'},
{t:'img', src:'figs/ch5/fig5-37.png', en:'Figure 5-37. Changes in speed during climb entry.', zh:'圖5-37。進入爬升時速度的變化。'},

{t:'h2', en:'Stalls', zh:'失速'},
{t:'p', en:'A stall = a rapid decrease in lift caused by exceeding the critical AOA — can occur at any airspeed, any attitude, any power setting. Stalling speed increases with load factor (steep turns, abrupt maneuvers) and with weight — in a turn, stall speed increases in proportion to the square root of the load factor (e.g., 60° bank = 2G → stall speed increases by √2 ≈ 1.41×).',
 zh:'失速＝因超過臨界攻角而導致升力急遽下降——可能發生在任何空速、任何姿態、任何動力設定下。失速速度會隨負載因數（陡坡轉彎、劇烈機動）與重量增加而提高——在轉彎中，失速速度的增加幅度與負載因數的平方根成正比（例如60°坡度＝2G負載→失速速度增加約√2≈1.41倍）。'},
{t:'img', src:'figs/ch5/fig5-38.png', en:'Figure 5-38. Forces exerted when pulling out of a dive.', zh:'圖5-38。俯衝改出時所承受的各力。'},
{t:'img', src:'figs/ch5/fig5-39.png', en:'Figure 5-39. Increase in stall speed and load factor.', zh:'圖5-39。失速速度與負載因數的增加情形。'},
{t:'img', src:'figs/ch5/fig5-40.png', en:'Figure 5-40. Inflight ice formation.', zh:'圖5-40。飛行中結冰的情形。'},

{t:'h2', en:'Angle of Attack Indicators', zh:'攻角指示器'},
{t:'p', en:'Directly displays proximity to critical AOA, regardless of weight, bank angle, temperature, density altitude, or CG — unlike airspeed alone, which only reflects a safe stall margin for one specific weight/config/load-factor combination. Promoted by the FAA/GAJSC to reduce loss-of-control (LOC) accidents.',
 zh:'能直接顯示飛機與臨界攻角之間的距離，且不受重量、坡度、溫度、密度高度或重心影響——這點與單純的空速指示不同，空速僅能反映特定重量／構型／負載因數組合下的失速安全餘裕。FAA與GAJSC推廣此裝置以降低失控（LOC）事故的發生。'},
{t:'img', src:'figs/ch5/fig5-41.png', en:'Figure 5-41. A variety of AOA indicators.', zh:'圖5-41。各式各樣的攻角指示器。'},
{t:'img', src:'figs/ch5/fig5-42.png', en:'Figure 5-42. An AOA indicator has several benefits when installed in general aviation aircraft.', zh:'圖5-42。攻角指示器裝設於通用航空飛機時具有多項優點。'},

{t:'h2', en:'Basic Propeller Principles', zh:'螺旋槳基本原理'},
{t:'p', en:'A rotating propeller is essentially an airfoil, generating thrust the same way a wing generates lift. Fixed-pitch propeller — one blade angle, a compromise between climb and cruise. Constant-speed propeller — automatically adjusts blade angle to maintain a set rpm regardless of airspeed/power.',
 zh:'旋轉中的螺旋槳本質上就是一種翼型，其產生推力的方式與機翼產生升力的原理相同。固定槳距螺旋槳——只有單一槳葉角度，須在爬升與巡航效能之間取捨。定速螺旋槳——會自動調整槳葉角度，無論空速或動力如何變化，都能維持設定的轉速。'},
{t:'img', src:'figs/ch5/fig5-43.png', en:'Figure 5-43. Airfoil sections of propeller blade.', zh:'圖5-43。螺旋槳槳葉的翼型剖面。'},
{t:'img', src:'figs/ch5/fig5-44.png', en:'Figure 5-44. Propeller blade angle.', zh:'圖5-44。螺旋槳槳葉角。'},
{t:'img', src:'figs/ch5/fig5-45.png', en:'Figure 5-45. Propeller slippage.', zh:'圖5-45。螺旋槳滑移。'},
{t:'img', src:'figs/ch5/fig5-46.png', en:'Figure 5-46. Propeller tips travel faster than the hub.', zh:'圖5-46。螺旋槳槳尖的移動速度比槳轂處更快。'},
{t:'h3', en:'Torque and P-Factor', zh:'扭力與P效應'},
{t:'p', en:'4 elements causing left-turning tendency (standard-rotation prop, most pronounced at high power/low airspeed/high AOA, e.g., takeoff): (1) Torque reaction — Newton\'s 3rd law reaction to the engine turning the prop. (2) Corkscrewing effect — spiraling slipstream strikes the vertical stabilizer from the left. (3) Gyroscopic action — a force applied to the spinning prop is felt 90° later in the direction of rotation. (4) Asymmetric loading (P-factor) — at high AOA, the descending propeller blade generates more thrust than the ascending blade.',
 zh:'導致左偏傾向的四種因素（適用於標準旋轉方向的螺旋槳，在高動力／低空速／高攻角時最明顯，例如起飛階段）：（1）扭力反作用——牛頓第三定律對引擎轉動螺旋槳所產生的反作用力。（2）螺旋效應——呈螺旋狀的滑流會吹擊垂直安定面的左側。（3）陀螺進動效應——施加於旋轉中螺旋槳上的力，其效果會在旋轉方向上延遲90°才顯現。（4）不對稱負載（P效應）——在高攻角時，下降側槳葉產生的推力比上升側槳葉更大。'},
{t:'img', src:'figs/ch5/fig5-47.png', en:'Figure 5-47. Torque reaction.', zh:'圖5-47。扭力反作用。'},
{t:'img', src:'figs/ch5/fig5-48.png', en:'Figure 5-48. Corkscrewing slipstream.', zh:'圖5-48。螺旋狀滑流。'},
{t:'img', src:'figs/ch5/fig5-49.png', en:'Figure 5-49. Gyroscopic precession.', zh:'圖5-49。陀螺進動。'},
{t:'img', src:'figs/ch5/fig5-50.png', en:'Figure 5-50. Raising tail produces gyroscopic precession.', zh:'圖5-50。抬起機尾會產生陀螺進動效應。'},
{t:'img', src:'figs/ch5/fig5-51.png', en:'Figure 5-51. Asymmetrical loading of propeller (P-factor).', zh:'圖5-51。螺旋槳的不對稱負載（P效應）。'},

{t:'h2', en:'Load Factors', zh:'負載因數'},
{t:'p', en:'Load factor = the ratio of the load supported by the wings to the actual weight of the aircraft (units of G). Limit load factors by category: Normal 3.8 to −1.52; Utility 4.4 to −1.76; Acrobatic 6.0 to −3.00.',
 zh:'負載因數＝機翼所承受的負荷與飛機實際重量的比值（單位為G）。依類別劃分的限制負載因數：正常類3.8至−1.52；效用類4.4至−1.76；特技類6.0至−3.00。'},
{t:'img', src:'figs/ch5/fig5-52.png', en:'Figure 5-52. Two forces cause load factor during turns.', zh:'圖5-52。轉彎時由兩種力所產生的負載因數。'},
{t:'p', en:'Load factor rises steeply with bank angle in a level, coordinated turn: 60° bank = 2G; 80° bank ≈ 5.76G — increase becomes very rapid past 45°. Any aircraft can be stalled at any airspeed; increased load factor increases stalling speed by the square root of the load factor.',
 zh:'在水平協調轉彎中，負載因數會隨坡度增加而急遽上升：60°坡度＝2G；80°坡度≈5.76G——超過45°後增加幅度變得非常快。任何飛機在任何空速下都可能發生失速；負載因數增加時，失速速度會依負載因數的平方根倍數提高。'},
{t:'img', src:'figs/ch5/fig5-53.png', en:'Figure 5-53. Angle of bank changes load factor in level flight.', zh:'圖5-53。平飛時坡度角改變負載因數的情形。'},
{t:'img', src:'figs/ch5/fig5-54.png', en:'Figure 5-54. Load factor changes stall speed.', zh:'圖5-54。負載因數改變失速速度的情形。'},
{t:'h3', en:'Vg Diagram', zh:'Vg圖'},
{t:'p', en:'Plots load factor (G) vs. indicated airspeed. Intersection of the positive limit load factor line and the max-lift curve = maneuvering speed (VA) — below VA, the aircraft will stall before structural damage occurs even at full abrupt control deflection; above VA, structural damage can occur before a stall develops.',
 zh:'繪製負載因數（G）與指示空速的關係圖。正限制負載因數線與最大升力曲線的交點＝機動速度（VA）——低於VA時，即使猛烈滿舵操縱，飛機也會先失速而非結構受損；高於VA時，則可能在失速發生前就先造成結構損傷。'},
{t:'img', src:'figs/ch5/fig5-55.png', en:'Figure 5-55. Typical Vg diagram.', zh:'圖5-55。典型的Vg圖。'},
{t:'h3', en:'Rate and Radius of Turn', zh:'轉彎率與轉彎半徑'},
{t:'p', en:'ROT (degrees/sec) = 1,091 × tan(bank angle) ÷ airspeed (kt TAS) — increasing airspeed at a constant bank angle decreases ROT. Radius of turn: doubling speed at the same bank angle quadruples the radius.',
 zh:'轉彎率（度／秒）＝1,091×tan（坡度）÷空速（節，真空速）——在坡度不變的情況下，空速增加會降低轉彎率。轉彎半徑：在相同坡度下，速度加倍，轉彎半徑則會變為4倍。'},
{t:'img', src:'figs/ch5/fig5-56.png', en:'Figure 5-56. Rate of turn for a given airspeed (knots, TAS) and bank angle.', zh:'圖5-56。特定空速（節，真空速）與坡度下的轉彎率。'},
{t:'img', src:'figs/ch5/fig5-57.png', en:'Figure 5-57. Rate of turn when increasing speed.', zh:'圖5-57。速度增加時的轉彎率。'},
{t:'img', src:'figs/ch5/fig5-58.png', en:'Figure 5-58. To achieve the same rate of turn at higher speed, an increase of bank angle is required.', zh:'圖5-58。若要在更高速度下維持相同轉彎率，須增加坡度角。'},
{t:'img', src:'figs/ch5/fig5-59.png', en:'Figure 5-59. Radius at 120 knots with bank angle of 30°.', zh:'圖5-59。120節、坡度30°時的轉彎半徑。'},
{t:'img', src:'figs/ch5/fig5-60.png', en:'Figure 5-60. Radius at 240 knots.', zh:'圖5-60。240節時的轉彎半徑。'},
{t:'img', src:'figs/ch5/fig5-61.png', en:'Figure 5-61. Another formula that can be used for radius.', zh:'圖5-61。另一種可用於計算轉彎半徑的公式。'},
{t:'img', src:'figs/ch5/fig5-62.png', en:'Figure 5-62. Airspeed is the most influential factor in determining how much distance is required to turn — two aircraft flying into a 5,000-foot-wide canyon at 120 knots versus 140 knots, both using a 30° bank angle.', zh:'圖5-62。空速是決定轉彎所需距離的最關鍵因素——兩架飛機以30°坡度飛入寬5,000呎的峽谷，一架時速120節、另一架140節的比較。'},

{t:'h2', en:'Weight and Balance', zh:'重量與平衡'},
{t:'p', en:'CG position affects lift, AOA, tail load, and elevator control force. Forward CG → aircraft is "heavier"/slower, stalls at a higher speed, requires higher elevator control forces, but is more stable. Aft CG → less drag/faster cruise, but less stable and more difficult to recover from a stall or spin; loaded too far aft, a "flat spin" can develop that cannot be recovered from.',
 zh:'重心位置會影響升力、攻角、尾翼負載與升降舵操縱力。重心偏前→飛機較「重」、速度較慢，失速速度較高，升降舵所需操縱力較大，但穩定性較佳。重心偏後→阻力較小、巡航速度較快，但穩定性較差，也較難從失速或尾旋中改出；若重心過度偏後，甚至可能發生無法改出的「平尾旋」。'},
{t:'img', src:'figs/ch5/fig5-63.png', en:'Figure 5-63. Effect of load distribution on balance.', zh:'圖5-63。載重分布對平衡的影響。'},

{t:'h2', en:'High Speed Flight', zh:'高速飛行'},
{t:'p', en:'Critical Mach number — the flight Mach number at which airflow first reaches Mach 1.0 somewhere on the airframe (typically over the wing). Transonic range — mixed subsonic/supersonic flow simultaneously. Supersonic range — airflow over the entire aircraft is supersonic.',
 zh:'臨界馬赫數——機身上（通常是機翼表面）某處氣流首次達到馬赫1.0時的飛行馬赫數。穿音速範圍——同時存在次音速與超音速混合氣流。超音速範圍——整架飛機周圍的氣流皆為超音速。'},
{t:'img', src:'figs/ch5/fig5-64.png', en:'Figure 5-64. Wing airflow.', zh:'圖5-64。機翼周圍的氣流。'},
{t:'img', src:'figs/ch5/fig5-65.png', en:'Figure 5-65. Critical Mach.', zh:'圖5-65。臨界馬赫數。'},
{t:'img', src:'figs/ch5/fig5-66.png', en:'Figure 5-66. Boundary layer.', zh:'圖5-66。邊界層。'},
{t:'p', en:'Shock waves form as a boundary between supersonic/subsonic flow — cause a sudden pressure/density rise and sharp drag increase ("wave drag"). Sweepback delays the onset of critical Mach number, but swept wings tend to stall first at the wingtips (reduces aileron effectiveness, can cause a pitch-up tendency).',
 zh:'震波形成於超音速與次音速氣流的邊界——會造成壓力與密度的急遽上升，並使阻力大幅增加（「波阻」）。後掠角能延緩達到臨界馬赫數的時機，但後掠翼容易先從翼尖開始失速（降低副翼效能，並可能導致機首上仰傾向）。'},
{t:'img', src:'figs/ch5/fig5-67.png', en:'Figure 5-67. Shock waves.', zh:'圖5-67。震波。'},
{t:'img', src:'figs/ch5/fig5-68.png', en:'Figure 5-68. Sweepback effect.', zh:'圖5-68。後掠角效應。'},
{t:'img', src:'figs/ch5/fig5-69.png', en:'Figure 5-69. Wingtip pre-stall.', zh:'圖5-69。翼尖失速前的狀態。'},
{t:'img', src:'figs/ch5/fig5-70.png', en:'Figure 5-70. T-tail stall.', zh:'圖5-70。T型尾翼失速。'},
{t:'p', en:'Mach buffet = airframe buffeting from airflow separation/shock waves at high Mach number — occurs when flown too slow for weight/altitude/G-loading (low-speed stall) or too fast (high-speed/Mach buffet); both boundaries narrow with altitude, converging at very high altitude ("coffin corner").',
 zh:'馬赫抖振＝在高馬赫數下，因氣流分離或震波所造成的機身抖動——可能發生在相對於重量／高度／G負載而言飛得太慢（低速失速）或太快（高速／馬赫抖振）的情況下；這兩個邊界都會隨高度上升而逐漸收窄，在極高高度時甚至可能重疊（俗稱「棺材角」）。'},
{t:'img', src:'figs/ch5/fig5-71.png', en:'Figure 5-71. Control surfaces.', zh:'圖5-71。操縱面。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'The most complex and technically detailed chapter of the handbook — covers the aerodynamic principles governing lift/drag/stability/load factors/high-speed flight that pilots need to understand aircraft performance and limitations.',
 zh:'本書技術內容最複雜、最詳盡的一章——涵蓋升力、阻力、穩定性、負載因數與高速飛行等空氣動力原理，這些都是飛行員理解飛機性能與限制所必須具備的知識。'}
  ]
},
{
  id:'ch7', num:7,
  titleEn:'Chapter 7 — Aircraft Systems',
  titleZh:'第七章 — 飛機系統',
  subEn:'Original pages 7-1 to 7-41.',
  subZh:'原文頁碼 7-1 至 7-41。',
  blocks:[
{t:'h2', en:'Powerplant — Reciprocating Engines', zh:'動力系統——活塞式引擎'},
{t:'p', en:'4-stroke cycle: Intake (fuel-air mixture drawn in) → Compression (mixture compressed) → Power (spark ignites, expanding gas drives piston) → Exhaust (burned gases pushed out). Dual ignition (2 magnetos, 2 spark plugs per cylinder) — redundancy + more complete/faster combustion.',
 zh:'四行程循環：進氣（吸入油氣混合物）→壓縮（混合氣被壓縮）→動力（火星塞點火，膨脹氣體推動活塞）→排氣（燃燒後的廢氣被排出）。雙點火系統（2具磁電機、每缸2個火星塞）——提供備援，同時使燃燒更完全、更快速。'},
{t:'h2', en:'Propeller', zh:'螺旋槳'},
{t:'p', en:'Fixed-pitch propeller — blade angle set by the manufacturer, cannot be changed in flight; a compromise between climb and cruise efficiency. Adjustable-pitch (constant-speed) propeller — a governor automatically adjusts blade angle to maintain a selected rpm regardless of airspeed/power.',
 zh:'固定槳距螺旋槳——槳葉角度由製造商設定，飛行中無法調整；須在爬升效率與巡航效率之間取捨。可調槳距（定速）螺旋槳——調速器會自動調整槳葉角度，無論空速或動力如何變化，都能維持設定的轉速。'},

{t:'h2', en:'Induction Systems', zh:'進氣系統'},
{t:'p', en:'2 types: carburetor system (mixes fuel/air before the intake manifold) and fuel injection system (mixes fuel/air at each cylinder).', zh:'兩種類型：化油器系統（在進入進氣歧管之前混合油氣）與燃油噴射系統（在每個汽缸處混合油氣）。'},
{t:'h3', en:'Carburetor Icing', zh:'化油器結冰'},
{t:'p', en:'Venturi effect + fuel vaporization both cause a temperature drop in the carburetor throat (can be 60–70°F below ambient) → ice can form even in above-freezing ambient temps with high relative humidity; most likely at low power settings. First indication: gradual loss of rpm (fixed-pitch) or manifold pressure (constant-speed), often followed by engine roughness.',
 zh:'文氏管效應與燃油汽化兩者都會造成化油器喉部溫度下降（可能比外界氣溫低60–70°F）→即使外界氣溫高於冰點，只要相對濕度高，仍可能結冰；在低動力設定時最容易發生。最初徵兆：轉速逐漸下降（固定槳距）或歧管壓力逐漸下降（定速槳），常伴隨引擎運轉不平順。'},
{t:'p', en:'Carburetor heat — anti-icing system routing air across a heat exchanger on the exhaust manifold; use causes a decrease in engine power and a richer mixture. Should not generally be used as a preventive measure at full power (reduces detonation margin).',
 zh:'化油器加溫——一種防冰系統，將空氣導引通過排氣歧管上的熱交換器；使用時會使引擎動力下降，並使混合比變濃。一般不建議在全動力狀態下作為預防性措施使用（會降低爆震的安全餘裕）。'},
{t:'h3', en:'Fuel Injection Systems', zh:'燃油噴射系統'},
{t:'p', en:'Advantages: reduced evaporative icing risk, better fuel flow, faster throttle response, more precise mixture control, better fuel distribution across cylinders, easier cold-weather starts. Disadvantages: harder hot-engine starting, vapor lock risk on hot days, restart difficulty after an engine-driven pump failure.',
 zh:'優點：降低蒸發結冰風險、燃油流量較佳、油門反應較快、混合比控制更精確、各缸燃油分配更均勻、寒冷天氣較容易啟動。缺點：熱車較難啟動、炎熱天氣有氣阻風險、引擎驅動幫浦故障後較難重新啟動。'},

{t:'h2', en:'Superchargers and Turbosuperchargers', zh:'機械增壓器與渦輪增壓器'},
{t:'p', en:'Both increase induction air density beyond ram air alone, to maintain sea-level-equivalent (or better) power at altitude. Superchargers — engine-driven (gear-driven off the crankshaft). Turbosuperchargers — driven by exhaust gas energy rather than engine power directly, a key efficiency advantage since it doesn\'t rob crankshaft power; can maintain sea-level manifold pressure much higher into the flight envelope (extends the aircraft\'s critical altitude).',
 zh:'兩者都能提升進氣空氣密度（超越僅靠衝壓空氣所能達到的程度），使飛機在高空仍能維持海平面等效（甚至更高）的動力。機械增壓器——由引擎驅動（透過曲軸齒輪傳動）。渦輪增壓器——由排氣能量驅動，而非直接消耗引擎動力，這是其相較機械增壓器的關鍵效率優勢，因為不會佔用曲軸動力；能在更高的飛行高度範圍內維持海平面歧管壓力（延伸飛機的臨界高度）。'},

{t:'h2', en:'Ignition System', zh:'點火系統'},
{t:'p', en:'Magneto — self-contained, engine-driven, generates its own electrical current via a permanent magnet, independent of the aircraft\'s electrical/battery system — spark plugs will still fire even with a total electrical system failure. Dual magneto system (standard) — 2 independent magnetos, each firing one of the 2 spark plugs per cylinder.',
 zh:'磁電機——獨立自足、由引擎驅動，透過永久磁鐵自行產生電流，不依賴飛機的電力／電瓶系統——即使整個電力系統完全失效，火星塞仍能持續點火。雙磁電機系統（標準配置）——2具獨立的磁電機，各自負責每缸2個火星塞中的其中一個。'},

{t:'h2', en:'Oil Systems', zh:'滑油系統'},
{t:'p', en:'4 functions: reduces friction (cooling/lubrication), removes heat from cylinders, seals between cylinder walls and pistons, carries away contaminants. Oil pressure gauge — direct indication; should register within a few seconds of starting. Oil temperature gauge — indirect and delayed reading of overall engine temperature.',
 zh:'四大功能：降低摩擦（冷卻／潤滑）、帶走汽缸熱量、密封汽缸壁與活塞之間的間隙、帶走污染物。油壓表——直接指示；啟動後應在數秒內顯示讀數。油溫表——間接且延遲地反映引擎整體溫度。'},

{t:'h2', en:'Engine Cooling / Exhaust / Ignition Hazards', zh:'引擎冷卻／排氣／燃燒危害'},
{t:'p', en:'Cylinder-head temperature (CHT) gauge — more direct/faster indication than oil temp. EGT (exhaust gas temperature) gauge — used for leaning the mixture (peak EGT = leanest usable mixture for a given power setting).',
 zh:'汽缸頭溫度（CHT）表——比油溫表反應更直接、更迅速。排氣溫度（EGT）表——用於調整混合比（EGT峰值＝該動力設定下可用的最貧混合比）。'},
{t:'p', en:'Detonation — uncontrolled, explosive burning of the fuel-air mixture; characterized by high CHT and engine roughness; causes: lower fuel grade than specified, high manifold pressure with low rpm, excessively lean mixture at high power. Preignition — fuel-air mixture ignites prior to the timed spark, from a residual hot spot in the combustion chamber.',
 zh:'爆震——油氣混合物發生失控、爆炸性的燃燒，而非正常漸進式燃燒；特徵為汽缸頭溫度升高、引擎運轉不平順；成因包括：使用低於規定標號的燃油、高歧管壓力搭配低轉速、高動力時混合比過貧。早燃——油氣混合物在正常點火時機之前，因燃燒室內殘留的熱點而提前點燃。'},

{t:'h2', en:'Turbine Engines', zh:'渦輪引擎'},
{t:'table', head:['Type','Notes'], headZh:['類型','說明'], rows:[
  {en:'Turbojet', zh:'渦輪噴射引擎', en2:'All exhaust gas energy converted to thrust through the nozzle — high altitude, high-speed, long-range', zh2:'所有排氣能量皆透過噴嘴轉換為推力——適合高空、高速、長程飛行'},
  {en:'Turboprop', zh:'渦輪螺旋槳引擎', en2:'Turbine drives a reduction-geared propeller — compromise between turbojet and reciprocating/prop', zh2:'渦輪透過減速齒輪驅動螺旋槳——介於渦輪噴射與活塞螺旋槳之間的折衷方案'},
  {en:'Turbofan', zh:'渦輪風扇引擎', en2:'A ducted fan bypasses part of the intake air around the core, mixing with exhaust for added thrust with better fuel efficiency — most modern airliners', zh2:'涵道式風扇讓部分進氣繞過核心機，與排氣混合以增加推力並提升燃油效率——現今大多數客機採用此型式'},
  {en:'Turboshaft', zh:'渦輪軸引擎', en2:'Turbine drives an output shaft (e.g., helicopter rotor via a gearbox) — helicopters, APUs', zh2:'渦輪驅動輸出軸（例如透過減速箱驅動直升機旋翼）——用於直升機、輔助動力單元（APU）'}
]},
{t:'p', en:'EPR (Engine Pressure Ratio) — indicates thrust output. EGT is a critical limiting factor for turbine engines. Torquemeter — measures turboprop/turboshaft power output.',
 zh:'發動機壓力比（EPR）——用以指示推力輸出。排氣溫度（EGT）是渦輪引擎的關鍵限制因子。扭力計——用於測量渦輪螺旋槳／渦輪軸引擎的功率輸出。'},
{t:'p', en:'Foreign Object Damage (FOD) — ingested debris can severely damage compressor/turbine blades. Compressor stalls — imbalance between velocity and blade AOA, often from distorted inlet airflow. Flameout — combustion stops in flight, most commonly from fuel starvation.',
 zh:'外物損傷（FOD）——吸入異物可能嚴重損壞壓縮機或渦輪葉片。壓縮機失速——氣流速度與葉片攻角失衡，常因進氣氣流受到擾亂所致。熄火——飛行中燃燒中止，最常見的原因是燃油供應中斷。'},

{t:'h2', en:'Fuel Systems', zh:'燃油系統'},
{t:'p', en:'Gravity-feed system — tanks mounted above the engine (typically high-wing), fuel flows by gravity alone. Fuel-pump system — needed when tanks are below/level with the engine (typically low-wing). Fuel selector valve — BOTH/LEFT/RIGHT/OFF.',
 zh:'重力供油系統——油箱裝設於引擎上方（通常為高單翼飛機），完全靠重力供油。幫浦供油系統——當油箱低於或與引擎同高時（通常為低單翼飛機）須採用此系統。燃油選擇活門——分為兩箱（BOTH）／左（LEFT）／右（RIGHT）／關閉（OFF）。'},
{t:'p', en:'Fuel grade color coding: AVGAS 80 = Red, AVGAS 100 = Green, AVGAS 100LL = Blue, Jet A = Colorless/straw. Never use auto gas unless specifically authorized (STC).',
 zh:'燃油標號色碼：AVGAS 80＝紅色，AVGAS 100＝綠色，AVGAS 100LL＝藍色，Jet A＝無色或淡黃色。除非有特別核准（STC），否則絕不可使用車用汽油。'},
{t:'p', en:'Fuel contamination causes: inadequate preflight inspection, improperly filtered fuel, tanks stored partially filled (condensation). Drain fuel strainer/tank sumps before each flight. Static electricity: proper grounding sequence during fueling — drum/truck to ground, ground to aircraft, then nozzle to aircraft.',
 zh:'燃油污染的成因：飛行前檢查不確實、加油時濾油不當、油箱長期未加滿存放（導致內部凝結水氣）。每次飛行前應排放油濾與油箱沉澱杯的積水。靜電：加油時須依正確順序接地——油罐車或油桶先接地、地面再接飛機、最後才是油槍接飛機。'},

{t:'h2', en:'Electrical System', zh:'電力系統'},
{t:'p', en:'Engine-driven alternator/generator supplies power and charges the battery. Master/battery switch ON connects battery power to the main bus. Ammeter — center-zero type: positive deflection = battery charging, negative = battery discharging. Voltage regulator — controls charge rate, keeps system voltage within a safe range.',
 zh:'由引擎驅動的交流發電機／發電機供應電力並為電瓶充電。主電源／電瓶開關打開後，會將電瓶電力接上主匯流排。電流表——中心歸零型：指針偏向正值表示電瓶正在充電，偏向負值則表示電瓶正在放電。電壓調節器——控制充電速率，使系統電壓維持在安全範圍內。'},

{t:'h2', en:'Landing Gear', zh:'起落架'},
{t:'p', en:'Tricycle gear advantages: allows more forceful/earlier braking, better forward visibility, tends to prevent ground looping. Tailwheel gear: reduced forward visibility on the ground, more prone to ground loop. Fixed vs. retractable — retractable reduces cruise drag at the cost of weight/complexity.',
 zh:'三點式起落架的優點：可更早、更用力地煞車，前方視野較佳，也較不易發生地面打轉。尾輪式起落架：地面時前方視野較差，較容易發生地面打轉。固定式與可收放式——可收放式能降低巡航阻力，但代價是增加重量與系統複雜度。'},

{t:'h2', en:'Pressurized Aircraft', zh:'加壓艙飛機'},
{t:'p', en:'Cabin pressurization keeps a comfortable/safe cabin altitude while the aircraft flies much higher. Key components: outflow valve (controls cabin pressure), cabin pressure regulator, cabin air pressure safety valve. Cabin differential pressure — the actual structural limit is the pressure difference, not cabin altitude directly. Rapid decompression drastically shortens useful consciousness time.',
 zh:'座艙加壓能在飛機飛航於更高高度的同時，維持座艙處於舒適安全的等效高度。主要元件：排氣活門（控制座艙壓力）、座艙壓力調節器、座艙空氣壓力安全活門。座艙壓差——結構上真正的限制在於座艙內外的壓力差，而非座艙高度本身。快速失壓會大幅縮短有效意識時間。'},

{t:'h2', en:'Oxygen Systems', zh:'氧氣系統'},
{t:'p', en:'Cannula — simple plastic tubing, comfortable, limited to lower altitudes (typically up to 18,000 ft). Diluter-demand — oxygen mixed with cabin air, only during inhalation. Pressure-demand — pressurized airtight mask seal, needed at very high altitudes. Continuous-flow — typically for passengers, uses a reservoir bag. Pulse oximeter — non-invasive blood oxygen saturation measurement.',
 zh:'鼻導管——簡單的塑膠管，配戴舒適，但僅適用於較低高度（通常至18,000呎）。稀釋需氧式——氧氣與座艙空氣混合，僅在吸氣時供應。加壓需氧式——面罩須形成加壓氣密封，適用於極高高度。連續流量式——通常供乘客使用，搭配儲氣袋。脈搏血氧計——非侵入式血氧飽和度測量裝置。'},

{t:'h2', en:'Anti-Ice and Deice Systems', zh:'防冰與除冰系統'},
{t:'p', en:'Most light aircraft have only a heated pitot tube, not full airframe ice protection — not certified for known icing. Inflatable deicing boots — rubber sheets cyclically inflated/deflated to crack off ice. Thermal anti-ice — heated leading edges (turbine aircraft, bleed air). Weeping wing (TKS) — leading-edge panels weep antifreeze fluid.',
 zh:'大多數輕型飛機僅配備加溫式皮托管，並無完整的機身防冰系統——不具備已知結冰條件下飛行的合格認證。充氣式除冰靴——橡膠片週期性充氣與洩氣，藉此震裂並剝除冰層。熱能防冰系統——加溫前緣（渦輪動力飛機，使用引擎抽氣）。滲液式除冰翼（TKS系統）——前緣板滲出防凍液。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Aircraft require various essential systems (powerplant, fuel, electrical, hydraulic, pressurization, oxygen, anti-ice) working together; a pilot must understand the specific systems installed on their aircraft via the AFM/POH.',
 zh:'飛機需要多項重要系統（動力、燃油、電力、液壓、加壓、氧氣、防冰）協同運作；飛行員必須透過AFM／POH了解自己所駕駛飛機上實際裝設的各項系統。'}
  ]
},
{
  id:'ch8', num:8,
  titleEn:'Chapter 8 — Flight Instruments',
  titleZh:'第八章 — 飛航儀表',
  subEn:'Original pages 8-1 to 8-28.',
  subZh:'原文頁碼 8-1 至 8-28。',
  blocks:[
{t:'h2', en:'Pitot-Static Flight Instruments', zh:'皮托靜壓飛航儀表'},
{t:'p', en:'The pitot-static system feeds 3 instruments: altimeter, airspeed indicator (ASI), vertical speed indicator (VSI). Alternate static source (usually inside the flight deck) — using it typically causes: altimeter reads slightly high, ASI reads slightly high, VSI shows a momentary climb indication before stabilizing.',
 zh:'皮托靜壓系統供應三種儀表所需的資訊：高度表、空速表（ASI）、垂直速度表（VSI）。備用靜壓來源（通常位於駕駛艙內）——使用時通常會造成：高度表讀數略偏高、空速表讀數略偏高、垂直速度表會短暫顯示爬升指示後才穩定下來。'},
{t:'h3', en:'Altimeter', zh:'高度表'},
{t:'p', en:'An aneroid barometer — a stack of sealed aneroid wafers expands/contracts with static pressure changes. Pressure: flying from high to low pressure without resetting → actual altitude is lower than indicated ("high to low, look out below"). Temperature: colder-than-standard air is denser → true altitude is lower than indicated for a given pressure altitude.',
 zh:'一種空盒氣壓計——由一疊密封的空盒膜盒組成，會隨靜壓變化而膨脹或收縮。氣壓效應：若未重新設定高度表，從高壓區飛往低壓區時→實際高度會低於指示高度（口訣「從高到低，當心別太低」）。溫度效應：氣溫低於標準值時空氣較密→在相同壓力高度下，真實高度會低於指示高度。'},
{t:'p', en:'Types of altitude: Indicated (read directly), True (actual height above MSL), Absolute (actual height AGL), Pressure (above the Standard Datum Plane), Density (pressure altitude corrected for nonstandard temperature).',
 zh:'高度的種類：指示高度（直接讀取）、真實高度（實際海平面以上的高度）、絕對高度（實際地面以上的高度）、壓力高度（標準基準面以上的高度）、密度高度（依非標準溫度修正後的壓力高度）。'},
{t:'h3', en:'Vertical Speed Indicator (VSI)', zh:'垂直速度表（VSI）'},
{t:'p', en:'A diaphragm receives direct static pressure while the instrument case receives it through a calibrated leak — the pressure differential drives the needle. Trend information shows first, before rate information settles a few seconds later.',
 zh:'膜盒直接接收靜壓，而儀表殼體則透過一個經過校準的洩壓孔接收靜壓——兩者間的壓差驅動指針運作。趨勢資訊會先顯示，之後幾秒才會穩定顯示出速率資訊。'},
{t:'h3', en:'Airspeed Indicator (ASI)', zh:'空速表（ASI）'},
{t:'p', en:'A differential pressure gauge: measures the difference between ram (pitot) pressure and static pressure. Markings: White arc = flap operating range (VS0 to VFE). Green arc = normal operating range (VS1 to VNO). Yellow arc = caution range (VNO to VNE). Red line = VNE.',
 zh:'一種差壓式儀表：測量衝壓（皮托）壓力與靜壓之間的差值。標示：白弧＝襟翼操作範圍（VS0至VFE）。綠弧＝正常操作範圍（VS1至VNO）。黃弧＝警戒範圍（VNO至VNE）。紅線＝VNE。'},
{t:'h3', en:'Blockage of the Pitot-Static System', zh:'皮托靜壓系統阻塞'},
{t:'p', en:'Blocked pitot tube (static clear, drain hole also blocked): ASI acts like an altimeter — reads higher than actual in a climb, lower than actual in a descent. Blocked static port (pitot clear): ASI reads inaccurately (opposite trend); altimeter freezes; VSI reads a constant zero.',
 zh:'皮托管阻塞（靜壓孔暢通、排水孔也一併阻塞）：空速表會表現得如同高度表——爬升時讀數偏高，下降時讀數偏低。靜壓孔阻塞（皮托管暢通）：空速表讀數會不準確（趨勢相反）；高度表指示會凍結不動；垂直速度表則會恆定顯示為零。'},

{t:'h2', en:'Electronic Flight Display (EFD)', zh:'電子飛行顯示器（EFD）'},
{t:'p', en:'Modern glass-cockpit systems (PFD/MFD) present the same pitot-static + gyroscopic information digitally: airspeed tape, attitude indicator, altimeter tape, VSI, heading indicator/HSI, turn indicator. Trend vectors — magenta lines showing where a value will be in the next several seconds if the current rate continues.',
 zh:'現代玻璃座艙系統（PFD／MFD）以數位方式呈現與皮托靜壓＋陀螺儀表相同的資訊：空速帶、姿態指示器、高度帶、垂直速度表、航向指示器／HSI、轉彎指示器。趨勢向量——洋紅色線條，顯示若目前變化速率持續下去，數值在未來幾秒後會落在何處。'},

{t:'h2', en:'Gyroscopic Flight Instruments', zh:'陀螺儀飛行儀表'},
{t:'p', en:'Two fundamental principles: Rigidity in space — a spinning gyroscope resists changes to its plane of rotation. Precession — a force applied to a spinning gyro\'s rim is felt 90° later in the direction of rotation.',
 zh:'兩項基本原理：空間剛性——旋轉中的陀螺會抗拒其旋轉平面發生改變。進動——施加於旋轉陀螺邊緣的力，其效果會在旋轉方向上延遲90°才顯現。'},
{t:'h3', en:'Turn Indicators', zh:'轉彎指示器'},
{t:'p', en:'Turn-and-slip indicator — needle width = one standard-rate turn (3°/sec). Turn coordinator — senses roll rate in addition to yaw rate, giving an earlier indication of a turn\'s onset; "NO PITCH INFORMATION" printed on the face. Inclinometer (ball) — centered = coordinated; low/inside = slipping; outside/high = skidding.',
 zh:'轉彎側滑儀——指針寬度＝一個標準轉彎率（每秒3°）。轉彎協調儀——除了偏航率外還能感測滾轉率，能更早顯示轉彎的開始；儀表面上會印有「NO PITCH INFORMATION」（無俯仰資訊）字樣。傾斜儀（滾珠）——置中＝協調轉彎；偏向內側低處＝內滑；偏向外側高處＝外滑。'},
{t:'h3', en:'Attitude Indicator', zh:'姿態指示器'},
{t:'p', en:'Gyro mounted in the horizontal plane, gives a stable pitch/bank reference (artificial horizon). Older vacuum-driven units may tumble if pitch/bank limits are exceeded.',
 zh:'陀螺儀水平安裝，提供穩定的俯仰／坡度參考（人工地平儀）。較舊的真空驅動型儀表若超過俯仰／坡度限制，可能會發生翻覆（陀螺失效）。'},
{t:'h3', en:'Heading Indicator', zh:'航向指示器'},
{t:'p', en:'Maintains a stable heading reference, since the magnetic compass alone is too erratic in turbulence/turns for reliable reference. Must be periodically realigned to the magnetic compass during straight-and-level, unaccelerated flight (gyro drift/precession error accumulates over time).',
 zh:'提供穩定的航向參考，因為單靠磁羅盤在亂流或轉彎中太不穩定，無法可靠使用。須在平飛、無加速度的飛行狀態下，定期與磁羅盤重新對齊（陀螺會隨時間累積漂移／進動誤差）。'},

{t:'h2', en:'Compass Systems', zh:'羅盤系統'},
{t:'h3', en:'Magnetic Compass Induced Errors', zh:'磁羅盤誤差'},
{t:'p', en:'Variation — angular difference between true north and magnetic north, corrected via an isogonic chart. Deviation — compass error from the aircraft\'s own magnetic interference, corrected via a compass correction card (only AMTs may adjust it).',
 zh:'偏角——真北與磁北之間的角度差，須以等偏線圖修正。羅差——由飛機本身的磁性干擾所造成的羅盤誤差，須以羅差修正卡修正（只有航空維修技術員AMT才能調整）。'},
{t:'p', en:'Northerly turning error — rule of thumb: stop the turn 15° plus half the latitude prior to the desired heading. Southerly turning error — opposite (compass lags, continue turn beyond the heading). Acceleration error (ANDS mnemonic: Accelerate North, Decelerate South) on east/west headings. Oscillation error — combination of all the above.',
 zh:'北向轉彎誤差——經驗法則：在到達目標航向前，提早15°加上緯度一半的角度停止轉彎。南向轉彎誤差——效果相反（羅盤顯示落後，須超過目標航向再停止轉彎）。加減速誤差（口訣ANDS：加速時偏北Accelerate North、減速時偏南Decelerate South），發生在東西向航向飛行時。振盪誤差——上述各種誤差綜合作用的結果。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Flight instruments enable an aircraft to be operated with precision and safety in conditions where outside visual references are inadequate — pilots must understand each instrument\'s principle of operation, normal indications, and failure modes.',
 zh:'飛航儀表使飛機能在外界視覺參考不足的情況下，依然能精確、安全地操作——飛行員必須了解每項儀表的運作原理、正常指示方式，以及可能的故障模式。'}
  ]
},
{
  id:'ch11', num:11,
  titleEn:'Chapter 11 — Aircraft Performance',
  titleZh:'第十一章 — 飛機性能',
  subEn:'Original pages 11-1 to 11-28.',
  subZh:'原文頁碼 11-1 至 11-28。',
  blocks:[
{t:'h2', en:'Climb Performance', zh:'爬升性能'},
{t:'h3', en:'Angle of Climb (AOC) vs. Rate of Climb (ROC)', zh:'爬升角（AOC）與爬升率（ROC）'},
{t:'p', en:'AOC = altitude gained relative to horizontal distance — matters for obstacle clearance. Maximum AOC occurs at the speed giving the greatest excess of thrust over thrust required. ROC = altitude gained relative to time. Maximum ROC occurs at the speed giving the greatest excess of power available over power required.',
 zh:'爬升角（AOC）＝相對於水平飛行距離所獲得的高度——與越障能力有關。最大爬升角發生在「可用推力超過所需推力」差值最大的速度。爬升率（ROC）＝相對於時間所獲得的高度。最大爬升率發生在「可用功率超過所需功率」差值最大的速度。'},
{t:'p', en:'Absolute ceiling — altitude where climb rate = zero. Service ceiling — altitude where max ROC drops to a small standard value (100 fpm for most light aircraft).',
 zh:'絕對升限——爬升率降為零的高度。實用升限——最大爬升率降至一個標準小數值（大多數輕型飛機為每分鐘100呎）的高度。'},

{t:'h2', en:'Range Performance', zh:'航程性能'},
{t:'p', en:'Maximum range (propeller aircraft) occurs at L/D-MAX — minimizes fuel used per distance covered. Maximum endurance occurs at minimum power required (a lower speed than max-range speed) — minimizes fuel used per unit time, useful for holding.',
 zh:'最大航程（螺旋槳飛機）發生在最大升阻比（L/D-MAX）——能以最少燃油飛行最遠距離。最大續航力則發生在所需動力最小的速度（比最大航程速度更低）——能以最少燃油維持最長飛行時間，適用於待命盤旋。'},

{t:'h2', en:'Region of Reversed Command', zh:'反操縱區'},
{t:'p', en:'Normal command region (above L/D-MAX speed): more power/thrust needed to fly faster. Region of reversed command (below L/D-MAX speed, "back side of the power curve"): as speed decreases further, MORE power is needed to maintain level flight — counterintuitive and hazardous; simply lowering the nose to regain speed loses altitude. Commonly encountered on final approach at minimum controllable airspeed.',
 zh:'正常操縱區（高於L/D-MAX速度）：要飛得更快，需要更多動力／推力。反操縱區（低於L/D-MAX速度，即「功率曲線的背面」）：速度進一步降低時，維持水平飛行反而需要「更多」動力——這一點違反直覺且具危險性；單純低頭增速反而會損失高度。此區域常見於最終進場、以最低可控空速飛行時。'},

{t:'h2', en:'Takeoff and Landing Performance', zh:'起飛與降落性能'},
{t:'h3', en:'Dynamic Hydroplaning', zh:'動態水漂現象'},
{t:'p', en:'A layer of water lifts the tires off the runway surface, drastically reducing tire friction/braking/steering. Minimum hydroplaning speed formula: √(tire pressure psi) × 9. Example: 36 psi tire pressure → √36 × 9 = 54 knots.',
 zh:'一層水膜將輪胎抬離跑道表面，大幅降低輪胎摩擦力、煞車效果與轉向能力。最低水漂速度公式：√（輪胎壓力，psi）×9。例如：輪胎壓力36 psi→√36×9＝54節。'},
{t:'h3', en:'Effect of Gross Weight and Wind', zh:'總重與風的影響'},
{t:'p', en:'Takeoff: heavier weight → lower acceleration + higher required lift-off speed → significantly lengthens takeoff distance. Landing: a 10% increase in landing weight causes ~5% increase in landing speed and ~10% increase in landing distance. Wind: a 10-knot tailwind increases landing distance by about 21%; a 10% increase in landing speed increases landing distance by about 20%.',
 zh:'起飛：重量增加→加速度降低＋所需離地速度提高→大幅增加起飛滑跑距離。落地：落地重量增加10%，會使落地速度增加約5%、落地距離增加約10%。風：10節順風會使落地距離增加約21%；落地速度增加10%，會使落地距離增加約20%。'},

{t:'h2', en:'Performance Charts', zh:'性能圖表'},
{t:'p', en:'Charts are built on specific stated conditions (weight, configuration, wind, runway surface, pressure altitude, temperature) — always match every condition before using its output. Interpolation required when actual conditions fall between two listed chart values.',
 zh:'圖表都是依特定的假設條件（重量、構型、風、跑道表面、壓力高度、溫度）繪製——使用前務必核對每一項條件是否相符。當實際條件落在圖表所列兩個數值之間時，須進行內插計算。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Performance characteristics vary greatly among aircraft; weight, atmospheric conditions, and external environmental factors significantly affect performance. Pilots must become intimately familiar with the performance charts of the specific aircraft flown — the AFM/POH is the primary source.',
 zh:'不同飛機的性能特性差異很大；重量、大氣狀況與外部環境因素都會顯著影響性能。飛行員必須非常熟悉自己所駕駛飛機的性能圖表——AFM／POH是主要的資料來源。'}
  ]
},
{
  id:'ch12', num:12,
  titleEn:'Chapter 12 — Weather Theory',
  titleZh:'第十二章 — 天氣理論',
  subEn:'Original pages 12-1 to 12-25. High relevance to interview scenario prep.',
  subZh:'原文頁碼 12-1 至 12-25。與面試情境題高度相關。',
  blocks:[
{t:'h2', en:'Atmosphere', zh:'大氣層'},
{t:'p', en:'Layers (bottom to top): Troposphere (surface weather occurs here, temperature decreases with altitude) → Tropopause (boundary at the top, height varies with latitude/season) → Stratosphere → Mesosphere → Thermosphere.',
 zh:'大氣層由下至上分為：對流層（地表天氣現象發生於此，溫度隨高度增加而下降）→對流層頂（其上方的邊界，高度因緯度與季節而異）→平流層→中氣層→熱氣層。'},
{t:'h3', en:'Coriolis Force', zh:'科氏力'},
{t:'p', en:'Caused by Earth\'s rotation; deflects air to the right in the Northern Hemisphere — deflection is greatest at the poles, zero at the equator; magnitude increases with the speed of the moving air. Breaks the general circulation into 3 distinct cells per hemisphere.',
 zh:'由地球自轉所產生；在北半球會使空氣向右偏轉——偏轉在兩極最大，在赤道則為零；氣流速度越快，偏轉幅度也越大。使整體環流在每個半球分裂為三個獨立的環流胞。'},

{t:'h2', en:'Wind and Currents', zh:'風與氣流'},
{t:'h3', en:'Low-Level Wind Shear', zh:'低空風切'},
{t:'p', en:'A sudden change in wind speed/direction over a short distance. Microburst — a strong, localized downdraft that spreads out horizontally at the surface, creating rapidly changing headwind → tailwind (or vice versa) as an aircraft passes through — extremely hazardous during takeoff/climb-out or approach/landing. Wind shear can affect any flight, any altitude, any aircraft type.',
 zh:'指風速或風向在短距離內急遽變化。微爆流——一股強烈的局部下沖氣流，在地面向水平方向擴散，導致飛機穿越時經歷順風急速轉為逆風（或反之）——在起飛爬升或進場落地階段極度危險。風切可能影響任何飛行、任何高度、任何機型。'},

{t:'h2', en:'Atmospheric Stability', zh:'大氣穩定度'},
{t:'p', en:'Stability = the atmosphere\'s ability to resist vertical motion. Adiabatic heating/cooling — temperature change in a parcel of air due to compression/expansion alone. Inversion — temperature increases with altitude over some layer — very stable air, often traps pollutants/fog/haze near the surface.',
 zh:'穩定度＝大氣抵抗垂直運動的能力。絕熱增溫／降溫——空氣塊僅因壓縮或膨脹而產生的溫度變化。逆溫——某一層大氣中溫度隨高度增加而上升——空氣非常穩定，常將污染物、霧或霾困在地表附近。'},

{t:'h2', en:'Moisture and Temperature', zh:'水氣與溫度'},
{t:'p', en:'Dew point = the temperature to which air must be cooled to become saturated (100% relative humidity). A small spread between temperature and dew point indicates air is close to saturation (high fog/cloud formation risk); a large spread indicates dry air.',
 zh:'露點＝空氣須冷卻至該溫度才會達到飽和（相對濕度100%）。溫度與露點之間的差距越小，代表空氣越接近飽和（形成霧或雲的風險越高）；差距越大則代表空氣越乾燥。'},

{t:'h2', en:'Clouds', zh:'雲'},
{t:'table', head:['Category','Types / Notes'], headZh:['類別','類型／說明'], rows:[
  {en:'High clouds', zh:'高雲族', en2:'Cirrus, Cirrostratus, Cirrocumulus — composed mostly of ice crystals', zh2:'卷雲、卷層雲、卷積雲——主要由冰晶組成'},
  {en:'Middle clouds', zh:'中雲族', en2:'Altostratus, Altocumulus', zh2:'高層雲、高積雲'},
  {en:'Low clouds', zh:'低雲族', en2:'Stratus, Stratocumulus, Nimbostratus (steady precipitation)', zh2:'層雲、層積雲、雨層雲（持續性降水）'},
  {en:'Vertical development', zh:'具垂直發展的雲', en2:'Towering Cumulus, Cumulonimbus — can be obscured by other layers, hiding embedded thunderstorm activity', zh2:'濃積雲、積雨雲——可能被其他雲層遮蔽，隱藏其中的雷雨活動'}
]},
{t:'p', en:'Freezing rain/freezing drizzle occurs when precipitation falls through a layer of air with temperatures at or below freezing near the surface (supercooled liquid droplets freeze on contact with any surface) — a significant icing hazard.',
 zh:'凍雨／凍毛毛雨發生在降水通過地表附近溫度處於或低於冰點的氣層時（過冷液態水滴一接觸物體表面即結凍）——是嚴重的結冰危害。'},

{t:'h2', en:'Fronts — 4 Types', zh:'鋒面——四種類型'},
{t:'table', head:['Front','Description'], headZh:['鋒面','說明'], rows:[
  {en:'Warm front', zh:'暖鋒', en2:'Warm air mass advances and replaces colder air; wide bands of stratiform clouds/precipitation ahead, gradual deterioration', zh2:'暖氣團前進並取代較冷空氣；前方有大範圍層狀雲與降水，天氣逐漸惡化'},
  {en:'Cold front', zh:'冷鋒', en2:'Cold air mass advances and undercuts warmer air; narrower band of more intense weather (cumulonimbus, thunderstorms), especially fast-moving fronts', zh2:'冷氣團前進並楔入較暖空氣下方；天氣劇烈但範圍較窄（積雨雲、雷雨），移動快速的冷鋒尤其明顯'},
  {en:'Stationary front', zh:'滯留鋒', en2:'Boundary not advancing significantly either direction — weather can persist for extended periods', zh2:'鋒面邊界未明顯朝任一方向移動——天氣狀況可能持續較長時間'},
  {en:'Occluded front', zh:'囚錮鋒', en2:'A fast-moving cold front catches up to and overtakes a slower warm front — cold-front-type or warm-front-type occlusion', zh2:'移動較快的冷鋒追上並超越移動較慢的暖鋒——分為冷鋒型或暖鋒型囚錮'}
]},

{t:'h2', en:'Thunderstorms', zh:'雷雨'},
{t:'p', en:'3 stages: cumulus (developing, updrafts dominate) → mature (most intense — updrafts and downdrafts present, heaviest rain/hail/lightning/turbulence) → dissipating (downdrafts dominate, weakening). Rule of thumb: circumnavigate thunderstorms identified as severe or with an extreme radar echo by at least 20 miles.',
 zh:'三個發展階段：積雲期（發展階段，以上升氣流為主）→成熟期（最劇烈的階段——上升與下沉氣流同時存在，降雨、冰雹、閃電與亂流最為劇烈）→消散期（以下沉氣流為主，強度減弱）。經驗法則：對於被判定為嚴重或雷達回波為極強等級的雷雨，應至少繞開20浬以上。'},
{t:'h3', en:'Hazards', zh:'危害'},
{t:'li', en:'Squall line — a narrow band of active, often severe thunderstorms that can develop ahead of a fast-moving cold front', zh:'颮線——狹窄且活躍、常屬嚴重等級的雷雨帶，可能在快速移動的冷鋒前方形成'},
{t:'li', en:'Tornadoes — most violent thunderstorms can spawn tornadoes; can occur with isolated cells or squall lines', zh:'龍捲風——最猛烈的雷雨可能孕育出龍捲風；可能發生於單一胞或颮線之中'},
{t:'li', en:'Icing — updrafts support abundant supercooled liquid water, creating severe icing potential', zh:'結冰——上升氣流承載大量過冷液態水，可能造成嚴重的結冰狀況'},
{t:'li', en:'Engine water ingestion — turbine engines have a limit on the amount of water they can ingest; strong updrafts can loft water concentrations exceeding that limit', zh:'引擎進水——渦輪引擎能承受的進水量有其上限；強烈上升氣流可能捲起超過該上限的水量'},
{t:'li', en:'Hail — competes with turbulence as the greatest thunderstorm hazard; can be encountered even in clear air some distance from the visible storm cell', zh:'冰雹——與亂流並列為雷雨對飛機最大的威脅；即使在遠離可見風暴胞的晴空區域也可能遭遇'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Knowledge of the atmosphere and the forces acting within it helps pilots understand the weather reports/forecasts used for flight planning (Chapter 13) and make sound go/no-go and en route weather decisions.',
 zh:'了解大氣層及其中作用的各種力，有助於飛行員理解用於飛行規劃的天氣報告與預報（第十三章），並做出正確的起降／續飛決策，以及航路中的天氣應對決策。'}
  ]
},
{
  id:'ch13', num:13,
  titleEn:'Chapter 13 — Aviation Weather Services',
  titleZh:'第十三章 — 航空氣象服務',

{t:'h2', en:'Weather Briefings', zh:'天氣簡報'},
{t:'table', head:['Type','When to use'], headZh:['類型','使用時機'], rows:[
  {en:'Standard briefing', zh:'標準簡報', en2:'Most complete — first briefing of the day or when planning has been substantially delayed; includes adverse conditions, synopsis, current/forecast conditions, winds/temps aloft, NOTAMs', zh2:'內容最完整——用於當天第一次簡報，或規劃已大幅延遲時；包含不利天氣狀況、綜觀分析、現況／預報天氣、高空風溫、NOTAM'},
  {en:'Abbreviated briefing', zh:'簡略簡報', en2:'Shortened version — used to update an earlier briefing, or to get only specific information', zh2:'簡化版本——用於更新先前的簡報，或僅需查詢特定資訊時'},
  {en:'Outlook briefing', zh:'展望簡報', en2:'Requested when departure is 6+ hours away — general guidance for flight planning', zh2:'預計出發時間在6小時以上時使用——提供一般性的飛行規劃參考'}
]},

{t:'h2', en:'Aviation Weather Reports', zh:'航空氣象報告'},
{t:'h3', en:'METAR', zh:'METAR（例行天氣報告）'},
{t:'p', en:'An observation of current surface weather, issued on a regular schedule (typically hourly); SPECI = a special (non-routine) METAR issued between scheduled reports when significant changes occur. Sky cover: FEW · SCT (scattered) · BKN (broken) · OVC (overcast).',
 zh:'對目前地面天氣的觀測，依固定排程發布（通常每小時一次）；SPECI＝特別（非例行）METAR，當天氣發生重大變化時會在排定時刻之間額外發布。雲量：FEW（少雲）・SCT（疏雲）・BKN（裂雲）・OVC（密雲）。'},
{t:'h3', en:'Pilot Weather Reports (PIREPs)', zh:'飛行員天氣報告（PIREP）'},
{t:'p', en:'Provide valuable real-time information on actual conditions encountered, filed by pilots. Encoding fields: message type (UA=routine, UUA=urgent), location, time, altitude, aircraft type, sky cover, weather/visibility, temperature, wind, turbulence, icing, remarks. Urgent PIREPs (UUA) are for hazardous conditions: severe turbulence/icing, wind shear.',
 zh:'由飛行員回報，提供有關實際遭遇天氣狀況的珍貴即時資訊。編碼欄位：報告類型（UA＝例行、UUA＝緊急）、位置、時間、高度、機型、雲量、天氣／能見度、溫度、風、亂流、結冰、備註。緊急PIREP（UUA）用於回報危險狀況：嚴重亂流／結冰、風切。'},
{t:'h3', en:'Terminal Aerodrome Forecasts (TAF)', zh:'機場預報（TAF）'},
{t:'p', en:'Established for the 5-statute-mile radius around an airport; provides expected surface weather conditions in scheduled format for a specific valid period.',
 zh:'涵蓋機場周圍5浬半徑範圍內；以固定排程格式提供特定有效期間內的預期地面天氣狀況。'},

{t:'h2', en:'Inflight Weather Advisories', zh:'飛航中天氣諮詢'},
{t:'h3', en:'AIRMET (WA)', zh:'AIRMET（機場天氣諮詢）'},
{t:'p', en:'Advisories for weather potentially hazardous to aircraft with limited capability — moderate icing, moderate turbulence, sustained winds ≥30 kt, widespread ceiling <1,000 ft and/or visibility <3 miles, extensive mountain obscuration. 3 types: Sierra (IFR/mountain obscuration), Tango (turbulence, surface winds, wind shear), Zulu (icing, freezing levels).',
 zh:'針對可能對能力有限的飛機構成危害的天氣所發布的諮詢——中度結冰、中度亂流、地面持續風速達30節以上、大範圍雲底低於1,000呎及／或能見度低於3浬、大範圍山區能見度受阻。分為三種：Sierra（IFR狀況／山區能見度受阻）、Tango（亂流、地面風、低空風切）、Zulu（結冰、結冰層高度）。'},
{t:'h3', en:'SIGMET (WS) / Convective SIGMET (WST)', zh:'SIGMET／對流性SIGMET（WST）'},
{t:'p', en:'SIGMET — inflight advisories concerning nonconvective weather hazardous to ALL aircraft (not just small/limited ones) — severe icing, severe/extreme turbulence, dust/sandstorms, volcanic ash. Valid for 4 hours. Convective SIGMET — specifically for convective weather, issued for eastern/central/western U.S. regions on a scheduled basis.',
 zh:'SIGMET——針對對「所有」飛機（不只是能力受限的小型機）皆具危害的非對流性天氣所發布的飛航中諮詢——嚴重結冰、嚴重／極端亂流、沙塵暴、火山灰。有效期為4小時。對流性SIGMET——專門針對對流性天氣，依排程分別針對美國東部／中部／西部區域發布。'},

{t:'h2', en:'Weather Charts', zh:'天氣圖'},
{t:'p', en:'Surface Analysis Chart — shows frontal positions, pressure systems, and station data. Weather Depiction Chart — broad overview of IFR/MVFR/VFR conditions nationwide. Significant Weather Prognostic Charts — forecast charts depicting expected significant weather at future times.',
 zh:'地面分析圖——顯示鋒面位置、氣壓系統與各測站資料。天氣描繪圖——概略呈現全國IFR／MVFR／VFR狀況的分布。顯著天氣預測圖——描繪未來時段預期出現的顯著天氣狀況。'},

{t:'h2', en:'NEXRAD Limitations', zh:'NEXRAD雷達的限制'},
{t:'p', en:'Ground-based NEXRAD data displayed in the cockpit (via datalink) has inherent latency (often several minutes old) and attenuation issues — datalink weather should never be used for tactical, real-time thunderstorm penetration/avoidance decisions; only for strategic (big-picture) route planning.',
 zh:'透過資料鏈路顯示於駕駛艙內的地面NEXRAD雷達資料，本身存在延遲問題（常常已是數分鐘前的資料）以及訊號衰減問題——資料鏈路天氣絕不應用於即時、戰術性的雷雨穿越或迴避決策；僅適合用於策略性（大範圍）的航路規劃。'},

{t:'h2', en:'Pilot Responsibility', zh:'飛行員的責任'},
{t:'p', en:'Ultimately, the pilot in command bears full responsibility for obtaining and correctly interpreting weather information and for the final go/no-go decision — no single weather product/service relieves the pilot of that responsibility.',
 zh:'最終，機長對取得並正確判讀天氣資訊，以及最終的起降／續飛決策，都負有完全的責任——沒有任何單一天氣資訊來源或服務能免除飛行員的這項責任。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Weather services and reports give pilots the data needed to plan flights safely — understanding the format, source, latency, and limitations of each product is essential to using them correctly in the decision-making process covered in Chapter 2.',
 zh:'氣象服務與報告提供飛行員安全規劃飛行所需的資料——理解每項產品的格式、來源、延遲程度與限制，是在第二章所述決策流程中正確運用這些資訊的關鍵。'}
  ]
},
{
  id:'ch14', num:14,
  titleEn:'Chapter 14 — Airport Operations',
  titleZh:'第十四章 — 機場作業',
  subEn:'Original pages 14-1 to 14-38.',
  subZh:'原文頁碼 14-1 至 14-38。',
  blocks:[
{t:'h2', en:'Nontowered Airport Operations', zh:'無塔台機場作業'},
{t:'p', en:'Nontowered pattern entry: always entered at pattern altitude; standard method is a 45° entry to the downwind leg. ATIS — recorded broadcast of current airport conditions; note the current letter code when checking in with ATC.',
 zh:'無塔台機場的航線進入：一律應以航線高度進入；標準方式是以45°角進入下風腳。ATIS——播報機場現況的錄音廣播；與航管聯絡時須報告目前的代碼字母。'},

{t:'h2', en:'Runway Markings and Signs', zh:'跑道標示與號誌'},
{t:'p', en:'Displaced threshold — a threshold located at a point other than the physical runway end; the area before it can be used for taxi/takeoff roll but NOT for landing. Runway holding position marking — 4 yellow lines (2 solid, 2 dashed); never cross the solid lines toward the runway without clearance.',
 zh:'位移門檻——門檻位置並非位於跑道的實體端點；門檻前方的區域可用於滑行或起飛滑跑，但「不可」用於落地。跑道等待位置標線——4條黃線（2實線、2虛線）；未獲許可絕不可跨越實線朝跑道方向前進。'},
{t:'p', en:'Runway designation marking — derived from the runway\'s magnetic direction (rounded to nearest 10°, dropping the last digit — e.g., 253° → "25"). LAHSO (Land and Hold Short Operations) — pilots must be advised why LAHSO is in use, and can decline; not authorized for student pilots.',
 zh:'跑道編號標示——依跑道磁方位（四捨五入至最接近的10°，並去掉最後一位數字——例如253°→「25」）。LAHSO（落地並在指定點前停止作業）——航管須告知飛行員採用LAHSO的原因，飛行員亦可拒絕；學生飛行員不得執行此作業。'},

{t:'h2', en:'Airport Lighting', zh:'機場燈光'},
{t:'p', en:'Airport beacon: flashing white and green = civilian land airport; flashing white and yellow = water airport; two quick white flashes + green = military airport.',
 zh:'機場信標燈：白綠交替閃爍＝民用陸上機場；白黃交替閃爍＝水上機場；兩次快速白光閃爍加一次綠光＝軍用機場。'},
{t:'p', en:'VASI — red over white = on glidepath ("red over white, you\'re all right"). PAPI — 4 lights: all white = high, 2 white/2 red = on glidepath, all red = low. REIL — synchronized flashing lights at the runway threshold.',
 zh:'VASI（目視進場坡度指示器）——紅上白下＝在正確下滑道上（口訣：「紅上白下，一切安好」）。PAPI（精確進場路徑指示器）——共4盞燈：全白＝過高，2白2紅＝在正確下滑道上，全紅＝過低。REIL（跑道端識別燈）——位於跑道門檻的同步閃爍燈。'},

{t:'h2', en:'Radio Communications — Lost Communication', zh:'無線電通訊——失去通訊'},
{t:'table', head:['Light signal','Aircraft on ground / in flight'], headZh:['燈號','地面上／飛行中的飛機'], rows:[
  {en:'Steady green', zh:'穩定綠燈', en2:'Cleared for takeoff / Cleared to land', zh2:'獲准起飛／獲准落地'},
  {en:'Flashing green', zh:'閃爍綠燈', en2:'Cleared to taxi / Return for landing', zh2:'獲准滑行／返場落地'},
  {en:'Steady red', zh:'穩定紅燈', en2:'Stop / Give way, continue circling', zh2:'停止／讓路，繼續盤旋'},
  {en:'Flashing red', zh:'閃爍紅燈', en2:'Taxi clear of the runway / Airport unsafe, do not land', zh2:'滑離跑道／機場不安全，勿落地'},
  {en:'Alternating red and green', zh:'紅綠交替', en2:'General warning — exercise extreme caution', zh2:'一般警告——須格外謹慎'}
]},

{t:'h2', en:'Wake Turbulence Avoidance Procedures', zh:'尾流迴避程序'},
{t:'li', en:'Landing behind a larger aircraft, same runway: land beyond its touchdown point', zh:'在較大型飛機後方、同一跑道落地：須落於其觸地點之後'},
{t:'li', en:'Landing behind a departing larger aircraft, same runway: note its rotation point, land prior to it', zh:'在較大型飛機起飛後、同一跑道落地：記下其拉起點，須在該點之前落地'},
{t:'li', en:'Landing behind a larger aircraft, crossing runway: cross above its flight path', zh:'在較大型飛機之後、以交叉跑道落地：須從其飛行路徑上方通過'},

{t:'h2', en:'Pilot Deviations (PDs) and Runway Incursion Avoidance', zh:'飛行員違規與跑道侵入防範'},
{t:'p', en:'A pilot deviation = an action violating a CFR, TFR, NOTAM, or ATC instruction. Approximately 3 runway incursions occur each day at U.S. airports. Best practices: read back all runway crossing/hold instructions completely; review airport layouts during preflight planning; request progressive taxi instructions when unfamiliar.',
 zh:'飛行員違規＝違反聯邦法規（CFR）、暫時飛航限制（TFR）、NOTAM或航管指示的行為。美國各機場平均每天約發生3起跑道侵入事件。最佳實務做法：完整覆誦所有跨越跑道／等待的指示；飛行前規劃時檢視機場配置圖；不熟悉機場時主動要求逐步滑行指示。'},
{t:'p', en:'"Line up and wait" (LUAW) — taxi onto the runway and align for departure, but do NOT take off until a separate takeoff clearance is issued; extra caution required, especially with landing traffic on the same runway.',
 zh:'「進入跑道並等待」（LUAW）——滑進跑道並對正起飛方向，但在收到單獨的起飛許可之前「不可」起飛；須格外小心，尤其當同一跑道上有落地交通時。'},

{t:'h2', en:'Engineered Materials Arresting Systems (EMAS)', zh:'工程材料攔阻系統（EMAS）'},
{t:'p', en:'A bed of engineered, crushable material at the runway end designed to reliably and predictably crush under the weight of an aircraft, decelerating it safely and reducing overrun severity. If an aircraft engages an EMAS: continue deceleration efforts, maintain runway centerline, maintain deceleration throughout.',
 zh:'在跑道末端鋪設的工程可壓潰材料層，設計目的是在飛機重量壓迫下能可靠、可預測地潰陷，藉此安全地使飛機減速，降低衝出跑道的嚴重程度。若飛機進入EMAS：應持續進行減速動作、保持在跑道中線上、全程持續施加減速力道。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Focused on airport operations both in the air and on the ground — emphasizes runway incursion avoidance, taxi route planning, and clear communications as key best practices to avoid errors during surface operations.',
 zh:'本章聚焦於空中與地面的機場作業——強調跑道侵入防範、滑行路線規劃，以及清晰的溝通，是避免地面作業出錯的關鍵最佳實務做法。'}
  ]
},
{

  blocks:[
{t:'h2', en:'Measurement of Direction', zh:'方向的測定'},
{t:'p', en:'Variation — angular difference between true north and magnetic north at a given location; the Agonic line is where TN and MN coincide. Deviation — compass error from the aircraft\'s own magnetic disturbances, an intermediate step after applying variation.',
 zh:'偏角——特定地點真北與磁北之間的角度差；等偏線（Agonic line）即真北與磁北重合的線。羅差——由飛機本身磁性干擾造成的羅盤誤差，是修正偏角之後還須額外處理的一個步驟。'},
{t:'p', en:'Sequence: True Course → apply variation → Magnetic Course/Heading → apply deviation → Compass Heading.', zh:'修正順序：真航線→修正偏角→磁航線／磁航向→修正羅差→羅盤航向。'},

{t:'h2', en:'Effect of Wind', zh:'風的影響'},
{t:'p', en:'Wind Correction Angle (WCA) — the correction applied to the True Course to counteract wind drift, yielding the heading the aircraft must actually fly to maintain the desired track.',
 zh:'風修正角（WCA）——為抵銷風的偏移影響而施加於真航線上的修正角度，藉此得出飛機實際必須飛行的航向，以維持所需的航跡。'},

{t:'h2', en:'Dead Reckoning — Wind Triangle', zh:'推測航行——風三角'},
{t:'p', en:'A graphic (or computed) method for determining the effect of wind on heading and groundspeed — 3 vectors: true course/distance, wind direction/velocity, true airspeed — solving the triangle yields the heading to fly and resulting groundspeed.',
 zh:'一種以圖解（或計算）方式決定風對航向與地速影響的方法——共三個向量：真航線／距離、風向／風速、真空速——解出此三角形後，即可得出應飛的航向與所產生的地速。'},

{t:'h2', en:'Ground-Based Navigation — VOR', zh:'地基導航——VOR'},
{t:'p', en:'The primary ground-based radio navaid for decades; the course/radial is referenced from magnetic north at the station. 3 usable classes: T (Terminal), L (Low altitude), H (High altitude). Positively identify the station by its Morse code identifier before relying on it.',
 zh:'數十年來主要的地基無線電助航設施；其航道／方位徑是以測站處的磁北為基準。共有三種可用等級：T（終端）、L（低空）、H（高空）。使用前務必先以摩斯電碼識別碼確認測站身分無誤。'},
{t:'p', en:'CDI (Course Deviation Indicator) — an OBS dial, a needle showing deviation, a TO/FROM flag. HSI — combines heading indicator + CDI. RMI — shows a rotating compass card with pointer(s) indicating magnetic bearing TO the tuned station.',
 zh:'CDI（航道偏移指示器）——包含OBS選台鈕、顯示偏移量的指針，以及TO／FROM旗標。HSI（水平狀態指示器）——結合航向指示器與CDI於一體。RMI（無線電磁指示器）——顯示會旋轉的羅盤卡，指針指向所調頻測站的磁方位角。'},

{t:'h2', en:'DME and RNAV', zh:'DME 與區域導航（RNAV）'},
{t:'p', en:'DME uses UHF signals to measure slant-range distance to a co-located VOR/VORTAC station. DME-computed groundspeed/time-to-station are only accurate when flying directly to or from the station. RNAV permits electronic course guidance along any selected course, not just fixed VOR radials.',
 zh:'DME使用UHF訊號，測量至同址設置的VOR／VORTAC測站的斜距。DME計算出的地速／到站時間，僅在直飛向測站或直飛離測站時才準確。RNAV（區域導航）能沿任意選定的航線提供電子航道導引，而不僅限於VOR固定的方位徑。'},

{t:'h2', en:'Global Positioning System (GPS)', zh:'全球定位系統（GPS）'},
{t:'p', en:'Minimum of 4 satellites necessary to establish a 3D position fix with time correction. RAIM (Receiver Autonomous Integrity Monitoring) — many VFR GPS receivers and all handheld units LACK RAIM capability, meaning the unit cannot reliably detect/warn of a faulty satellite signal.',
 zh:'須至少鎖定4顆衛星，才能確立包含時間修正的三維位置定位。RAIM（接收機自主完整性監控）——許多VFR用GPS接收器與所有手持式機型都「不具備」RAIM功能，代表該設備無法可靠地偵測或警示衛星訊號異常。'},
{t:'p', en:'VFR waypoints supplement (not replace) standard pilotage/dead-reckoning/other navigation techniques. Do not relieve the pilot of any responsibility for proper flight planning, airspace awareness, or basic navigation skills.',
 zh:'VFR航點是用來輔助（而非取代）標準的目視領航、推測航行等其他導航技巧。這並不能免除飛行員在妥善飛行規劃、空域警覺，以及基本導航技能上應負的責任。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Covers the fundamentals of VFR navigation: charts, pilotage, dead reckoning, VOR/DME/NDB/GPS-based navigation, flight planning, and procedures for lost/diversion situations.',
 zh:'涵蓋VFR導航的基本要素：航圖、目視領航、推測航行、VOR／DME／NDB／GPS導航、飛行規劃，以及迷航／轉降情況的處置程序。'}
  ]
},

  {en:'Hypemic hypoxia', zh:'血液性缺氧', en2:'Blood can\'t carry enough oxygen (e.g., blood loss, CO poisoning, anemia)', zh2:'血液無法攜帶足夠氧氣（例如失血、一氧化碳中毒、貧血）'},

{t:'p', en:'Symptoms: cyanosis, headache, decreased response to stimuli, impaired judgment, euphoria, visual impairment, drowsiness, lightheadedness, tingling in fingers/toes. Treatment: fly at a lower altitude and/or use supplemental oxygen.',

{t:'h2', en:'Hyperventilation', zh:'過度換氣'},
{t:'p', en:'Excessive rate/depth of respiration, often triggered by an unexpected stressful situation. Symptoms overlap significantly with hypoxia, making the two easy to confuse. Treatment: consciously slow the breathing rate, talk aloud to help regulate breathing.',

{t:'h2', en:'Spatial Disorientation and Illusions', zh:'空間迷向與錯覺'},
{t:'h3', en:'Vestibular Illusions', zh:'前庭系統錯覺'},
{t:'p', en:'The Leans — the most common illusion; a slow roll into a bank too gradual to detect, followed by an abrupt correction to level, creates a sensation of banking in the opposite direction. Coriolis illusion — moving the head out of the plane of an established turn creates a strong, disorienting sensation of rotation in an entirely different axis — potentially the most dangerous illusion.',
 zh:'傾斜錯覺（The Leans）——最常見的錯覺；緩慢滾轉進入坡度、慢到無法察覺，之後突然修正回水平時，會產生朝反方向傾斜的錯覺。科氏力錯覺——在已建立的轉彎中將頭部移出原本平面，會產生強烈、令人迷向的另一軸向旋轉感——可能是最危險的一種錯覺。'},
{t:'p', en:'Graveyard spiral — during a prolonged, coordinated turn, the vestibular system stops sensing rotation; leveling the wings produces a sensation of turning the opposite direction — the pilot may re-enter the original turn while altitude is lost, often without realizing it. Somatogravic illusion — rapid acceleration (e.g., takeoff) can be perceived as a nose-up pitch, tempting an inappropriate nose-down correction.',
 zh:'死亡螺旋——在持續、協調的轉彎中，前庭系統會停止感知旋轉；此時將機翼回正，會產生朝反方向轉彎的錯覺——飛行員可能因此重新進入原本的轉彎，並在不自覺的情況下持續掉高度。體覺重力錯覺——快速加速（例如起飛時）可能被誤認為是機首上仰，進而誘使飛行員做出不當的低頭修正。'},
{t:'h3', en:'Visual Illusions — False Horizon', zh:'視覺錯覺——假地平線'},
{t:'p', en:'Occurs when the natural horizon is obscured, or sloping cloud formations/ground light patterns are mistaken for it — can lead the pilot into a dangerous attitude.',
 zh:'發生於自然地平線被遮蔽時，或將傾斜的雲層形狀／地面燈光排列誤認為地平線——可能導致飛行員進入危險姿態。'},
{t:'h3', en:'Coping with Spatial Disorientation', zh:'應對空間迷向'},
{t:'p', en:'If disorientation occurs: trust the flight instruments — do not rely on bodily sensation. Understand the causes and remain alert for signs/symptoms; do not fly into adverse weather/reduced visibility without an instrument rating or currency.',
 zh:'一旦發生迷向：相信飛航儀表——不要依賴身體的感覺。理解成因並隨時警覺相關徵兆；未持有儀器等級或未保持儀器飛行資格現行時，不應飛入惡劣天氣或低能見度環境。'},

{t:'h2', en:'Optical Illusions (Approach/Landing)', zh:'視覺錯覺（進場／落地）'},
{t:'table', head:['Illusion','Effect'], headZh:['錯覺','效果'], rows:[
  {en:'Runway width illusion', zh:'跑道寬度錯覺', en2:'Narrower-than-usual runway → illusion of being higher → tendency to fly a lower approach; wider runway → opposite', zh2:'比平常窄的跑道→產生「較高」的錯覺→傾向飛出偏低的進場；較寬的跑道則相反'},
  {en:'Runway/terrain slope illusion', zh:'跑道／地形坡度錯覺', en2:'Upsloping runway → illusion of being higher → lower approach; downsloping → opposite', zh2:'上坡跑道→產生「較高」的錯覺→偏低的進場；下坡跑道則相反'},
  {en:'Featureless terrain illusion', zh:'無特徵地形錯覺', en2:'Lack of ground features (water, snow, darkness) makes the aircraft seem higher than actual', zh2:'缺乏地面參照物（水面、雪地、夜間黑暗）會使飛機看起來比實際位置更高'},
  {en:'Haze', zh:'霾', en2:'Creates an illusion of greater distance/height than actual → tendency to fly a lower approach', zh2:'產生比實際更遠／更高的錯覺→傾向飛出偏低的進場'},
  {en:'Ground lighting illusions', zh:'地面燈光錯覺', en2:'Lights along a straight path can be mistaken for runway/approach lights; bright lighting can create an illusion of less distance than actual', zh2:'沿直線排列的燈光可能被誤認為跑道／進場燈；明亮的燈光系統可能產生距離比實際更近的錯覺'}
]},
{t:'p', en:'Prevention: anticipate the possibility of illusions, especially at unfamiliar airports at night; consult the Chart Supplement for runway slope; use VASI/PAPI for a reliable glidepath reference rather than relying on visual judgment alone.',

{t:'h2', en:'Stress and Fatigue', zh:'壓力與疲勞'},
{t:'p', en:'Acute stress — a short-term reaction to an immediate threat/demand. Chronic stress — a level of stress present with such regularity that performance is consistently affected. Acute fatigue can be prevented through proper diet and adequate rest.',
 zh:'急性壓力——對立即性威脅或需求的短期反應。慢性壓力——經常性存在、持續影響表現的壓力狀態。急性疲勞可透過適當飲食與充分休息來預防。'},

{t:'h2', en:'Alcohol', zh:'酒精'},
{t:'p', en:'14 CFR Part 91 requires blood alcohol level below 0.04%, and that 8 hours pass between drinking alcohol and acting as PIC ("8 hours bottle to throttle"). A pilot with a BAC of 0.04% or higher, even after 8 hours, may not fly until it drops below that threshold — 8 hours alone does not guarantee compliance if BAC is still elevated.',
 zh:'14 CFR Part 91規定血液酒精濃度須低於0.04%，且飲酒後須間隔8小時才能擔任機長（俗稱「酒後8小時方可飛」）。若血液酒精濃度達0.04%或以上，即使已滿8小時，仍不得飛行，須等到濃度降至門檻以下為止——單純滿8小時並不能保證符合規定（若酒精濃度仍偏高）。'},
{t:'p', en:'Best practice: be more conservative than the regulation requires — alcohol\'s effects (impaired judgment/coordination/reaction time, reduced G-tolerance) can persist well beyond when BAC returns to zero.',
 zh:'最佳做法：採取比法規要求更保守的標準——酒精的影響（判斷力、協調性、反應時間受損，G力耐受度降低）可能在血液酒精濃度降回零之後仍持續存在。'},

{t:'h2', en:'Drugs', zh:'藥物'},
{t:'p', en:'14 CFR 61.53 prohibits acting as PIC while using any medication that affects faculties in a way contrary to safety. Many common over-the-counter drugs (e.g., antihistamines like Benadryl/diphenhydramine) cause drowsiness and impair performance.',
 zh:'14 CFR 61.53規定，服用任何會以不利飛安方式影響身心能力的藥物時，不得擔任機長。許多常見的非處方藥（例如Benadryl／diphenhydramine等抗組織胺藥物）會引起嗜睡，並影響飛行表現。'},

{t:'h2', en:'Altitude-Induced Decompression Sickness (DCS)', zh:'高空引發的減壓病（DCS）'},
{t:'p', en:'Caused by nitrogen coming out of solution and forming bubbles as ambient pressure drops with altitude. Immediate response: 100% oxygen, emergency descent, land as soon as possible.',
 zh:'由於高度上升、環境壓力下降，體內溶解的氮氣析出並形成氣泡所致。立即處置：使用100%純氧、緊急下降、盡快落地。'},
{t:'h3', en:'DCS After Scuba Diving', zh:'潛水後的減壓病風險'},
{t:'p', en:'Wait at least 12 hours after non-decompression-stop diving before flying up to 8,000 ft. Wait at least 24 hours after decompression-stop diving before flying up to 8,000 ft. Wait at least 24 hours after ANY scuba dive before flying above 8,000 ft.',
 zh:'進行「無需減壓停留」的潛水後，須至少間隔12小時才能飛往8,000呎以下高度。進行「需要減壓停留」的潛水後，須至少間隔24小時才能飛往8,000呎以下高度。「任何」水肺潛水後，須至少間隔24小時才能飛往8,000呎以上高度。'},

{t:'h2', en:'Vision in Flight', zh:'飛行中的視覺'},
{t:'h3', en:'Night Vision', zh:'夜間視覺'},
{t:'p', en:'Night blind spot — cones are inactive in low light, creating a small central blind area at night → use off-center viewing to see dim objects better. Dark adaptation takes significant time (30+ minutes); a bright light exposure can instantly ruin it. Supplemental oxygen improves night vision performance (retinal rod cells are especially oxygen-sensitive).',
 zh:'夜間盲點——低光源下錐狀細胞停止作用，在夜間會形成一個中央小範圍的盲區→須採用偏離中心的目視技巧才能看清較暗的物體。暗適應需要相當長的時間（30分鐘以上）；強光曝露會瞬間破壞已建立的暗適應。補充氧氣有助於提升夜間視力表現（視網膜桿狀細胞對氧氣特別敏感）。'},
{t:'h3', en:'Night Vision Illusions', zh:'夜間視覺錯覺'},
{t:'p', en:'Autokinesis — staring at a fixed point of light in the dark, it appears to move after several seconds. Fascination (fixation) — pilot ignores orientation cues and focuses attention on a single object/light, potentially flying into it. Flicker vertigo — caused by a flickering light source, potentially inducing disorientation.',
 zh:'自動視動錯覺——在黑暗中盯著一個固定光點看，數秒後會產生該光點正在移動的錯覺。目眩神迷（固著）——飛行員忽略了方向感的線索，將注意力完全集中在單一物體或光點上，可能因此撞上該物體。閃爍性暈眩——由閃爍的光源所引發，可能導致空間迷向。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Aeromedical factors — hypoxia, hyperventilation, spatial disorientation, optical illusions, stress/fatigue, substance use, decompression sickness, and vision/night-flying physiology — all directly affect pilot performance and safety; understanding them is essential to sound aeronautical decision-making (Chapter 2) and safe flight in every phase.',
 zh:'航空醫學因素——缺氧、過度換氣、空間迷向、視覺錯覺、壓力與疲勞、藥物使用、減壓病，以及視覺與夜航生理機制——都會直接影響飛行員的表現與飛安；理解這些因素，對第二章所述的航空決策以及每個飛行階段的安全都至關重要。'}

let lang = 'zh';
let chapterIdx = 0;

function buildChapterNav(){
  const nav = document.getElementById('chapternav');
  nav.innerHTML = '';
  const order = CHAPTERS.map((ch,i)=>i).sort((a,b)=> CHAPTERS[a].num - CHAPTERS[b].num);
  order.forEach(i=>{
    const ch = CHAPTERS[i];
    const b = document.createElement('button');
    b.className = 'chip' + (i===chapterIdx ? ' active' : '');
    b.textContent = 'Ch.'+ch.num;
    b.onclick = ()=>{ chapterIdx = i; renderAll(); };
    nav.appendChild(b);
  });
}

      headHtml += '</tr></thead>';
      table.innerHTML = headHtml;
      const tbody = document.createElement('tbody');
      d.rows.forEach(r=>{
        const tr = document.createElement('tr');
        const c1 = document.createElement('td'); c1.className='tr'; c1.dataset.en=r.en; c1.dataset.zh=r.zh;
        const c2 = document.createElement('td'); c2.className='tr'; c2.dataset.en=r.en2; c2.dataset.zh=r.zh2;
        tr.appendChild(c1); tr.appendChild(c2);
        if(cols===3){
          const c3 = document.createElement('td'); c3.className='tr'; c3.dataset.en=r.en3; c3.dataset.zh=r.zh3;
          tr.appendChild(c3);
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      content.appendChild(table);
      return;
    }
    if(d.t==='img'){
      const fig = document.createElement('figure');
      fig.className = 'fig';
      const img = document.createElement('img');
      img.src = d.src;
      img.alt = d.en;
      img.loading = 'lazy';
      const cap = document.createElement('figcaption');
      cap.className = 'tr';
      cap.dataset.en = d.en;
      cap.dataset.zh = d.zh;
      fig.appendChild(img);
      fig.appendChild(cap);
      content.appendChild(fig);
      return;
    }
    const el = document.createElement(d.t==='li' ? 'li' : d.t);
    el.className='tr'; el.dataset.en = d.en; el.dataset.zh = d.zh;
    if(d.t==='li'){
      let ul = content.lastElementChild;
      if(!ul || ul.tagName!=='UL'){ ul = document.createElement('ul'); content.appendChild(ul); }
      ul.appendChild(el);
    } else { content.appendChild(el); }
  });
}

function renderAll(){
  document.body.className = lang==='zh' ? 'zh' : '';
  const ch = CHAPTERS[chapterIdx];
  document.getElementById('chapterTitle').textContent = lang==='zh' ? ch.titleZh : ch.titleEn;
  document.getElementById('chapterSub').textContent = lang==='zh' ? ch.subZh : ch.subEn;
  buildContent();
  document.querySelectorAll('.tr').forEach(el=>{
    el.innerHTML = lang==='zh' ? el.dataset.zh : el.dataset.en;
  });
  document.getElementById('btn-zh').classList.toggle('active', lang==='zh');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('hoverHint').textContent = lang==='zh'
    ? '滑鼠停在文字上看英文原文' : 'Hover text to see the Chinese translation';
  buildChapterNav();
  {
    const order = CHAPTERS.map((ch,i)=>i).sort((a,b)=> CHAPTERS[a].num - CHAPTERS[b].num);
    const pos = order.indexOf(chapterIdx);
    document.getElementById('prevBtn').disabled = pos===0;
    document.getElementById('nextBtn').disabled = pos===order.length-1;
  }
  window.scrollTo({top:0, behavior:'instant'});
}

document.getElementById('btn-zh').onclick = ()=>{ lang='zh'; renderAll(); };
document.getElementById('btn-en').onclick = ()=>{ lang='en'; renderAll(); };
document.getElementById('prevBtn').onclick = ()=>{
  const order = CHAPTERS.map((ch,i)=>i).sort((a,b)=> CHAPTERS[a].num - CHAPTERS[b].num);
  const pos = order.indexOf(chapterIdx);
  if(pos>0){ chapterIdx = order[pos-1]; renderAll(); }
};
document.getElementById('nextBtn').onclick = ()=>{
  const order = CHAPTERS.map((ch,i)=>i).sort((a,b)=> CHAPTERS[a].num - CHAPTERS[b].num);
  const pos = order.indexOf(chapterIdx);
  if(pos<order.length-1){ chapterIdx = order[pos+1]; renderAll(); }
};
renderAll();

const tip = document.getElementById('tooltip');
function showTip(el, x, y){
  const other = lang==='zh' ? el.dataset.en : el.dataset.zh;
  if(!other) return;
  tip.classList.toggle('zh-font', lang==='en');
  tip.innerHTML = `<span class="tag">${lang==='zh'?'EN source':'中文翻譯'}</span>${other}`;
  tip.classList.add('show');
  positionTip(x,y);
}
function positionTip(x,y){
  const pad = 16;
  let left = x + pad, top = y + pad;
  const rect = tip.getBoundingClientRect();
  if(left + rect.width > window.innerWidth - 8) left = x - rect.width - pad;
  if(top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
  tip.style.left = left+'px'; tip.style.top = top+'px';
}
document.addEventListener('mousemove', e=>{
  const el = e.target.closest('.tr');
  if(el){ showTip(el, e.clientX, e.clientY); } else { tip.classList.remove('show'); }
});
document.addEventListener('mouseleave', ()=> tip.classList.remove('show'));
document.addEventListener('click', e=>{
  const el = e.target.closest('.tr');
  if(el && ('ontouchstart' in window)){
    const rectEl = el.getBoundingClientRect();
    showTip(el, rectEl.left+10, rectEl.bottom+6);
    setTimeout(()=> tip.classList.remove('show'), 3500);
  }
});
</script>
</body>
