<style>
  :root{
    --bg:#F1F3EE; --paper:#FAFAF6; --ink:#17242E; --ink-soft:#4B5A63; --hair:#D8DCD2;
    --amber:#C98A2C; --amber-dark:#8C5E17; --amber-tint:#F6E7CC;
    --teal:#2C6E6B; --teal-tint:#E1EEEC; --placard-bg:#17242E; --placard-text:#F4C978;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter','Noto Sans TC',sans-serif; line-height:1.75; padding:0 0 6rem; }
  .zh{font-family:'Noto Sans TC','Inter',sans-serif;}
  h1,h2,h3{font-family:'Source Serif 4',serif; font-weight:600; letter-spacing:.01em;}
  .zh h1,.zh h2,.zh h3{font-family:'Noto Serif TC',serif; font-weight:700;}

  .topbar{ position:sticky; top:0; z-index:20; background:var(--placard-bg); color:#fff;
    border-bottom:2px solid var(--amber); }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.7rem 1.5rem; flex-wrap:wrap; }
  .topbar .title{ font-family:'JetBrains Mono',monospace; font-size:.78rem; letter-spacing:.08em; color:#B9C4CB; text-transform:uppercase; }
  .switch{ display:flex; background:#0D1620; border:1px solid #33424D; border-radius:6px; overflow:hidden; }
  .switch button{ appearance:none; border:none; background:transparent; color:#8CA0AB; font-family:'JetBrains Mono',monospace;
    font-size:.8rem; font-weight:500; padding:.5rem 1rem; cursor:pointer; letter-spacing:.05em; transition:background .15s, color .15s; }
  .switch button.active{ background:var(--amber); color:#1B1200; }
  .hint{ font-size:.72rem; color:#7C8D97; font-family:'JetBrains Mono',monospace; }

  .chapternav{ display:flex; gap:.4rem; padding:0 1.5rem .8rem; overflow-x:auto; scrollbar-width:thin; }
  .chapternav::-webkit-scrollbar{ height:5px; }
  .chapternav::-webkit-scrollbar-thumb{ background:#33424D; border-radius:4px; }
  .chip{ flex:0 0 auto; appearance:none; border:1px solid #33424D; background:#0D1620; color:#9FB0BA;
    font-family:'JetBrains Mono',monospace; font-size:.74rem; padding:.4rem .8rem; border-radius:999px;
    cursor:pointer; white-space:nowrap; transition:all .15s; }
  .chip.active{ background:var(--amber); border-color:var(--amber); color:#1B1200; font-weight:600; }
  .chip:hover:not(.active){ border-color:var(--amber); color:var(--amber); }

  .wrap{ max-width:760px; margin:0 auto; padding:2.5rem 1.5rem 0; }
  .masthead{ text-align:left; margin-bottom:2.5rem; padding-bottom:1.5rem; border-bottom:1px solid var(--hair); }
  .masthead .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:.75rem; color:var(--amber-dark); letter-spacing:.12em; text-transform:uppercase; margin:0 0 .5rem; }
  .masthead h1{ font-size:2.1rem; margin:0 0 .4rem; }
  .masthead .sub{ color:var(--ink-soft); font-size:.95rem; }
  section{ margin-bottom:2.2rem; }
  h2{ font-size:1.35rem; margin:2.4rem 0 .9rem; padding-bottom:.4rem; border-bottom:1px solid var(--hair); }
  h3{ font-size:1.05rem; margin:1.5rem 0 .6rem; color:var(--teal); }
  p.tr, li.tr{ position:relative; cursor:help; padding:.15rem .3rem; margin:0 0 .9rem -.3rem; border-radius:4px; transition:background .12s; }
  li.tr{ margin-bottom:.45rem; }
  p.tr:hover, li.tr:hover{ background:var(--amber-tint); }
  p.tr:hover::before, li.tr:hover::before{ content:""; position:absolute; left:-2px; top:0; bottom:0; width:3px; background:var(--amber); border-radius:2px; }
  ul{ padding-left:1.3rem; margin:.6rem 0 1rem; }
  a{ color:var(--teal); text-decoration:underline; text-decoration-color:var(--hair); text-underline-offset:2px; }
  a:hover{ color:var(--amber-dark); }
  strong{ font-weight:600; color:var(--ink); }
  .zh strong{ font-weight:700; }
  table{ width:100%; border-collapse:collapse; margin:1rem 0 1.4rem; font-size:.9rem; }
  th,td{ border:1px solid var(--hair); padding:.55rem .7rem; text-align:left; vertical-align:top; }
  figure.fig{ margin:1.4rem 0; padding:0; }
  figure.fig img{ width:100%; height:auto; display:block; border:1px solid var(--hair); border-radius:6px; background:#fff; }
  figure.fig figcaption{ margin-top:.5rem; font-size:.85rem; color:var(--ink-soft); cursor:help; padding:.15rem .3rem; border-radius:4px; }
  figure.fig figcaption:hover{ background:var(--amber-tint); }
  figure.fig figcaption .tag{ font-family:'JetBrains Mono',monospace; font-size:.7rem; color:var(--amber-dark); margin-right:.4rem; }
  th{ background:var(--teal-tint); color:var(--teal); font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.03em; }
  td.tr{ cursor:help; }
  td.tr:hover{ background:var(--amber-tint); }
  #tooltip{ position:fixed; z-index:50; max-width:340px; background:var(--placard-bg); color:var(--placard-text);
    border:1px solid var(--amber); border-radius:6px; padding:.65rem .8rem; font-size:.85rem; line-height:1.55;
    box-shadow:0 6px 18px rgba(0,0,0,.22); pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .1s, transform .1s; }
  #tooltip.show{ opacity:1; transform:translateY(0); }
  #tooltip .tag{ display:block; font-family:'JetBrains Mono',monospace; font-size:.65rem; color:var(--amber); letter-spacing:.1em; margin-bottom:.3rem; text-transform:uppercase; }
  #tooltip.zh-font{ font-family:'Noto Sans TC',sans-serif; }
  .navfoot{ max-width:760px; margin:2rem auto 0; padding:0 1.5rem; display:flex; justify-content:space-between; gap:1rem; }
  .navfoot button{ appearance:none; border:1px solid var(--hair); background:var(--paper); color:var(--ink);
    font-family:'JetBrains Mono',monospace; font-size:.78rem; padding:.55rem 1rem; border-radius:6px; cursor:pointer; }
  .navfoot button:hover{ border-color:var(--amber); color:var(--amber-dark); }
  .navfoot button:disabled{ opacity:.35; cursor:default; }
  footer{ max-width:760px; margin:2rem auto 0; padding:1.2rem 1.5rem 0; border-top:1px solid var(--hair); font-size:.8rem; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
  @media (max-width:600px){ .masthead h1{ font-size:1.6rem; } }
</style>

const CHAPTERS = [
{
  id:'ch1', num:1,
  titleEn:'Chapter 1 — Introduction To Flying',
  titleZh:'第一章 — 飛行導論',
  subEn:'Original pages 1-1 to 1-24. Hover any paragraph for the English source text.',
  subZh:'原文頁碼 1-1 至 1-24。滑鼠移到任一段落上可看英文原文。',
  blocks:[
{t:'h2', en:'History of Flight', zh:'飛行的歷史'},
{t:'p', en:'From prehistoric times, humans watched birds and longed to imitate flight, but lacked the power to do so. During the 1500s, Leonardo da Vinci sketched proposed flying machines based on birdlike wings, but the ideas were flawed. By 1655, Robert Hooke concluded the human body lacks the strength to power artificial wings and that flight would require artificial propulsion.',
 zh:'自史前時代起，人類就觀察鳥類飛行並渴望模仿，卻缺乏達成的能力。1500年代，達文西在筆記本畫滿仿鳥翼的飛行器草圖，但構想有根本缺陷。到了1655年，羅伯特·虎克（Robert Hooke）得出結論：人體肌力不足以驅動人工翅膀，飛行必須依賴人工推進動力。'},
{t:'p', en:'In 1783, the first manned hot air balloon (Joseph and Étienne Montgolfier) flew for 23 minutes; ten days later Jacques Charles flew the first gas balloon. Balloons solved lift but not control of speed and direction — that answer came from the kite, introduced to the West in the 13th century.',
 zh:'1783年，第一次載人熱氣球飛行（由蒙格菲兄弟 Joseph 與 Étienne 執行）持續了23分鐘；十天後 Jacques Charles 完成第一次氣體氣球飛行。氣球解決了升力問題，卻無法控制速度與方向——答案來自風箏，這項工具在13世紀傳入西方。'},
{t:'p', en:'Sir George Cayley ("Father of Aerial Navigation") studied kite-shaped wings, discovered the basic principles of modern aeronautics, built the first successful flying model, and tested the first full-size man-carrying glider.',
 zh:'喬治·凱萊爵士（Sir George Cayley，「航空之父」）研究風箏狀機翼，發現了現代航空學的基本原理，建造出第一具成功的飛行模型，並試飛了第一架全尺寸載人滑翔機。'},
{t:'p', en:'Wilbur and Orville Wright achieved powered, controlled flight at Kitty Hawk, NC, on December 17, 1903, after 4 years of experimenting with kites, a homemade wind tunnel, and various engines. By the afternoon of the 17th they had flown a total of 98 seconds across four flights.',
 zh:'萊特兄弟（Wilbur 與 Orville）在歷經4年的風箏、自製風洞與各種引擎實驗後，於1903年12月17日在北卡羅來納州小鷹鎮（Kitty Hawk）完成有動力、可操控的飛行。到當天下午為止，四次飛行累計飛行時間達98秒。'},

{t:'h2', en:'History of the Federal Aviation Administration (FAA)', zh:'聯邦航空總署（FAA）沿革'},
{t:'p', en:'Early aviation had no government oversight; flights were mostly for sport. The St. Petersburg–Tampa Airboat Line (1914) proved commercial passenger air travel was viable — the first scheduled airline flight in the U.S., 21 miles, 23 minutes, first paying passenger A. C. Pheil ($400 winning bid).',
 zh:'早期航空業沒有政府監管，飛行多半是為了運動娛樂。聖彼得堡—坦帕水上飛機航線（1914年）證明了商業客運航空的可行性——這是美國第一條定期航班，全程21英里、飛行23分鐘，第一位付費乘客是以400美元標得座位的 A. C. Pheil。'},
{t:'h3', en:'Transcontinental Air Mail Route', zh:'橫貫大陸航空郵路'},
{t:'li', en:'First airmail flight: May 15, 1918 (New York–Washington, DC)', zh:'第一次航空郵件飛行：1918年5月15日（紐約—華盛頓特區）'},
{t:'li', en:'USPS took control of airmail routes in August 1918', zh:'美國郵政署於1918年8月接管航空郵路'},
{t:'li', en:'Transcontinental Mail Route: San Francisco–New York, 2,612 miles, 13 stops', zh:'橫貫大陸郵路：舊金山—紐約，全長2,612英里，設13個停靠站'},
{t:'li', en:'Air Commerce Act (May 20, 1926) — cornerstone of U.S. aviation law; charged the Secretary of Commerce with fostering air commerce, air traffic rules, licensing pilots, certificating aircraft, and airways/navaids', zh:'《航空商業法》（1926年5月20日）——美國航空法的基石，授權商務部長負責促進航空商業、訂定飛航規則、發放飛行員執照、飛機適航認證與航路／助航設施'},
{t:'li', en:'Created the Aeronautics Branch of the Dept. of Commerce', zh:'成立商務部航空處（Aeronautics Branch）'},
{t:'h3', en:'Federal Certification of Pilots and Mechanics', zh:'飛行員與機工的聯邦證照制度'},
{t:'li', en:'First pilot license issued April 6, 1927 to William P. MacCracken, Jr.', zh:'1927年4月6日核發第一張飛行員執照，由 William P. MacCracken, Jr. 取得'},
{t:'li', en:'First federal aircraft mechanic license issued ~3 months later', zh:'約3個月後核發第一張聯邦飛機機工執照'},
{t:'li', en:'First airworthiness type certificate: March 29, 1927 (Buhl Airster CA-3)', zh:'第一張適航型別證書：1927年3月29日（Buhl Airster CA-3型機）'},
{t:'li', en:'1934: Aeronautics Branch renamed Bureau of Air Commerce', zh:'1934年：航空處更名為航空商業局（Bureau of Air Commerce）'},
{t:'h3', en:'The Civil Aeronautics Act of 1938', zh:'1938年《民航法》'},
{t:'p', en:'Created the Civil Aeronautics Authority (CAA), later split by FDR into: Civil Aeronautics Administration (CAA) — ATC, airman/aircraft certification, rule enforcement, new airways; and Civil Aeronautics Board (CAB) — rulemaking, accident investigation, economic regulation of airlines.',
 zh:'成立民航局（Civil Aeronautics Authority, CAA），後經羅斯福總統拆分為兩個機構：民航管理處（CAA）——負責航管、飛行員／飛機證照、法規執行、新航路；以及民航委員會（CAB）——負責訂定法規、事故調查、航空公司經濟監管。'},
{t:'h3', en:'The Federal Aviation Act of 1958', zh:'1958年《聯邦航空法》'},
{t:'p', en:'Created the independent Federal Aviation Agency (FAA), absorbing CAA\'s roles and CAB\'s rulemaking authority. Gave FAA full control of the common civil-military air navigation/ATC system. First Administrator: Gen. Elwood "Pete" Quesada (1959–1961).',
 zh:'成立獨立的聯邦航空署（Federal Aviation Agency, FAA），接收CAA的職責與CAB的法規制定權，並賦予FAA對軍民共用飛航導航／航管系統的完全控制權。首任署長為 Elwood「Pete」Quesada 將軍（任期1959–1961年）。'},
{t:'h3', en:'Department of Transportation (DOT)', zh:'交通部（DOT）'},
{t:'li', en:'Established Oct 15, 1966; began operations April 1, 1967', zh:'1966年10月15日成立；1967年4月1日開始運作'},
{t:'li', en:'Federal Aviation Agency renamed Federal Aviation Administration (FAA)', zh:'聯邦航空署更名為聯邦航空總署（FAA）'},
{t:'li', en:'CAB\'s accident-investigation role moved to the new NTSB', zh:'CAB的事故調查職責移交新成立的國家運輸安全委員會（NTSB）'},
{t:'li', en:'Post-9/11: security duties transferred to the new Department of Homeland Security (DHS)', zh:'911事件後：安全職責移交新成立的國土安全部（DHS）'},
{t:'h3', en:'ATC Automation', zh:'航管自動化'},
{t:'li', en:'Mid-1970s: semi-automated ATC (radar + computer)', zh:'1970年代中期：半自動化航管系統（雷達＋電腦）'},
{t:'li', en:'National Airspace System (NAS) Plan unveiled January 1982', zh:'1982年1月公布國家空域系統（NAS）計畫'},
{t:'h3', en:'The PATCO Strike', zh:'PATCO 罷工事件'},
{t:'li', en:'Illegal strike, August 1981 → government dismissed 11,000+ controllers, decertified PATCO', zh:'1981年8月非法罷工 → 政府解雇逾11,000名航管員，並取消PATCO工會資格'},
{t:'h3', en:'The Airline Deregulation Act of 1978', zh:'1978年《航空公司解除管制法》'},
{t:'li', en:'Removed CAB\'s control of fares, routes, and schedules', zh:'撤除CAB對票價、航線與班表的管制權'},
{t:'li', en:'CAB formally abolished in 1984', zh:'CAB於1984年正式廢止'},

{t:'h2', en:'The Role of the FAA', zh:'FAA 的職能'},
{t:'h3', en:'The Code of Federal Regulations (CFR)', zh:'聯邦法規彙編（CFR）'},
{t:'p', en:'FAA regulations sit under Title 14 CFR — "Aeronautics and Space."', zh:'FAA的法規歸類於 Title 14 CFR——「航空與太空」篇。'},
{t:'li', en:'14 CFR Part 61 — certification of pilots, flight instructors, ground instructors (eligibility, knowledge, flight proficiency, training/testing requirements)', zh:'14 CFR Part 61——飛行員、飛行教官、地面教官證照（資格條件、知識、飛行熟練度、訓練／測驗要求）'},
{t:'li', en:'14 CFR Part 91 — general flight rules, VFR, IFR', zh:'14 CFR Part 91——一般飛航規則、目視飛行規則（VFR）、儀器飛行規則（IFR）'},
{t:'li', en:'14 CFR Part 43 — maintenance, preventive maintenance, rebuilding, alterations', zh:'14 CFR Part 43——維修、預防性維修、重建、改裝'},
{t:'h3', en:'Primary Locations / Field Offices', zh:'主要據點／地方辦事處'},
{t:'li', en:'HQ: Washington, DC; 9 regional offices', zh:'總部位於華盛頓特區；設有9個區域辦事處'},
{t:'li', en:'Mike Monroney Aeronautical Center (MMAC) — Oklahoma City, OK (training/logistics)', zh:'Mike Monroney 航空中心（MMAC）——位於奧克拉荷馬市（負責訓練與後勤）'},
{t:'li', en:'William J. Hughes Technical Center (WJHTC) — Atlantic City, NJ (R&D/test)', zh:'William J. Hughes 技術中心（WJHTC）——位於紐澤西州大西洋城（負責研發與測試）'},
{t:'li', en:'Flight Standards District Office (FSDO) — ~80 offices, main public-facing contact point; staffed by Aviation Safety Inspectors (ASIs)', zh:'飛航標準地區辦事處（FSDO）——約80處，是對外服務的主要窗口，由航空安全檢查員（ASI）負責'},
{t:'h3', en:'FAA Safety Team (FAASTeam)', zh:'FAA安全團隊（FAASTeam）'},
{t:'p', en:'Replaced the older Aviation Safety Program (ASP); coordinated effort to reduce accidents via harder-to-fix causes. Managed regionally by the Regional FAASTeam Manager (RFM). Resources at faasafety.gov.',
 zh:'取代舊有的航空安全計畫（ASP），以協調方式針對更難根除的事故成因進行改善，由各區域的FAASTeam經理（RFM）負責管理，相關資源可見 faasafety.gov。'},
{t:'h3', en:'FAA Reference Material', zh:'FAA 參考資料'},
{t:'table', head:['Document','Purpose'], headZh:['文件','用途'], rows:[
  {en:'AIM (Aeronautical Information Manual)', zh:'AIM（航空資訊手冊）', en2:'Official guide to flight info & ATC procedures', zh2:'飛航資訊與航管程序的官方指南'},
  {en:'Handbooks', zh:'各類手冊', en2:'Aircraft / aviation / examiner-inspector categories', zh2:'分為飛機、航空、考官／檢查員三大類'},
  {en:'Advisory Circulars (ACs)', zh:'諮詢通告（AC）', en2:'Informational, non-regulatory guidance', zh2:'提供資訊性質的非強制性指引'},
  {en:'POH (Pilot Operating Handbook)', zh:'POH（飛行員操作手冊）', en2:'Manufacturer-specific, FAA-approved, per aircraft serial number', zh2:'由製造商提供、經FAA核准，依飛機序號個別對應'}
]},
{t:'p', en:'AC numbering example: 61-65E — first part = subject area (matches CFR part), dash number = sequence within subject, trailing letter = revision (no letter = original).',
 zh:'AC編號範例：61-65E——前段數字代表主題領域（對應CFR篇章），破折號後數字代表該主題內的序號，末尾字母代表修訂版次（無字母即為原始版本）。'},
{t:'h3', en:'NOTAMs (Notices to Airmen)', zh:'飛航公告（NOTAM）'},
{t:'p', en:'Time-critical aeronautical info not known early enough for normal charts/publications.', zh:'指來不及編入正常航圖或出版品、具時效性的重要飛航資訊。'},
{t:'p', en:'4 categories: NOTAM (D), FDC NOTAMs, Pointer NOTAMs, Military NOTAMs', zh:'共4大類：NOTAM (D)、FDC NOTAM、指標型NOTAM、軍方NOTAM'},
{t:'p', en:'NOTAM (D) required keywords: RWY, TWY, RAMP, APRON, AD, OBST, NAV, COM, SVC, AIRSPACE, (U), (O)', zh:'NOTAM (D) 必要關鍵字：RWY、TWY、RAMP、APRON、AD、OBST、NAV、COM、SVC、AIRSPACE、(U)、(O)'},
{t:'p', en:'FDC NOTAMs = regulatory in nature: interim IFR procedures, airway/airspace changes, TFRs, presidential TFRs, Part 139 airport condition changes, snow/glideslope, air defense emergencies, laser activity, etc.',
 zh:'FDC NOTAM 屬於法規性質：包含臨時儀器飛行程序、航路／空域變更、暫時飛航限制（TFR）、總統維安TFR、Part 139機場狀況變更、積雪／滑降台狀況、防空緊急狀況、雷射活動等。'},
{t:'p', en:'Composition order: ! → accountability location → affected location → KEYWORD → surface ID (optional) → condition → time (UTC, 10-digit: YYMMDDHHmm)',
 zh:'組成順序：驚嘆號(!) → 責任地點 → 受影響地點 → 關鍵字 → 表面代碼（選填） → 狀況內容 → 時間（UTC，10位數：年月日時分）'},
{t:'h3', en:'Safety Program Airmen Notification System (SPANS)', zh:'安全計畫飛行員通知系統（SPANS）'},
{t:'p', en:'Online seminar/event notification system (launched 2004), replacing the old paper mail system — faasafety.gov/spans.',
 zh:'線上研討會／活動通知系統（2004年上線），取代舊有的紙本郵寄通知方式——網址為 faasafety.gov/spans。'},

{t:'h2', en:'Aircraft Classifications and Ultralight Vehicles', zh:'航空器分類與超輕型載具'},
{t:'p', en:'Aircraft (14 CFR 1.1): device used/intended for flight in the air. Ultralight vehicle (14 CFR 103): powered <254 lb empty weight; unpowered <155 lb. Separate, simpler cert/registration rules; no pilot certificate required.',
 zh:'「航空器」（14 CFR 1.1定義）：指用於或意圖用於空中飛行的裝置。「超輕型載具」（14 CFR 103定義）：有動力者空機重量須低於254磅、無動力者須低於155磅，適用較簡化的認證／註冊規則，且不需飛行員執照。'},
{t:'p', en:'Key category definitions (14 CFR 1.1): Airplane, Glider, Lighter-than-air (Airship, Balloon), Powered-lift, Powered parachute, Rocket, Rotorcraft (Gyroplane, Helicopter), Weight-shift-control.',
 zh:'主要類別定義（14 CFR 1.1）：飛機、滑翔機、輕於空氣航空器（飛船、氣球）、動力升力機、動力降落傘、火箭、旋翼機（自轉旋翼機、直升機）、重心操控式飛行器。'},
{t:'p', en:'Size/weight groupings: Large aircraft — >12,500 lb max certificated takeoff weight; Small aircraft — ≤12,500 lb; Light-sport aircraft (LSA) — per 14 CFR 1.1 definition.',
 zh:'依尺寸／重量分類：大型航空器——最大認證起飛重量超過12,500磅；小型航空器——12,500磅以下；輕型運動航空器（LSA）——依14 CFR 1.1定義認定。'},

{t:'h2', en:'Pilot Certifications', zh:'飛行員證照'},
{t:'p', en:'Certificates carry privileges (where/when/with whom/what aircraft) and limitations (imposed if not all skills demonstrated). Endorsements are written/signed authorizations (usually by a CFI) certifying specific training was received.',
 zh:'每種證照都附帶「權限」（可在何時何地、與誰同行、駕駛何種航空器）與「限制」（若未能展現全部技能，主管機關可能施加限制）。「背書」（endorsement）則是書面簽署的授權文件（通常由CFI簽發），證明持證人已接受特定訓練。'},
{t:'h3', en:'Sport Pilot', zh:'運動飛行員'},
{t:'li', en:'Min hours: Airplane 20 · Powered Parachute 12 · Weight-Shift 20 · Glider 10 · Gyroplane 20 · Airship 20 · Balloon 7', zh:'最低時數：飛機20小時・動力降落傘12小時・重心操控式20小時・滑翔機10小時・自轉旋翼機20小時・飛船20小時・氣球7小時'},
{t:'li', en:'Age: 16 to solo (14 for glider/balloon); 17 to test (16 for glider/balloon)', zh:'年齡：單飛需滿16歲（滑翔機／氣球14歲）；考證需滿17歲（滑翔機／氣球16歲）'},
{t:'li', en:'Medical: valid driver\'s license suffices', zh:'體格檢定：持有效駕照即可'},
{t:'li', en:'Limits: no Class A; no Class B/C/D without training+endorsement; no international without foreign permission; no towing; no compensation/hire; no business use',
 zh:'限制：不得飛入A類空域；未經訓練及背書不得飛入B/C/D類空域；未經外國航空主管機關許可不得飛出美國；不得拖曳物體；不得收費載客；不得用於商業用途'},
{t:'li', en:'Certificate issued without category/class ratings — CFI endorsement in logbook covers authorized category/class instead',
 zh:'證照本身不列類別／等級——改由CFI在飛行紀錄簿中背書授權的類別／等級'},
{t:'h3', en:'Recreational Pilot', zh:'休閒飛行員'},
{t:'li', en:'Age 17+; 3rd-class medical', zh:'年滿17歲；須持第三級體格檢定證明'},
{t:'li', en:'30 hrs min: 15 dual + 2 en route + 3 test-prep + 3 solo', zh:'最低30小時：15小時雙飛＋2小時航路訓練＋3小時考前準備＋3小時單飛'},
{t:'li', en:'Cross-country limited to 50 NM from departure (extendable with training, 61.101(c)); no night flying; no airspace requiring ATC comms',
 zh:'越野飛行限制在起飛機場50浬範圍內（經額外訓練可放寬，見61.101(c)）；不得夜航；不得飛入須與航管通話的空域'},
{t:'li', en:'Limit: may not be PIC of aircraft certificated for >4 occupants or >1 powerplant; max 1 passenger',
 zh:'限制：不得擔任核定乘員數超過4人或動力裝置超過1具之航空器的機長；最多可載1名乘客'},
{t:'h3', en:'Private Pilot', zh:'私人飛行員'},
{t:'p', en:'Flies for pleasure/personal business, not compensated (with narrow exceptions); pro-rata expense sharing with passengers OK. Part 61 minimum: 40 hrs (20 dual + 10 solo).',
 zh:'以娛樂／個人事務為目的飛行，不得因飛行收取報酬（僅少數例外情形除外）；可與乘客按比例分攤飛行費用。依Part 61規定最低時數為40小時（20小時雙飛＋10小時單飛）。'},
{t:'h3', en:'Commercial Pilot', zh:'職業飛行員'},
{t:'p', en:'May be compensated for flying. Cannot fly IMC without instrument rating; without instrument rating, limited to daytime flight within 50 NM for hire. Must be able to operate a complex aircraft (retractable gear, movable flaps, controllable-pitch prop) — 61.31(e).',
 zh:'可因飛行收取報酬。未持有儀器等級不得於IMC（儀器氣象條件）下飛行；若無儀器等級，收費飛行僅限白天且距離不超過50浬。須具備操作「複雜航空器」（可收放起落架、可動襟翼、可調變距螺旋槳）的能力——見61.31(e)。'},
{t:'h3', en:'Airline Transport Pilot (ATP)', zh:'航線運輸駕駛員（ATP）'},
{t:'p', en:'Highest certification level; prerequisite for PIC/SIC of scheduled airline ops (and PIC for select charter/fractional). Min 1,500 hrs; age 23+; restricted-privilege ATP (SIC only) available at reduced hours, min age 21.',
 zh:'最高等級的證照；是擔任定期航班機長／副機長（及部分包機／分時共有營運機長）的必要條件。最低時數1,500小時；年齡須滿23歲；另有限制權限ATP（僅限副機長），可依較少時數取得，最低年齡21歲。'},

{t:'h2', en:'Selecting a Flight School', zh:'選擇飛行學校'},
{t:'p', en:'Training conducted under 14 CFR Part 142 (training centers/flight academies — voluntary FAA cert, mainly airline/commercial contract training), Part 141 (certificated schools, approved curriculum/TCO, can shorten required hours — e.g., Private Pilot min 35 hrs vs. 40 under Part 61), or Part 61 (individual instructors/non-certificated schools — flexible but less structured).',
 zh:'飛行訓練依循三種規範：14 CFR Part 142（訓練中心／飛行學院——自願申請FAA認證，主要承接航空公司／商業合約訓練）、Part 141（經認證學校，須採用經核准的課程／TCO，可縮短所需時數，例如私人飛行員最低時數為35小時，比Part 61的40小時少）、或Part 61（個別教官／未認證學校——較有彈性但結構性較弱）。'},
{t:'p', en:'National average: most private pilots actually need 60–75 hrs regardless of minimums.', zh:'全國平均而言，大多數私人飛行員實際所需時數落在60至75小時之間，並非只達到最低門檻。'},
{t:'p', en:'Choosing a CFI — responsibilities include: orienting the student to scenario-based training, building the student into a confident planner/self-evaluator, diagnosing learning difficulties, evaluating progress/records, continuous review.',
 zh:'選擇CFI（合格飛行教官）——其職責包含：引導學生熟悉情境式訓練、培養學生成為有自信的飛行規劃者／自我評估者、診斷學習困難、評估學習進度並保存紀錄、持續複習。'},

{t:'h2', en:'The Student Pilot', zh:'學生飛行員'},
{t:'h3', en:'Basic Requirements', zh:'基本資格'},
{t:'li', en:'Age 16+ (14+ for glider/balloon)', zh:'年滿16歲（滑翔機／氣球為14歲）'},
{t:'li', en:'Read/speak/write/understand English', zh:'能夠閱讀、說、寫及理解英語'},
{t:'li', en:'Student Pilot Certificate required before solo; issued via IACRA, plastic card, no expiration (old paper certs expire on their printed date and can\'t be renewed — must reapply under new process)',
 zh:'單飛前須取得學生飛行員證；透過IACRA系統核發，為塑膠卡片形式且無到期日（舊式紙本證照按印製日期到期且不得展延——須依新流程重新申請）'},
{t:'li', en:'Solo authorization now goes in the logbook endorsement, not on the certificate itself', zh:'單飛授權現改為記錄在飛行紀錄簿的背書欄位，而非直接寫在證照上'},
{t:'h3', en:'Medical Certification', zh:'體格檢定證明'},
{t:'li', en:'Required for airplane/helicopter/gyroplane/airship; not required for glider/balloon (statement of no medical defect instead)',
 zh:'飛機／直升機／自轉旋翼機／飛船須具備；滑翔機／氣球則不需要（改以聲明無醫療缺陷取代）'},
{t:'li', en:'Sport pilot: driver\'s license suffices, no medical exam', zh:'運動飛行員：持駕照即可，不需體檢'},
{t:'li', en:'Issued by an FAA-Authorized AME (~6,000 nationwide)', zh:'由FAA授權的航空體檢醫師（AME）核發（全美約6,000位）'},
{t:'li', en:'Classes: 1st (ATP) · 2nd (Commercial) · 3rd (Student/Recreational/Private)', zh:'等級：第一級（ATP用）・第二級（職業飛行員用）・第三級（學生／休閒／私人飛行員用）'},
{t:'li', en:'Apply via MedXPress', zh:'透過MedXPress系統申請'},
{t:'h3', en:'Student Pilot Solo Requirements', zh:'學生飛行員單飛條件'},
{t:'p', en:'No minimum hours/knowledge just to get the Student Pilot Certificate — but minimum aeronautical knowledge/experience is required before a CFI can endorse for solo.',
 zh:'取得學生飛行員證本身沒有最低時數／知識門檻——但CFI要背書允許單飛前，學生仍須具備最低限度的航空知識與飛行經驗。'},

{t:'h2', en:'Becoming a Pilot', zh:'成為飛行員的歷程'},
{t:'p', en:'Governed by 14 CFR Part 61: Recreational (Subpart D) · Private (Subpart E) · Sport (Subpart J).', zh:'依循14 CFR Part 61規範：休閒飛行員（Subpart D）・私人飛行員（Subpart E）・運動飛行員（Subpart J）。'},
{t:'p', en:'4 steps to learning a maneuver: 1) CFI introduces/demonstrates 2) CFI talks student through it 3) Student practices under supervision 4) CFI authorizes solo practice',
 zh:'學習一項飛行動作的四個步驟：1）CFI講解並示範 2）CFI口頭引導學生操作 3）學生在CFI監督下練習 4）CFI授權學生自行單飛練習'},

{t:'h2', en:'Knowledge and Skill Tests', zh:'學科與術科測驗'},
{t:'h3', en:'Knowledge Test', zh:'學科測驗'},
{t:'p', en:'Computer-based, multiple-choice. FAA recommends taking it after the solo cross-country flight, so real operational experience helps. CFI decides readiness.',
 zh:'採電腦化多重選擇題形式。FAA建議在完成單飛越野飛行後再應試，讓實際操作經驗有助於作答。是否已準備好應試由CFI判斷。'},
{t:'h3', en:'Practical Test', zh:'術科測驗'},
{t:'p', en:'Standards: PTS (older) being replaced by ACS (Airman Certification Standards) — ACS adds task-specific knowledge + risk-management elements to each PTS Area of Operation/Task.',
 zh:'測驗標準：舊有的PTS（術科測驗標準）正逐步由ACS（飛行員能力標準）取代——ACS在PTS原有的每個作業領域／項目中，加入了特定任務知識與風險管理要素。'},
{t:'p', en:'Documents applicant must present: FAA Form 8710-1 (8710.11 for sport pilot) with CFI recommendation; Airman Knowledge Test Report (passing grade); Medical certificate (n/a glider/balloon) + Student Pilot Certificate + endorsed logbook; Logbook records; Part 141 graduation certificate (if applicable).',
 zh:'應試人須出示的文件：FAA表格8710-1（運動飛行員為8710.11），並附CFI推薦；學科測驗成績報告（須達及格標準）；體格檢定證明（滑翔機／氣球免附）＋學生飛行員證＋已背書的飛行紀錄簿；飛行紀錄簿本身；Part 141結業證書（如適用）。'},
{t:'p', en:'Aircraft documents to produce: registration, airworthiness certificate, operating limitations/AFM, equipment list, weight & balance data, maintenance records, applicable ADs.',
 zh:'須提供的航空器文件：登記證、適航證、操作限制／飛航手冊、裝備清單、重量平衡資料、維修紀錄、適用的適航指令（AD）。'},
{t:'p', en:'Administered by: FAA ASIs or DPEs (Designated Pilot Examiners) — DPEs handle the majority of private/commercial practical tests; may charge a reasonable fee (no charge if administered by an FAA inspector directly).',
 zh:'施測單位：FAA航空安全檢查員（ASI）或指定考官（DPE）——大多數私人／職業飛行員的術科測驗由DPE施測，可收取合理費用（若由FAA檢查員直接施測則不收費）。'},
{t:'h3', en:'Role of the CFI', zh:'CFI（合格飛行教官）的角色'},
{t:'p', en:'Full responsibility for student training; "cornerstone of aviation safety." Must model correct habits — students consciously/unconsciously imitate their instructor\'s flying.',
 zh:'對學生訓練負全責，被視為「航空安全的基石」。教官必須樹立正確的飛行習慣典範——學生會有意或無意地模仿教官的飛行方式。'},
{t:'h3', en:'Role of the DPE', zh:'DPE（指定考官）的角色'},
{t:'p', en:'Appointed under 14 CFR 183.23; must be technically qualified, hold relevant ratings, current per 61.56/61.57/61.58, valid medical, current CFI (if required). Administers tests to the same standard as an FAA ASI.',
 zh:'依14 CFR 183.23指派；須具備技術資格、持有相關等級、符合61.56／61.57／61.58的最新規定、持有效體檢證明、視需要保有CFI資格。施測標準須與FAA ASI一致。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'FAA safety approach = "safety is a learned behavior." Emphasis on flight instructor responsibility for safe habits (collision avoidance/scanning, checklists, runway incursion avoidance, positive transfer of controls, workload management) and Scenario-Based Training (SBT), tied into ADM, risk management, and CRM — covered in Chapter 2.',
 zh:'FAA的安全理念認為「安全是後天習得的行為」。本章強調飛行教官在建立安全習慣上的責任（防撞／目視掃描、檢查表使用、跑道侵入防範、操縱權正確交接、工作負荷管理），並帶出「情境式訓練」（SBT），並與航空決策（ADM）、風險管理、機組資源管理（CRM）相互連結——這些主題將在第二章進一步說明。'}
  ]
},
{
  id:'ch2', num:2,
  titleEn:'Chapter 2 — Aeronautical Decision-Making',
  titleZh:'第二章 — 航空決策（ADM）',
  subEn:'Original pages 2-1 to 2-32. High relevance to CRM / risk management interview scenarios.',
  subZh:'原文頁碼 2-1 至 2-32。與CRM／風險管理面試情境題高度相關。',
  blocks:[
{t:'p', en:'ADM = a systematic approach to the mental process pilots use to consistently determine the best course of action given a set of circumstances — what a pilot intends to do based on the latest available information.',
 zh:'ADM（航空決策）＝飛行員在特定情境下，用來持續判斷最佳行動方案的系統化思考流程——也就是飛行員根據當下最新資訊所打算採取的行動。'},
{t:'p', en:'~80% of aviation accidents relate to human factors. Highest-risk phases: landing (24.1%) and takeoff (23.4%), despite these being a small % of total flight time. Reference: <a href="https://www.faa.gov/regulations_policies/advisory_circulars/index.cfm/go/document.information/documentid/22624" target="_blank">AC 60-22, "Aeronautical Decision-Making."</a>',
 zh:'約80%的航空事故與人為因素有關。風險最高的階段是落地（24.1%）與起飛（23.4%），儘管這兩階段僅佔總飛行時間的一小部分。參考資料：<a href="https://www.faa.gov/regulations_policies/advisory_circulars/index.cfm/go/document.information/documentid/22624" target="_blank">AC 60-22《航空決策》</a>。'},

{t:'h2', en:'History of ADM', zh:'ADM 的發展沿革'},
{t:'li', en:'Airline industry developed the first ADM-based training, motivated by reducing human-factor accidents', zh:'航空業界為降低人為因素事故，率先開發以ADM為基礎的訓練課程'},
{t:'li', en:'CRM (Crew Resource Management) = effective use of all available resources (human, hardware, information) to support ADM and improve crew decision-making', zh:'CRM（機組資源管理）＝有效運用所有可用資源（人力、硬體、資訊）以支持ADM並提升機組決策品質'},
{t:'li', en:'FAA ADM research culminated in 1987: six manuals published for different pilot ratings', zh:'FAA的ADM研究於1987年達到高峰：針對不同等級飛行員出版了六本手冊'},
{t:'li', en:'Validated results: ADM-trained pilots made 10–50% fewer judgment errors; one operator (~400,000 hrs/yr) saw a 54% accident-rate reduction after using ADM materials for recurrency training',
 zh:'驗證結果：接受過ADM訓練的飛行員判斷錯誤減少10–50%；某營運商（年飛行時數約40萬小時）在複訓使用ADM教材後，事故率降低54%'},
{t:'li', en:'Good judgment can be taught — not purely a byproduct of experience', zh:'良好的判斷力是可以被教導的——並非單純由經驗自然產生'},
{t:'p', en:'6 steps for good decision-making: 1) Identifying personal attitudes hazardous to safe flight 2) Learning behavior modification techniques 3) Learning how to recognize and cope with stress 4) Developing risk assessment skills 5) Using all resources 6) Evaluating the effectiveness of one\'s ADM skills',
 zh:'良好決策的六個步驟：1）辨識對飛安有害的個人態度 2）學習行為修正技巧 3）學習辨識與應對壓力 4）培養風險評估能力 5）運用所有資源 6）評估自己ADM技巧的成效'},

{t:'h2', en:'Risk Management', zh:'風險管理'},
{t:'p', en:'Goal: proactively identify hazards and mitigate risk. 4 fundamental principles: 1) Accept no unnecessary risk 2) Make risk decisions at the appropriate level (PIC decides, never ATC or passengers) 3) Accept risk when benefits outweigh dangers/costs 4) Integrate risk management into planning at all levels — not just preflight, throughout the flight',
 zh:'目標：主動辨識危害並降低風險。四大基本原則：1）不承擔不必要的風險 2）在適當層級做出風險決策（由機長決定，絕非航管或乘客） 3）當效益大於代價時可接受風險 4）將風險管理融入所有階段的規劃——不只是飛行前，整個飛行過程都要持續進行'},
{t:'p', en:'6-step risk management process: Identify Hazards → Assess Risks → Analyze Controls → Make Control Decisions → Use Controls → Monitor Results',
 zh:'六步驟風險管理流程：辨識危害 → 評估風險 → 分析管控措施 → 做出管控決策 → 執行管控措施 → 監控結果'},

{t:'h2', en:'CRM and Single-Pilot Resource Management (SRM)', zh:'CRM 與單一飛行員資源管理（SRM）'},
{t:'p', en:'SRM = the art and science of managing all resources (onboard + external) available to a single pilot (before and during flight) to ensure successful flight outcome. SRM includes: ADM, Risk Management (RM), Task Management (TM), Automation Management (AM), CFIT awareness, Situational Awareness (SA).',
 zh:'SRM＝管理單一飛行員在飛行前與飛行中所能運用的一切資源（機上與機外）的藝術與科學，以確保飛行順利完成。SRM涵蓋：ADM、風險管理（RM）、任務管理（TM）、自動化管理（AM）、可控飛行撞地（CFIT）意識、情境警覺（SA）。'},

{t:'h2', en:'Hazard and Risk', zh:'危害與風險'},
{t:'li', en:'Hazard = a real or perceived condition/event/circumstance a pilot encounters (e.g., a nick in a prop blade)', zh:'危害＝飛行員遭遇的真實或感知狀況／事件／情境（例如螺旋槳葉片上的一個缺口）'},
{t:'li', en:'Risk = the pilot\'s assessment of that hazard\'s potential impact — different pilots assess the same hazard differently (experience-dependent)', zh:'風險＝飛行員對該危害潛在影響的評估——不同飛行員對同一危害的評估會不同（取決於經驗）'},
{t:'li', en:'Human factors (education, experience, health, physiological state) profoundly affect risk assessment', zh:'人為因素（教育程度、經驗、健康、生理狀態）會深刻影響風險評估的結果'},
{t:'p', en:'Case example: King Air pilot flew into forecast-from-the-surface icing (previously experienced only icing forecast 2,000 ft above surface) while rushed — misjudged the altitude difference, assigned low risk, died.',
 zh:'案例：一位King Air飛行員在趕時間的情況下飛入預報「自地面起」即有結冰的天氣（過往經驗只飛過預報「地面以上2000呎」才有結冰的狀況）——誤判了高度差異的意義，將風險評為偏低，最終墜機身亡。'},

{t:'h2', en:'Hazardous Attitudes and Antidotes', zh:'危險態度與其解藥'},
{t:'table', head:['Attitude','Thought pattern','Antidote'], headZh:['態度','思考模式','解藥'], rows:[
  {en:'Anti-authority', zh:'反權威', en2:'"Don\'t tell me." — resents rules/being told what to do', zh2:'「不用你說。」——反感被規定或被要求該怎麼做', en3:'Follow the rules. They are usually right.', zh3:'遵守規則，規則通常是對的。'},
  {en:'Impulsivity', zh:'衝動', en2:'"Do it quickly." — acts on the first idea without evaluating alternatives', zh2:'「快點做。」——不評估其他選項，直接採取第一個想到的做法', en3:'Not so fast. Think first.', zh3:'別急，先想清楚。'},
  {en:'Invulnerability', zh:'自認不會出事', en2:'"It won\'t happen to me."', zh2:'「這種事不會發生在我身上。」', en3:'It could happen to me.', zh3:'這種事也可能發生在我身上。'},
  {en:'Macho', zh:'逞強', en2:'"I can do it." — takes risks to impress others (applies equally to men and women)', zh2:'「我辦得到。」——為了讓別人刮目相看而冒險（男女皆有此傾向）', en3:'Taking chances is foolish.', zh3:'冒險是愚蠢的。'},
  {en:'Resignation', zh:'聽天由命', en2:'"What\'s the use?" — feels unable to make a difference, defers to others', zh2:'「有什麼用？」——覺得自己無法改變結果，任由他人決定', en3:'I\'m not helpless. I can make a difference.', zh3:'我不是無能為力，我能做出改變。'}
]},
{t:'p', en:'Process: recognize the thought as hazardous → label it → state the antidote (memorize antidotes so they\'re automatic).',
 zh:'處理流程：察覺該想法屬於危險態度 → 為它貼標籤 → 說出對應的解藥（解藥須背熟，才能在需要時自動浮現）。'},

{t:'h2', en:'Risk', zh:'風險評估'},
{t:'h3', en:'Assessing Risk', zh:'評估風險'},
{t:'li', en:'Single pilots are their own quality control — tendency to deny personal limitations under goal-orientation (e.g., EMS helicopter pilots over-weighting patient welfare vs. actual hazards like fatigue/weather)',
 zh:'單飛飛行員必須自己做品質把關——在目標導向心態下容易否認自身限制（例如救護直升機飛行員常過度看重病患福祉，而低估疲勞或天氣等實際危害）'},
{t:'li', en:'Night VFR accident rate drops ~50% after first 100 hrs, continues improving to 1,000 hrs → consider higher personal minimums for first 500 hrs of night VFR',
 zh:'夜間VFR事故率在累積100小時後降低約50%，並持續改善至1000小時→建議在夜間VFR前500小時採取更嚴格的個人最低標準'},
{t:'p', en:'Risk Matrix — two factors: Likelihood: Probable (will occur several times) · Occasional (will probably occur sometime) · Remote (unlikely but possible) · Improbable (highly unlikely). Severity: Catastrophic (fatalities/total loss) · Critical (severe injury/major damage) · Marginal (minor injury/minor damage) · Negligible (less than minor)',
 zh:'風險矩陣——兩項因子：可能性：機率高（會發生多次）・偶發（可能會發生一次）・罕見（不太可能但仍有可能）・極不可能（幾乎不會發生）。嚴重度：災難性（造成死亡／全損）・重大（嚴重傷害／重大損害）・輕微（輕傷／輕微損害）・可忽略（低於輕微程度）'},
{t:'h3', en:'Mitigating Risk', zh:'降低風險'},
{t:'p', en:'Example (MVFR flight, 50nm): wait for better weather · take an instrument-rated pilot · delay · cancel · drive.',
 zh:'範例（50浬的MVFR飛行）：等天氣好轉・找一位持儀器等級的飛行員同行・延後出發・取消飛行・改開車前往。'},
{t:'p', en:'IMSAFE checklist (physical/mental readiness): Illness — sick? Medication — affecting judgment/drowsy? Stress — job/money/health/family pressure (not a regulatory grounding condition, but affects performance). Alcohol — within 8/24 hrs (even small amounts can impair). Fatigue — inadequately rested (often not apparent until errors occur). Emotion — emotionally upset?',
 zh:'IMSAFE檢查表（生理／心理準備度）：疾病（Illness）——是否生病？藥物（Medication）——是否影響判斷力或引起嗜睡？壓力（Stress）——工作／金錢／健康／家庭壓力（雖非法規上須停飛的條件，但仍會影響表現）。酒精（Alcohol）——過去8小時／24小時內是否飲酒（即使少量也可能影響飛行能力）。疲勞（Fatigue）——是否休息不足（往往要到出錯才會察覺）。情緒（Emotion）——是否情緒不穩？'},

{t:'h2', en:'The PAVE Checklist', zh:'PAVE 檢查表'},
{t:'p', en:'Divides flight risk into 4 categories: Pilot-in-command, Aircraft, enVironment, External pressures.',
 zh:'將飛行風險分為四大類：機長（Pilot）、航空器（Aircraft）、環境（enVironment）、外部壓力（External pressures）。'},
{t:'p', en:'Key distinction: what\'s "legal" (regulations) vs. what\'s "smart/safe" (pilot\'s actual experience/proficiency) — set personal minimums below aircraft/regulatory limits based on your own current experience level.',
 zh:'重要區別：法規上「合法」與依飛行員實際經驗／熟練度而定的「明智／安全」是兩回事——應根據自己目前的經驗水準，設定低於飛機或法規限制的個人最低標準。'},
{t:'h3', en:'P = Pilot in Command', zh:'P＝機長'},
{t:'p', en:'"Am I ready for this trip?" — experience, recency, currency, physical/emotional condition → use IMSAFE.',
 zh:'「我準備好進行這趟飛行了嗎？」——考量經驗、近期飛行紀錄、資格有效性、生理與情緒狀態 → 運用IMSAFE檢查表。'},
{t:'h3', en:'A = Aircraft', zh:'A＝航空器'},
{t:'p', en:'Right aircraft for the flight? Familiar/current in it? AFM performance figures assume a brand-new aircraft flown by a professional test pilot — adjust expectations. Adequately equipped (instruments/lights/nav-comm)? Runway margin adequate? Load/altitude/fuel capacity sufficient? Fuel delivered matches fuel ordered?',
 zh:'這架飛機適合這趟任務嗎？我對它熟悉且保持現行資格嗎？飛航手冊（AFM）上的性能數據，是以全新飛機、由專業試飛員駕駛為基礎——實際評估時需相應調整期望值。裝備是否充足（儀表／燈光／導航通訊設備）？跑道餘裕是否足夠？可承載的重量／可飛的高度／油量是否足夠？加油量是否與訂購量相符？'},
{t:'h3', en:'V = EnVironment', zh:'V＝環境'},
{t:'p', en:'Weather: current ceiling/visibility, possible forecast error, crosswind strength, mountain winds aloft (severe turbulence/downdrafts risk even without other weather), thunderstorms, icing (current/forecast, aircraft\'s icing rating, deicing equipment familiarity).',
 zh:'天氣：目前雲底高與能見度、預報可能有誤、側風強度、山區高空風（即使沒有其他天氣現象，強風仍可能導致嚴重亂流與下降氣流）、雷雨、結冰（現況／預報、飛機的結冰認證、對除冰設備的熟悉度）。'},
{t:'p', en:'Terrain: use VFR/IFR chart altitudes and Maximum Elevation Figures (MEFs) in preflight planning. Airport: available lighting (VASI/PAPI/ILS glideslope), check NOTAMs for closed runways/inop lights, route choice re: engine-failure options, shorter/obstructed fields at destination/alternate.',
 zh:'地形：飛行前規劃時應參考VFR／IFR航圖上的高度資訊與最大高程數值（MEF）。機場：可用的燈光系統（VASI／PAPI／ILS下滑道）、查詢NOTAM確認跑道關閉或燈光故障狀況、選擇航線時考量引擎失效時的備降選項、目的地與備降機場是否跑道較短或有障礙物。'},
{t:'p', en:'Airspace: remote-area survival gear if applicable, be IFR-prepared if losing horizon reference over water/unpopulated areas, check TFRs. Nighttime: be IFR-prepared for night over water/unpopulated terrain; verify safe emergency-landing options at night; preflight-check all lights; carry 2 flashlights.',
 zh:'空域：若飛越偏遠地區，須攜帶適當服裝、水與求生裝備以備迫降；若飛越水面或無人區有失去地平線視覺參考的可能，須做好IFR準備；並確認航路上的暫時飛航限制（TFR）。夜間：夜間飛越水面或無人區時須做好IFR準備；確認夜間是否有安全的緊急落地選項；起飛前檢查所有燈光；隨身攜帶兩支手電筒。'},
{t:'h3', en:'E = External Pressures', zh:'E＝外部壓力'},
{t:'p', en:'Influences pushing to complete a flight at the expense of safety: someone waiting at destination, not wanting to disappoint a passenger, desire to demonstrate qualifications, desire to impress ("Watch this!" — probably the two most dangerous words in aviation), "get-home-itis"/"get-there-itis"/"let\'s-go-itis," general goal-completion orientation, pride about acknowledging lower skill/experience than desired.',
 zh:'指以犧牲飛安為代價、驅使飛行員完成飛行的各種外在影響：有人在目的地等候、不想讓乘客失望、想證明自己的能力、想讓人刮目相看（「你看我的！」可能是航空界最危險的一句話）、「急著回家症」／「急著抵達症」／「非走不可症」、一般性的「一定要完成任務」心態、以及不願承認自己技術或經驗不如預期的自尊心。'},
{t:'p', en:'Managing external pressure (single most important risk-management key — it\'s the one category that can cause a pilot to ignore all other risk factors) via personal SOPs: build in time for extra fuel stops/weather diversions, have backup travel plans, leave early enough that driving is still an option for critical trips, notify people at destination of possible delay in advance, manage passenger expectations about schedule certainty, carry a small overnight kit even on casual day flights to remove pressure to return home same day.',
 zh:'管理外部壓力（風險管理中最重要的一環——因為這是唯一可能導致飛行員忽視所有其他風險因子的類別）可透過個人標準作業程序（SOP）達成：預留額外加油或因天氣落地的時間、準備備用行程方案、對重要行程提早出發以保留開車前往的選項、提前告知目的地相關人員可能延誤、妥善管理乘客對行程時間的期待、即使是輕鬆的當日往返也隨身攜帶簡易過夜包（藥物、隱形眼鏡藥水、盥洗用品），以消除當日必須返家的壓力。'},
{t:'p', en:'Key mindset: "The pilot\'s goal is to manage risk, not create hazards" — be ready to accept delays, same as any traveler.',
 zh:'核心心態：「飛行員的目標是管理風險，而不是製造危害」——要像任何一般旅行者一樣，做好接受延誤的心理準備。'},

{t:'h2', en:'Human Factors', zh:'人為因素'},
{t:'p', en:'Human factors documented as a primary contributor to >70% of aircraft accidents. Field is multidisciplinary (psychology, engineering, industrial design, statistics, ops research, anthropometry) — broader than CRM/MRM (Maintenance Resource Management).',
 zh:'人為因素被記錄為超過70%飛機事故的主要成因。這是一個跨領域學門（涵蓋心理學、工程學、工業設計、統計學、作業研究、人體計測學）——範疇比CRM或MRM（維修資源管理）更為廣泛。'},
{t:'h3', en:'Human Behavior', zh:'人類行為'},
{t:'p', en:'1951 Univ. of Minnesota study (Fuller & Baune): "accident-repeater" 2nd-graders were more aggressive/impulsive/rebellious/attention-seeking vs. accident-free peers who were safety-conscious/cooperative — but concluding pilots should only come from one personality type is both inaccurate and impossible; good decision-making must be taught to all pilots regardless of personality.',
 zh:'1951年明尼蘇達大學研究（Fuller與Baune）：發現「反覆出事」的小學二年級學生較具攻擊性、衝動、叛逆且愛出風頭，相對地無事故組則較有安全意識且合作——但若因此推論飛行員只應由單一人格特質的人組成，這樣的結論既不精確也不可行；良好的決策能力必須教導給所有飛行員，無論其人格特質為何。'},
{t:'p', en:'"Pilot error" reframed more broadly as "human factors related" — accidents are usually a chain of decisions, not one single bad choice (Dr. Patrick Veillette\'s "Captain Everyman" case studies: repeated checklist-skipping across multiple incidents).',
 zh:'「飛行員錯誤」一詞已被更廣泛地重新定義為「人為因素相關」——事故通常源自一連串的決策鏈，而非單一一次的錯誤選擇（Patrick Veillette 博士的「Everyman機長」案例研究中，同一位機長在多起事件中反覆跳過檢查表步驟）。'},
{t:'p', en:'5 traits found in accident-prone pilots (FAA study, 4,000+ pilots surveyed): disdain toward rules; high correlation between flying accidents and driving safety violations; fall into "thrill and adventure seeking" personality category; impulsive rather than methodical/disciplined (both in info-gathering and action selection); disregard or under-utilize outside information sources (copilots, FAs, flight service, instructors, ATC).',
 zh:'FAA針對4000多名飛行員的研究發現，「容易出事的飛行員」具有五項共同特質：輕視規則；飛行事故紀錄與駕車違規紀錄高度相關；屬於「追求刺激與冒險」的人格類型；資訊蒐集與行動選擇上偏向衝動而非有條理與紀律；忽視或未充分利用外部資訊來源（副機師、空服員、飛航服務人員、教官、航管）。'},

{t:'h2', en:'The Decision-Making Process — Structured Models', zh:'結構化決策模型'},
{t:'p', en:'Three frameworks: 5P, 3P (using PAVE, CARE, TEAM), and DECIDE.', zh:'三大架構：5P模型、3P模型（結合PAVE、CARE、TEAM檢查表）、以及DECIDE模型。'},
{t:'h3', en:'The 5 Ps Check', zh:'5P 檢查'},
{t:'p', en:'The Plan · The Plane · The Pilot · The Passengers · The Programming', zh:'計畫（Plan）・飛機（Plane）・飛行員（Pilot）・乘客（Passengers）・程式設定（Programming）'},
{t:'p', en:'Reviewed at 5 key decision points: preflight → pretakeoff → hourly/midpoint → pre-descent → just before final approach fix (or entering traffic pattern for VFR). If flight >2 hrs, review hourly.',
 zh:'應在五個關鍵決策點進行檢視：飛行前 → 起飛前 → 每小時或飛行中點 → 下降前 → 最終進場定位點之前（VFR則為進入航機起降場空層之前）。若飛行時間超過2小時，應每小時檢視一次。'},
{t:'li', en:'Plan — cross-country planning, weather, route, fuel, pub currency; continuously updated (maintenance delays, fast-moving weather, short-notice TFRs)', zh:'計畫——越野飛行規劃、天氣、航線、油量、出版品時效性；應持續更新（維修延誤、快速移動的天氣系統、臨時發布的TFR皆可能改變計畫）'},
{t:'li', en:'Plane — mechanical/cosmetic issues + (advanced avionics era) database currency, automation status, emergency backup systems', zh:'飛機——機械／外觀問題，加上（先進航電時代）資料庫時效性、自動化系統狀態、緊急備用系統'},
{t:'li', en:'Pilot — fatigue, altitude effects (sustained flight above 5,000 ft), late nights → less discerning/more compliant right when the flight gets most critical → use IMSAFE', zh:'飛行員——疲勞、高空效應（持續飛行於5000呎以上）、熬夜——這些都會導致判斷力下降、更傾向順從，而這往往正好發生在飛行最關鍵的時刻→運用IMSAFE檢查表'},
{t:'li', en:'Passengers — unlike CRM, SRM passengers are often close (arm\'s reach); their onward-travel needs enter the pilot\'s decision loop; briefing passengers on real risk removes self-induced pressure', zh:'乘客——與CRM不同，SRM中的乘客通常近在咫尺（伸手可及）；他們後續行程的需求會進入飛行員的決策考量；如實向乘客說明風險，可消除飛行員自我施加的壓力'},
{t:'li', en:'Programming — advanced avionics (GPS/autopilot) reduces workload but can also capture attention for long periods; plan in advance when/where programming should (and shouldn\'t) happen', zh:'程式設定——先進航電（GPS／自動駕駛）能降低工作負荷，但也可能長時間佔據飛行員的注意力；應事先規劃何時、何地該（或不該）進行設定操作'},

{t:'h3', en:'Perceive, Process, Perform (3P) Model', zh:'感知・處理・執行（3P）模型'},
{t:'p', en:'Continuous loop: Perceive circumstances → Process (evaluate impact on flight safety) → Perform (implement best course of action) → re-evaluate.',
 zh:'持續循環的流程：感知（Perceive）當下情境 → 處理（Process，評估其對飛安的影響） → 執行（Perform，採取最佳行動方案） → 重新評估。'},
{t:'p', en:'3 timeframes for risk management processing: Strategic (complex ops, formal analysis) · Deliberate (experience/brainstorming, planning) · Time-Critical (on-the-fly mental/verbal review — most flight training activities use this).',
 zh:'風險管理處理的三種時間架構：策略型（複雜作業、正式分析）・審慎型（依經驗與腦力激盪進行規劃）・時效急迫型（飛行中即時的心理或口頭複核——大多數飛行訓練活動採用此種）。'},
{t:'p', en:'Step 1 — Perceive hazards: PAVE checklist (Pilot / Aircraft / enVironment / External pressures) — ask "what could hurt me, my passengers, or my aircraft?" for each. Pay special attention to the pilot-aircraft team combination (e.g., experienced pilot + no-weather-gear old aircraft = still limited; new TAA aircraft + inexperienced pilot with the gear = can\'t rely on the plane to compensate for lack of experience).',
 zh:'第一步——感知危害：運用PAVE檢查表（飛行員／航空器／環境／外部壓力），針對每一項自問「什麼可能傷害到我、我的乘客或我的飛機？」須特別注意「飛行員—飛機」的組合關係（例如：經驗豐富的飛行員搭配沒有天氣迴避裝備的老舊飛機，天氣飛行能力仍然受限；反之，全新的先進航電飛機搭配缺乏經驗的飛行員，也不能指望飛機的性能來彌補飛行員經驗的不足）。'},
{t:'p', en:'Step 2 — Process: CARE checklist — Consequences, Alternatives, Reality, External pressures. Rule of thumb: if you catch yourself saying it\'ll "probably" be okay, that\'s exactly when you need a reality check.',
 zh:'第二步——處理：運用CARE檢查表——後果（Consequences）、替代方案（Alternatives）、現實（Reality）、外部壓力（External pressures）。經驗法則：如果你發現自己說「應該」沒問題，那正是你最需要做現實檢核的時候。'},
{t:'p', en:'Step 3 — Perform: TEAM checklist — Transfer (hand the risk decision to someone else, e.g., chief flight instructor), Eliminate (remove the hazard entirely), Accept (do benefits outweigh cost), Mitigate (what can reduce the risk).',
 zh:'第三步——執行：運用TEAM檢查表——轉移（Transfer，是否可將此風險決策交由他人，例如首席飛行教官）、消除（Eliminate，是否有辦法完全排除該危害）、接受（Accept，效益是否大於代價）、降低（Mitigate，有什麼方法可以降低該風險）。'},
{t:'p', en:'(Worked example in the source: "Gayle," a 300-hr private pilot flying a hazy mountain cross-country in a C182 without weather-avoidance gear, to visit family — walks through PAVE/CARE/TEAM for Pilot/Aircraft/Environment/External-pressures. Result: hires a CFI for the trip, mitigates via careful preflight planning, VFR flight following, Flight Watch updates, and a pre-agreed "either pilot can veto continuing" rule with her co-pilot.)',
 zh:'（原文案例：「Gayle」是一位擁有300小時經驗的私人飛行員，計畫駕駛沒有天氣迴避裝備的C182，在濛霧天氣下飛越山區探望親戚——依序以PAVE／CARE／TEAM檢視飛行員／飛機／環境／外部壓力四個層面。結果：她決定聘請一位CFI隨行，並透過周詳的飛行前規劃、VFR飛航追蹤服務、Flight Watch即時天氣更新，以及與同行飛行員事先約定「任一方均可否決繼續飛行」的規則來降低風險。）'},
{t:'p', en:'Building "mental muscle" for follow-through on safe decisions: personal minimums checklist (developed before any specific trip, no pressure); preflight risk assessment checklist (numeric scoring); pre-identify alternative airports every 25–30 NM of route; preflight passengers on possibility of delay/diversion; post-flight analysis (often overlooked) — review/analyze objectively after securing the aircraft.',
 zh:'鍛鍊「貫徹安全決策的心理素質」：預先制定個人最低標準檢查表（在沒有特定行程壓力的情況下事先擬定）；使用飛行前風險評估檢查表（以數字評分）；每隔25–30浬預先找好備降機場；出發前向乘客說明延誤或轉降的可能性；以及常被忽略的「飛行後分析」——安全落地後客觀地檢討整趟飛行。'},

{t:'h3', en:'The DECIDE Model', zh:'DECIDE 模型'},
{t:'p', en:'Detect → Estimate (need to react) → Choose (desired outcome) → Identify (solutions) → Do (necessary actions) → Evaluate (effect of the action)',
 zh:'偵測（Detect）→ 評估反應必要性（Estimate）→ 選擇期望結果（Choose）→ 找出解決方案（Identify）→ 執行必要行動（Do）→ 評估行動效果（Evaluate）'},
{t:'p', en:'(Worked example: twin-engine (Piper Apache) simulated right-engine failure during a checkride. Pilot skipped the "detect which engine failed" step and feathered the wrong (left) engine — the classic "dead foot, dead engine" identification error. Highlights: acting without forethought is as dangerous as not acting; decisions made under pressure with limited experience can be wrong even with time available.)',
 zh:'（原文案例：一次雙發飛機（Piper Apache）考核飛行中模擬右發動機失效。飛行員跳過了「先辨識是哪具發動機失效」的步驟，錯誤地順槳（feather）了左發動機——這正是典型的「無舵壓側＝失效發動機」辨識錯誤。此案例凸顯：未經思考就採取行動，與完全不採取行動一樣危險；即使有充裕時間，經驗有限者在壓力下做出的決策仍可能是錯的。）'},
{t:'p', en:'Detect — recognizing a change occurred (or expected change didn\'t). Estimate — same problem can warrant very different urgency depending on context (e.g., open cabin door on a clear VFR climb = low risk / same door open during IMC climb-out with an amended ATC clearance = high risk — the problem hasn\'t changed, the task-loading context has).',
 zh:'偵測——察覺發生了變化（或預期中的變化並未發生）。評估——同一個問題，會因情境不同而需要截然不同的緊急處置程度（例如：晴朗VFR爬升時艙門突然打開＝低風險／同樣的艙門在IMC爬升、且正在接收航管修正許可時打開＝高風險——問題本身沒有改變，改變的是當下的任務負荷情境）。'},
{t:'p', en:'Choose → Identify → Do → Evaluate — determine desired outcome, find solution(s), act, then evaluate whether the result was correct (repeat if not).',
 zh:'選擇 → 找出方案 → 執行 → 評估——確定期望的結果、找出解決方案、採取行動，然後評估結果是否正確（若不正確則重複此流程）。'},

{t:'h2', en:'Decision-Making in a Dynamic Environment', zh:'動態環境中的決策'},
{t:'p', en:'Analytical decision-making (5P/3P/DECIDE) — used when time allows. Automatic / naturalistic decision-making — experts facing time pressure and a familiar-feeling situation skip pros/cons comparison and take the first workable option; improves with training/experience; used by firefighters, chess players, and experienced pilots alike in emergencies.',
 zh:'分析型決策（5P／3P／DECIDE）——適用於時間充裕的情況。自動型／自然型決策——當專家面對時間壓力、且情境感覺熟悉時，會跳過利弊比較，直接採用第一個可行的方案；這種能力會隨訓練與經驗而提升；消防員、西洋棋手與經驗豐富的飛行員在緊急狀況下都會運用這種決策方式。'},

{t:'h3', en:'Operational Pitfalls', zh:'常見操作陷阱'},
{t:'table', head:['Pitfall','Description'], headZh:['陷阱','說明'], rows:[
  {en:'Peer pressure', zh:'同儕壓力', en2:'Emotional response to peers over objective evaluation', zh2:'受同儕情緒影響而非客觀評估情況'},
  {en:'Mindset', zh:'固定心態', en2:'Inability to recognize/cope with changing circumstances', zh2:'無法察覺或應對情境的變化'},
  {en:'Get-there-itis', zh:'非到不可症', en2:'Fixation on original goal/destination, ignoring alternatives', zh2:'固執於原訂目標／目的地，忽視其他替代方案'},
  {en:'Duck-under syndrome', zh:'低鑽症候群', en2:'Descending below minimums on approach, assuming a built-in margin', zh2:'進場時擅自降到最低標準以下，誤以為程序內建有安全餘裕'},
  {en:'Scud running', zh:'貼雲飛行', en2:'Maintaining visual terrain contact at low altitude in instrument conditions', zh2:'在儀器天氣條件下，試圖以低空飛行維持地形目視接觸'},
  {en:'Continuing VFR into IMC', zh:'VFR誤入IMC', en2:'Risk of spatial disorientation/CFIT, worse if not instrument current', zh2:'有空間迷向／可控飛行撞地的風險，若儀器資格未保持現行則更危險'},
  {en:'Getting behind the aircraft', zh:'落後於飛機', en2:'Letting events control pilot actions instead of the reverse', zh2:'讓局勢主導飛行員的行動，而非飛行員主導局勢'},
  {en:'Loss of positional/situational awareness', zh:'喪失方位／情境警覺', en2:'Extreme case of the above — losing track of geographic location or deteriorating conditions', zh2:'上一項的極端情況——喪失對地理位置或惡化狀況的掌握'},
  {en:'Operating without adequate fuel reserves', zh:'油量儲備不足', en2:'Overconfidence/poor planning/regulation disregard', zh2:'源自過度自信、規劃不周或無視法規要求'},
  {en:'Descent below minimum en route altitude', zh:'低於最低航路高度下降', en2:'"Duck-under" applied to the en route IFR segment', zh2:'即「低鑽症候群」發生在IFR航路階段的版本'},
  {en:'Flying outside the envelope', zh:'超出飛行包線', en2:'Overestimating own skill relative to aircraft capability', zh2:'高估自身技術相對於飛機性能的能耐'},
  {en:'Neglect of flight planning/preflight/checklists', zh:'忽略飛行規劃／飛行前檢查／檢查表', en2:'Relying on memory and familiar routes instead of procedures — especially common in experienced pilots', zh2:'依賴記憶與熟悉航線而非既定程序——在資深飛行員中特別常見'}
]},

{t:'h2', en:'Stress Management', zh:'壓力管理'},
{t:'p', en:'Some stress is beneficial (alertness); performance rises then falls sharply once stress exceeds coping capacity. 2 categories: acute and chronic (detailed in Ch.17 Aeromedical Factors).',
 zh:'適度壓力有其正面作用（維持警覺性）；表現會隨壓力上升，但一旦壓力超出負荷能力，便會急遽下滑。壓力分為兩類：急性與慢性（詳見第17章航空醫學因素）。'},
{t:'p', en:'Stressor types — Environmental: temperature/humidity extremes, noise, vibration, lack of oxygen. Physiological: fatigue, poor fitness, sleep loss, missed meals (low blood sugar), illness. Psychological: social/emotional (death in family, divorce, sick child, demotion) — also includes mental workload itself (analyzing a problem, navigating, deciding).',
 zh:'壓力源類型——環境性：極端溫度／濕度、噪音、震動、缺氧。生理性：疲勞、體能不佳、睡眠不足、未進食（導致低血糖）、生病。心理性：社會或情感因素（家人過世、離婚、孩子生病、職場降職）——也包含心智工作負荷本身（例如分析問題、導航、做決策）。'},
{t:'p', en:'Management: stop, think, analyze before concluding; daily relaxation time; physical fitness program; better time management to avoid schedule pressure.',
 zh:'管理方式：在下結論前先停下來思考與分析；每天安排放鬆時間；維持體能訓練計畫；改善時間管理以避免行程壓力。'},

{t:'h2', en:'Use of Resources', zh:'資源運用'},
{t:'h3', en:'Internal Resources', zh:'機內資源'},
{t:'li', en:'Passengers — even non-pilots can watch for traffic, confirm gear-down, watch altimeter in descent, "listen to logic or lack of logic"', zh:'乘客——即使不是飛行員，也能協助注意交通、確認起落架放下、下降時留意高度表，並「聽出是否合理」'},
{t:'li', en:'Verbal briefing to a passenger can itself prompt the pilot to re-examine a changed forecast', zh:'向乘客口頭簡報這個動作本身，就能促使飛行員重新檢視已改變的天氣預報'},
{t:'li', en:'Solo verbal checklist reading + touching the control reinforces confirmation of critical items (e.g., touch the gear handle while confirming gear down)', zh:'單飛時大聲朗讀檢查表並實際觸碰控制項，能加強對關鍵項目的確認（例如確認起落架放下時同時觸摸把手）'},
{t:'li', en:'Deep equipment/systems knowledge (e.g., is the oil pressure gauge direct-reading or sensor-based) is the difference between a wise decision and a tragic error', zh:'對機上系統的深入了解（例如油壓表是直接讀值還是感測器讀值），往往是明智決策與悲劇性失誤之間的分界'},
{t:'li', en:'Checklists — essential; POH must be carried onboard', zh:'檢查表——不可或缺；飛行員操作手冊（POH）須隨機攜帶'},
{t:'li', en:'Most valuable resource overall: the ability to manage workload', zh:'整體而言最寶貴的資源：管理工作負荷的能力'},
{t:'h3', en:'External Resources', zh:'機外資源'},
{t:'p', en:'ATC — traffic advisories, radar vectors, emergency assistance; can decrease workload and become "part of the crew."',
 zh:'航管（ATC）——提供交通諮詢、雷達導引、緊急情況協助；能降低飛行員工作負荷，並如同「機組的一份子」。'},
{t:'p', en:'Flight Service Stations (FSS) — pilot briefing, en route comms, VFR search & rescue, lost-aircraft assistance, relay ATC clearances, issue NOTAMs, broadcast weather/NAS info, process IFR flight plans, monitor NAVAIDs; select locations also provide Flight Watch (En Route Flight Advisory Service), airport advisories, Customs/Immigration advisories for transborder flights; select Alaska FSSs also do TWEB and weather observations.',
 zh:'飛航服務站（FSS）——提供飛行員簡報、航路通訊、VFR搜救、迷航機協助、轉發航管許可、發布NOTAM、廣播天氣與國家空域系統資訊、處理IFR飛航計畫、監控助航設施；部分據點另提供Flight Watch（航路飛航諮詢服務）、機場諮詢、以及跨境飛行的海關／移民資訊；阿拉斯加部分FSS另提供TWEB播報與氣象觀測服務。'},

{t:'h2', en:'Situational Awareness', zh:'情境警覺'},
{t:'p', en:'Accurate perception/understanding of all factors within the 5 fundamental risk elements: flight, pilot, aircraft, environment, type of operation.',
 zh:'指對「五大基本風險要素」——飛行本身、飛行員、航空器、環境、作業型態——中所有因素的正確感知與理解。'},
{t:'h3', en:'Obstacles', zh:'維持情境警覺的障礙'},
{t:'p', en:'Fatigue, stress, work overload → fixation on one perceived item → reduced overall awareness. Common accident contributor: minor distraction (e.g., a misreading gauge) diverting attention from proper aircraft control.',
 zh:'疲勞、壓力、工作超載→導致固著於某一項認為重要的事物→整體情境警覺下降。常見的事故成因：一項微小的分心事件（例如一個讀數異常的儀表）分散了飛行員對正確操控飛機的注意力。'},
{t:'h3', en:'Workload Management', zh:'工作負荷管理'},
{t:'p', en:'Plan/prioritize/sequence tasks to avoid overload; review charts and set radio frequencies well in advance of need. Listen to ATIS/ASOS/AWOS then monitor tower/CTAF before entering high-density airspace (e.g., Class B).',
 zh:'透過規劃、排定優先順序與任務排序來避免超載；應提前檢視航圖並設定無線電頻率。進入高密度空域（例如B類空域）前，應先聽取ATIS／ASOS／AWOS，再監聽塔台或CTAF頻率。'},
{t:'p', en:'First sign of overload: working harder but accomplishing less; task saturation → decisions made on incomplete information. When overloaded: stop, think, slow down, prioritize; contextualize the situation (e.g., open cabin door in VFR ≈ insignificant workload impact; same event in IMC ≈ significant).',
 zh:'超載的第一個徵兆：越努力卻完成得越少；任務飽和會導致基於不完整資訊做決策。當發生超載時：停下來、思考、放慢步調、排定優先順序；並將情境放入正確的脈絡中判斷（例如VFR時艙門打開對工作負荷影響不大；同樣的事件發生在IMC時則影響顯著）。'},
{t:'p', en:'SAFETY passenger briefing mnemonic — S: Seat belts/shoulder harness/seat position. A: Air vents, environmental controls, passenger-discomfort actions. F: Fire extinguisher location/operation. E: Exit doors (secure/open), evacuation plan, survival kit. T: Traffic (scanning/spotting/notifying), "sterile flight deck" expectations. Y: Your questions? (Speak up!)',
 zh:'SAFETY乘客簡報口訣——S：安全帶／肩帶／座椅位置。A：通風口、環境控制裝置、乘客不適時的處置方式。F：滅火器位置與使用方式。E：艙門（如何固定／打開）、緊急撤離計畫、求生裝備。T：交通狀況（掃視、發現、通報飛行員）、「安靜駕駛艙」規範說明。Y：你有任何問題嗎？（有問題請直說！）'},
{t:'p', en:'Also brief: smoking policy, route altitudes, time en route, destination/enroute weather, control functions, aircraft capabilities/limitations. Use a sterile flight deck during departure (to first intermediate altitude/clearance) and arrival (from first approach vector). Consider using the right-seat passenger for simple tasks (e.g., holding the chart).',
 zh:'也應說明：是否可吸菸、航路高度、預計飛行時間、目的地／航路天氣、機上各操縱裝置的功能、飛機的性能與限制。起飛階段（至第一個中間高度／取得許可為止）與進場階段（從第一次進場導引開始）建議採用「安靜駕駛艙」規範。可考慮讓右座乘客協助簡單任務（例如拿著航圖）。'},

{t:'h2', en:'Automation', zh:'自動化'},
{t:'p', en:'TAA (Technically Advanced Aircraft) = integrated PFD + MFD (with certified GPS, traffic/terrain graphics) + fully integrated autopilot.',
 zh:'TAA（技術先進航空器）＝整合式主飛行顯示器（PFD）＋多功能顯示器（MFD，含經認證GPS、交通與地形圖像）＋全整合式自動駕駛系統。'},
{t:'li', en:'Automation = single most important advance in aviation tech; reduces flight-deck clutter via electronic databases', zh:'自動化＝航空科技中最重要的一項進展；透過電子資料庫大幅減少駕駛艙內的雜亂'},
{t:'li', en:'Risk: MFD moving maps are so good many pilots over-rely on them for navigation alone; never a substitute for a VFR sectional or low-altitude en route chart', zh:'風險：MFD移動地圖功能過於便利，許多飛行員因此過度依賴它作為唯一導航依據；它絕不能取代VFR地區圖或低空航路圖'},
{t:'li', en:'1995 British Airline Pilots Association concern: reliance on automation → erosion of "basic flying skills," worse ability to cope with sudden mechanical failure', zh:'1995年英國航空飛行員協會提出的疑慮：對自動化的依賴會導致「基本飛行技能」退化，降低應對突發機械故障的能力'},
{t:'p', en:'Study finding (analog vs. EFIS/FMS crews): EFIS crews showed greater deviations in normal maneuvers without flight director; bigger gap during abnormal maneuvers ("slam-dunk" descents — analog crews did mental math better; EFIS crews went "heads down" trying to reprogram the FMS); gap widest in emergencies (analog crews handled raw-data flying better).',
 zh:'研究發現（類比儀表機組 vs. EFIS／FMS機組）：在無飛行導引儀的正常操作中，EFIS機組偏差較大；在異常操作（如「急速下降」進場）中差距更明顯——類比機組較擅長心算，EFIS機組則傾向「低頭」試圖重新編寫FMS程式；在緊急狀況下差距最為顯著（類比機組更擅長依原始資料手動操控飛機）。'},
{t:'p', en:'Takeaway: pilots must periodically hand-fly to maintain stick-and-rudder proficiency; moving map is a supplement, never primary navigation.',
 zh:'結論：飛行員必須定期手動操控飛機，以維持基本操縱技能；移動地圖只能作為輔助工具，絕不能作為主要導航依據。'},
{t:'h3', en:'Managing Aircraft Automation — 3 key skills', zh:'管理航空器自動化的三項關鍵技能'},
{t:'p', en:'1) Information management — understand the system conceptually (not just knob sequences); "stop, look, and read" before pushing/pulling/twisting; configure displays to personal preference (e.g., map orientation north-up/track-up/heading-up); tailor info display per phase of flight (e.g., terrain awareness page for night/IMC mountain flying, nearest-airport inset over inhospitable terrain).',
 zh:'1）資訊管理——從概念層面理解系統（而非只記旋鈕操作順序）；在按、拉、轉動任何裝置前「先停、先看、先讀」；依個人偏好設定顯示畫面（例如地圖方向設為北方朝上／航跡朝上／航向朝上）；依飛行階段調整顯示內容（例如夜間或IMC山區飛行使用地形警示頁面、飛越荒涼地形時顯示最近機場資訊）。'},
{t:'p', en:'2) Automation management — know at all times which autopilot modes are engaged vs. armed; verify armed functions actually engage when expected; understand mode interactions (e.g., changing nav source from GPS to LOC/VOR while autopilot is in NAV mode can disengage NAV mode, defaulting to wings-level ROL).',
 zh:'2）自動化管理——隨時掌握自動駕駛目前處於「已接合」還是「已預備接合」的模式；確認已預備接合的功能確實在預期時機啟動；理解各模式之間的互動關係（例如在自動駕駛處於NAV模式時，將導航來源從GPS切換為LOC或VOR，可能導致NAV模式解除接合，並自動切回翼平模式ROL）。'},
{t:'p', en:'3) Risk management — humans are poor passive monitors of reliable automated systems (the more reliable, the worse human vigilance gets); EFDs don\'t replace basic flight knowledge — risk rises when a pilot believes gadgets compensate for lack of skill.',
 zh:'3）風險管理——人類對於高度可靠的自動化系統，其被動監控能力其實很差（系統越可靠，人類的警覺性反而越低）；電子飛行顯示器（EFD）並不能取代基本飛行知識——當飛行員誤以為設備能彌補自身技術不足時，風險便會升高。'},
{t:'p', en:'Situational-awareness safeguards for automated flight: double-check the system, use verbal callouts, verify programming before departure, cross-check the planned route against a paper log, verify waypoints, cross back up GPS with VOR (and vice versa), plan realistic routes (don\'t assume direct-to is actually flyable, e.g., restricted airspace), stay ready to catch keystroke errors.',
 zh:'維持自動化飛行情境警覺的保護措施：養成雙重確認系統設定的習慣、使用口頭覆誦、起飛前確認所有程式設定、將計畫航路與紙本航行記錄互相比對、確認每個航點、用VOR與GPS互相交叉確認（反之亦然）、規劃切合實際的航路（勿假設直飛航段一定可行，例如可能穿越限制空域）、隨時做好抓出按鍵輸入錯誤的準備。'},
{t:'p', en:'1999 Colombia CFIT accident (cited case): crew entered a waypoint one degree off in the FMS → 60 NM off course → flew into terrain despite having correct paper charts/nav log on board — crew let automation fly and monitor itself instead of cross-checking; a fully preventable accident from complacency, not equipment failure.',
 zh:'1999年哥倫比亞可控飛行撞地事故（原文引用案例）：機組在FMS中輸入航點時偏差了一度→導致航線偏離預定路線達60浬→儘管機上備有正確的紙本航圖與航行記錄，仍撞山身亡——機組讓自動化系統自行飛行並自我監控，而未進行交叉確認；這是一起完全可以避免的事故，肇因於自滿心態，而非設備故障。'},

{t:'h2', en:'AC 60-22', zh:'AC 60-22'},
{t:'p', en:'In <a href="https://www.faa.gov/regulations_policies/advisory_circulars/index.cfm/go/document.information/documentid/22624" target="_blank">AC 60-22</a> (and the ADM training framework the FAA has built out from it), Scenario-Based Training (SBT) and how instructors weave ADM into training are the core mechanisms for turning theory into actual muscle memory and habits of thought. Below is a detailed breakdown of both.',
 zh:'在 AC 60-22（以及 FAA 延伸推廣的 ADM 訓練體系）中，「情境導向訓練（SBT）」與「教官如何將 ADM 融入訓練」是將理論轉化為實際肌肉記憶與思維習慣的核心手段。以下為針對這兩個部分的詳細剖析與操作說明。'},

{t:'h3', en:'1. Scenario-Based Training (SBT)', zh:'一、情境導向訓練（Scenario-Based Training, SBT）'},
{t:'p', en:'Traditional flight training mostly focuses on "stick-and-rudder" maneuvers (slow flight, steep turns, ground reference maneuvers), but being skilled at maneuvers doesn\'t mean making the right decisions. The core idea of SBT: stop practicing only "how to fly," and instead practice "how to decide under complex conditions."',
 zh:'傳統的飛行訓練多半專注於「操縱技巧」（如：慢速飛行、陡盤旋、標竿轉彎），但技巧好並不等於決策對。SBT 的核心是：不再只練「怎麼飛」，而是練習「在複雜狀況下怎麼做決定」。'},

{t:'h3', en:'2. How Flight Instructors (FIs) Weave ADM into Day-to-Day Training', zh:'二、飛行教官（FI）如何將 ADM 融入日常訓練計畫'},
{t:'p', en:'AC 60-22 specifically emphasizes: ADM cannot be taught as a standalone lesson — it must be woven into every detail of training, from the first day of ground school to the final checkride. Specific instructor techniques and strategies include:',
 zh:'AC 60-22 特別強調：ADM 不能當成獨立的一堂課來教，而必須從「第一天地面學科」到「最後一次檢定（Checkride）」穿插在所有訓練細節中。教官具體的引導手法與策略包括：'},

{t:'h3', en:'Ground School Integration', zh:'1. 地面學科（Ground School）的融入方式'},
{t:'li', en:'Formalizing "Personal Minimums": Regulations require 3 miles visibility for VFR, but instructors should guide students to establish their own minimums (e.g., before reaching 100 total flight hours, don\'t fly below 5 miles visibility or with gusts over 10 knots).',
 zh:'將「個人最低限度（Personal Minimums）」公式化：法規規定 VFR 能見度要 3 哩，但教官應引導學員建立自己的 Minimums（例：總飛行時數未滿 100 小時前，低於 5 哩能見度、陣風超過 10 節就不飛）。'},
{t:'li', en:'Accident case studies: Study one NTSB accident report per week with students. The focus isn\'t "how the plane crashed" but "what three poor decisions did the pilot make in the 30 minutes before the accident (the poor judgment chain)? If it had been interrupted at decision point 1, what would have happened?"',
 zh:'事故案例分析（Case Studies）：每週帶學員研讀一篇 NTSB 事故報告。重點不放在「飛機怎麼撞的」，而是「飛行員在事故前 30 分鐘做了哪三個壞決策（Poor Judgment Chain）？如果在第 1 個決策點打斷，結果會如何？」'},
{t:'li', en:'Pre-departure Risk Assessment Matrix: Require students to quantitatively score risk before every flight (e.g., night +2 points, unfamiliar airport +3 points, fatigue +3 points; a total over 10 points requires a backup plan or cancellation).',
 zh:'出發前的「風險評估表（Risk Assessment Matrix）」：要求學員在每次飛行前量化評估（例如：夜間+2分、新機場+3分、疲勞+3分；總分超過 10 分必須有備案或取消飛行）。'},

{t:'h3', en:'In-Flight Training Techniques', zh:'2. 術科／空中飛行訓練（Flight Training）的引導技巧'},
{t:'li', en:'The "Think-Aloud" technique: the instructor requires the student to verbalize their reasoning process out loud for every decision made in the air — e.g., "There\'s a cumulonimbus ahead; I\'m turning 15° left because there are mountains to the right and visibility is better to the left." This lets the instructor correct gaps in the student\'s thinking in real time.',
 zh:'「發聲思考法」（Think-Aloud Technique）：教官要求學員在空中做任何決定時，都要把心理的推理過程講出來。例如：「現在前方有積雨雲，我決定向左偏航 15 度，因為右側有高山，且左側能見度較好。」這能讓教官即時修正學員的思維漏洞。'},
{t:'li', en:'Instructor-initiated open-ended scenarios (in-flight scenario injection): Traditional teaching — instructor says "simulated engine failure, target the field to your right, run the checklist" (student passively executes). ADM-integrated teaching — mid-cruise, the instructor suddenly says: "Your destination airport just went below minimums in fog and your rear passenger says they feel extremely unwell. Tell me the three things you\'ll do in the next 5 minutes."',
 zh:'教官主動製造「開放式情境」（In-flight Scenario Injection）：傳統教學：教官說：「做了模擬引擎失效，目標右前方農田，做 CheckList。」（學員被動執行）ADM 融入教學：教官在巡航時突然說：「目的地機場現在突然降大霧關閉，且後座乘客表示身體極度不適。請告訴我你接下來 5 分鐘要做的三件事是什麼？」'},
{t:'li', en:'Letting students make mistakes and live with the consequences within a safe margin: If a student makes a suboptimal-but-safe choice on wind assessment (e.g., picking a runway with a smaller tailwind component instead of the better option), the instructor shouldn\'t correct it immediately (as long as it\'s safe) — let the student experience firsthand why that decision drove up workload on landing, then debrief it after the flight.',
 zh:'允許學員在安全範圍內「犯錯並承擔決策後果」：如果學員在風向評估上做出了不理想但安全的選擇（例如選了順風較小的跑道進場），教官在安全前提下不要立刻纠正，讓學員親身體會「為什麼這個決策會讓落地的工作量（Workload）大幅增加」，落地後再進行反思。'},

{t:'h3', en:'ADM Review in Post-Flight Debriefing', zh:'3. 歸航後簡報（Post-Flight Debriefing）的 ADM 檢討'},
{t:'p', en:'The debrief shouldn\'t just cover "was the base-to-final turn smooth" or "was altitude held well" — it should also raise ADM-specific questions:',
 zh:'簡報時不只檢討「五邊進場飛得平不平」、「高度保持得好不好」，而是提出 ADM 相關問題：'},
{t:'li', en:'"Which moment in today\'s flight felt like the highest mental workload/stress to you?"', zh:'「今天飛行中，哪一個時刻讓你覺得心理壓力最大（Workload 最高）？」'},
{t:'li', en:'"If the weather had been 20% worse today, what would you have decided differently?"', zh:'「如果今天天氣再變差 20%，你會做什麼不同的決定？」'},
{t:'li', en:'"Was there anything we did today that came from \'impulse\' or \'being in a hurry\'?"', zh:'「我們今天有沒有哪一個動作是出於『衝動』或『趕時間』的？」'},

{t:'p', en:'Summary: Through SBT, AC 60-22 turns ADM from dry regulatory text into simulated real-world practice; the instructor\'s role shifts from a "technician who just teaches stick-and-rudder feel" into a "mentor who guides a thinking framework and safety culture." The goal of this training is that by the time a pilot is flying solo (or as PIC), their brain automatically runs the PAVE and DECIDE processes — resolving the crisis before it ever happens.',
 zh:'💡 總結：AC 60-22 透過 SBT 將 ADM 從枯燥的條文變成模擬實戰；而教官的角色則是從「單純教操縱手感的技術員」，轉變為「引導思維架構與安全文化的導師（Mentor）」。這種訓練目標是讓飛行員在獨自執飛（Solo / PIC）時，大腦能自動運作 PAVE 與 DECIDE 流程，在危機發生前就將其化解。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Chapter goal: help pilots improve ADM skills to mitigate risk in both classic and automated aircraft. Core point: this isn\'t really about aircraft — it\'s about the people who fly them.',
 zh:'本章目標：協助飛行員精進ADM技巧，以降低無論是傳統型或自動化航空器上的風險因子。核心重點：這一切終究不是關於飛機，而是關於駕駛飛機的人。'}
  ]
},
