  blocks:[
{t:'h2', en:'Aircraft Design, Certification, and Airworthiness', zh:'飛機設計、認證與適航性'},
{t:'li', en:'FAA certifies three types of aviation products: aircraft, aircraft engines, propellers — each designed to airworthiness standards under 14 CFR', zh:'FAA對三類航空產品進行認證：飛機、飛機引擎、螺旋槳——各自依14 CFR的適航標準設計'},
{t:'li', en:'Standards by category: Normal/Utility/Acrobatic/Commuter Airplanes — Part 23 · Transport Category Airplanes — Part 25 · Normal Category (rotorcraft) — Part 27 · Transport Category Rotorcraft — Part 29 · Manned Free Balloons — Part 31 · Aircraft Engines — Part 33 · Propellers — Part 35',
 zh:'依類別適用的標準：正常／效用／特技／通勤類飛機——Part 23・運輸類飛機——Part 25・正常類（旋翼機）——Part 27・運輸類旋翼機——Part 29・載人自由氣球——Part 31・飛機引擎——Part 33・螺旋槳——Part 35'},
{t:'li', en:'"Special classes" (e.g., gliders, powered-lift) use a combination of Parts 23/25/27/29 as agreed between FAA and designer', zh:'「特殊類別」（例如滑翔機、動力升力機）採用Part 23／25／27／29的組合，由FAA與設計者共同議定'},
{t:'li', en:'Type Certificate (TC) issued once FAA is satisfied of compliance → generates a Type Certificate Data Sheet (TCDS) (publicly available on faa.gov) specifying key design/operational characteristics', zh:'FAA確認符合規定後核發型別證書（TC）→產生型別證書資料表（TCDS，可於faa.gov公開查詢），載明關鍵設計／操作特性'},
{t:'li', en:'Light Sport Aircraft (LSA) are not built to FAA airworthiness standards — built to industry consensus standards FAA has agreed are acceptable; TC covers the whole aircraft (airframe+engine+prop) rather than certifying components individually', zh:'輕型運動航空器（LSA）並非依FAA適航標準打造——而是依業界共識標準（FAA已認可其可接受性）；TC涵蓋整架飛機（機身＋引擎＋螺旋槳），而非個別元件分開認證'},
{t:'li', en:'Manufacturing: each part inspected against approved design = conformity inspection', zh:'製造過程：每個零件都會依核准設計進行比對檢查，稱為「符合性檢查」'},
{t:'p', en:'Airworthiness certificate issued once complete aircraft passes inspection; must be carried onboard; stays valid as long as maintenance/inspections are current. Standard (white) — normal/utility/acrobatic/commuter/transport category, manned free balloons, "Special Class" aircraft. Special (pink) — primary/restricted/limited category, LSA, provisional certificates, special flight permits (ferry permits), experimental aircraft.',
 zh:'飛機完成並通過檢查後核發適航證；須隨機攜帶；只要維修與檢查持續保持有效，證書即持續有效。標準適航證（白色）——正常／效用／特技／通勤／運輸類、載人自由氣球、「特殊類別」飛機。特殊適航證（粉紅色）——初級／限用／限制類、LSA、臨時證書、特殊飛航許可（換場許可）、實驗類飛機。'},
{t:'p', en:'More detail: Chapter 9, 14 CFR Parts 175–225', zh:'詳見第9章、14 CFR Part 175–225'},

{t:'h2', en:'Lift and Basic Aerodynamics (brief intro — full detail in Ch.5)', zh:'升力與基本空氣動力學（簡介，詳見第5章）'},
{t:'p', en:'4 forces in straight-and-level unaccelerated flight: Thrust — forward force from powerplant/propeller; opposes drag. Drag — rearward retarding force from airflow disruption; opposes thrust. Lift — opposes weight; acts perpendicular to flight path through the wing\'s center of lift (CL). Weight — combined load of aircraft+crew+fuel+cargo; acts downward through the center of gravity (CG).',
 zh:'水平等速直線飛行中的四種作用力：推力——由動力系統／螺旋槳產生的前向力；對抗阻力。阻力——由氣流受擾動產生的後向阻滯力；對抗推力。升力——對抗重量；沿飛行路徑垂直方向作用，通過機翼的升力中心（CL）。重量——飛機本體＋機組＋燃油＋貨物的總負荷；沿重心（CG）垂直向下作用。'},
{t:'img', src:'figs/ch3/fig3-1.png', en:'Figure 3-1. The four forces.', zh:'圖3-1。四種作用力。'},
{t:'p', en:'Center of Gravity (CG): the point around which the aircraft would balance if suspended; determines aircraft stability. CG moving aft → increasingly dynamically unstable. For aircraft with fuel tanks forward of CG: CG should be set with tank empty — otherwise aircraft becomes unstable as fuel burns off. CG too far aft → insufficient elevator nose-down authority for stall recovery. CG too far forward → insufficient elevator nose-up authority to flare for landing.',
 zh:'重心（CG）：若將飛機懸掛起來能維持平衡的那個點；決定了飛機的穩定性。重心後移→動態穩定性逐漸變差。若燃油箱位於重心之前：設定重心時應以油箱「空」的狀態為準——否則隨著燃油消耗，飛機會變得不穩定。重心過於偏後→升降舵的低頭操縱權不足，無法有效改出失速。重心過於偏前→升降舵的抬頭操縱權不足，無法在落地時順利拉平。'},
{t:'p', en:'Axes (all pass through the CG): Longitudinal (roll) axis — nose to tail. Lateral (pitch) axis — wingtip to wingtip. Vertical (yaw) axis — vertical through the aircraft.',
 zh:'三軸（均通過重心）：縱軸（滾轉軸）——從機首到機尾。橫軸（俯仰軸）——從翼尖到翼尖。垂直軸（偏航軸）——垂直貫穿機身。'},
{t:'img', src:'figs/ch3/fig3-2.png', en:'Figure 3-2. Illustrates the pitch, roll, and yaw motion of the aircraft along the lateral, longitudinal, and vertical axes, respectively.', zh:'圖3-2。分別依橫軸、縱軸、垂直軸展示飛機的俯仰、滾轉、偏航運動。'},
{t:'img', src:'figs/ch3/fig3-3.png', en:'Figure 3-3. Center of gravity (CG).', zh:'圖3-3。重心（CG）。'},

{t:'h2', en:'Major Components', zh:'主要組件'},
{t:'p', en:'Most airplanes share: fuselage, wings, empennage, landing gear, powerplant.', zh:'大多數飛機共有的組件：機身、機翼、尾翼組、起落架、動力系統。'},
{t:'img', src:'figs/ch3/fig3-4.png', en:'Figure 3-4. Airplane components.', zh:'圖3-4。飛機組件。'},
{t:'h3', en:'Fuselage', zh:'機身'},
{t:'p', en:'Central body — houses crew/passengers/cargo, structural connection for wings/tail. Older designs: open truss (wood/steel/aluminum tubing). Most common today: monocoque ("single shell", French) and semimonocoque.',
 zh:'飛機的中央本體——容納機組員／乘客／貨物，並提供機翼與尾翼的結構連接。較舊的設計：開放式桁架結構（木材／鋼／鋁管）。目前最常見的是：硬殼式（monocoque，法文意為「單一外殼」）與半硬殼式（semimonocoque）。'},
{t:'img', src:'figs/ch3/fig3-5.png', en:'Figure 3-5. Truss-type fuselage structure.', zh:'圖3-5。桁架式機身結構。'},
{t:'h3', en:'Wings', zh:'機翼'},
{t:'p', en:'Airfoils attached to the fuselage; main lifting surfaces. Mounting position: high-wing / mid-wing / low-wing. Count: monoplane (1 set) vs. biplane (2 sets).',
 zh:'附著於機身上的翼型構造；是主要的升力面。安裝位置分為：高單翼／中單翼／低單翼。依數量分為：單翼機（一組機翼）與雙翼機（兩組機翼）。'},
{t:'img', src:'figs/ch3/fig3-6.png', en:'Figure 3-6. Monoplane (left) and biplane (right).', zh:'圖3-6。單翼機（左）與雙翼機（右）。'},
{t:'p', en:'High-wing often uses wing struts (semi-cantilever — struts transmit loads to fuselage, typically attached ~halfway out); most low-wing (and some high-wing) use full cantilever (no external struts).',
 zh:'高單翼機常使用翼支柱（半懸臂式——支柱將負載傳遞至機身，通常安裝在機翼約一半的位置）；大多數低單翼機（及部分高單翼機）採用全懸臂式設計（無外部支柱）。'},
{t:'p', en:'Structural parts: spars, ribs, stringers (reinforced by trusses/I-beams/tubing/skin); ribs determine airfoil shape/thickness; fuel tanks often integral to wing structure or flexible bladders inside it.',
 zh:'結構組件：翼樑、翼肋、翼條（並以桁架／工字樑／管材／蒙皮加強）；翼肋決定了翼型的形狀與厚度；油箱通常是機翼結構的一部分，或是安裝在機翼內部的軟式油囊。'},
{t:'img', src:'figs/ch3/fig3-7.png', en:'Figure 3-7. Wing components.', zh:'圖3-7。機翼組件。'},
{t:'p', en:'Trailing-edge control surfaces: ailerons (~midpoint to tip, move opposite directions → roll) and flaps (fuselage to near midpoint, move down together → more lift for takeoff/landing; flush with wing in cruise).',
 zh:'後緣操縱面：副翼（大約自機翼中點延伸至翼尖，兩側朝相反方向偏轉→產生滾轉）與襟翼（自機身延伸至機翼中點附近，同步向下偏轉→增加起飛／降落時的升力；巡航時與機翼齊平收起）。'},
{t:'img', src:'figs/ch3/fig3-8.png', en:'Figure 3-8. Types of flaps.', zh:'圖3-8。襟翼類型。'},
{t:'p', en:'Alternate wing designs (e.g., weight-shift control aircraft\'s highly-swept wing for drag reduction + weight-shift control) covered in Ch.5', zh:'其他機翼設計（例如重心操控式飛行器高後掠角的機翼，用以減阻並配合重心轉移操控）詳見第5章'},
{t:'img', src:'figs/ch3/fig3-9.png', en:'Figure 3-9. Weight-shift control aircraft use the shifting of weight for control.', zh:'圖3-9。重心操控式飛行器透過重心轉移來操控飛機。'},
{t:'h3', en:'Empennage', zh:'尾翼組'},
{t:'p', en:'Tail group — fixed surfaces (vertical stabilizer, horizontal stabilizer) + movable surfaces (rudder, elevator, trim tabs). Rudder (back of vertical stabilizer) — nose left/right. Elevator (back of horizontal stabilizer) — nose up/down.',
 zh:'尾翼組——固定翼面（垂直安定面、水平安定面）＋可動翼面（方向舵、升降舵、配平片）。方向舵（位於垂直安定面後緣）——控制機首左右偏轉。升降舵（位於水平安定面後緣）——控制機首上下俯仰。'},
{t:'img', src:'figs/ch3/fig3-10.png', en:'Figure 3-10. Empennage components.', zh:'圖3-10。尾翼組組件。'},
{t:'p', en:'Trim tabs — small movable sections of a control surface\'s trailing edge, flight-deck controlled, reduce control pressures; can be on ailerons/rudder/elevator.',
 zh:'配平片——操縱面後緣上一小塊可動部位，由駕駛艙內操控，用以降低操縱桿力；可裝設於副翼／方向舵／升降舵上。'},
{t:'p', en:'Stabilator — alternate design, no separate elevator; one-piece horizontal stabilizer pivoting on a central hinge, moved directly by the control wheel; has an antiservo tab (moves same direction as stabilator trailing edge) that reduces sensitivity and also acts as a trim tab.',
 zh:'全動平尾（stabilator）——另一種設計，沒有獨立的升降舵；水平安定面為一體式，繞中央鉸鏈樞轉，由操縱盤直接帶動；配有「反隨動片」（與全動平尾後緣同方向偏轉），可降低操縱靈敏度，同時也具有配平片的功能。'},
{t:'img', src:'figs/ch3/fig3-11.png', en:'Figure 3-11. Stabilator components.', zh:'圖3-11。全動平尾組件。'},
{t:'h3', en:'Landing Gear', zh:'起落架'},
{t:'p', en:'Supports the aircraft when parked/taxiing/takeoff/landing. Wheels most common; floats (water) or skis (snow) also used. Conventional gear (tailwheel) — two main wheels + rear wheel. Tricycle gear — two main wheels + nosewheel.',
 zh:'在停放／滑行／起飛／降落時支撐飛機。輪式起落架最常見；也有用於水上的浮筒或用於雪地的雪橇。傳統式起落架（尾輪式）——兩個主輪＋一個後輪。三點式起落架——兩個主輪＋一個前輪。'},
{t:'p', en:'Steering: typically rudder pedals (nosewheel or tailwheel), some aircraft use differential braking.', zh:'轉向方式：通常透過方向舵踏板（不論前輪或尾輪式），部分飛機則採用差動煞車。'},
{t:'img', src:'figs/ch3/fig3-12.png', en:'Figure 3-12. Types of landing gear: floats (top), skis (middle), and wheels (bottom).', zh:'圖3-12。起落架類型：浮筒（上）、雪橇（中）、輪式（下）。'},
{t:'h3', en:'The Powerplant', zh:'動力系統'},
{t:'p', en:'Engine + propeller. Engine: turns the propeller; also generates electrical power, provides vacuum source for some instruments, and (most single-engine aircraft) cabin heat source. Cowling/nacelle — covered housing that streamlines airflow and ducts cooling air around cylinders.',
 zh:'動力系統＝引擎＋螺旋槳。引擎：帶動螺旋槳轉動；同時也產生電力、為部分儀表提供真空來源，並（大多數單引擎飛機）作為機艙暖氣的來源。整流罩／發動機艙罩——包覆式外殼，用以整流空氣並將冷卻氣流導引至汽缸周圍。'},
{t:'img', src:'figs/ch3/fig3-13.png', en:'Figure 3-13. Engine compartment.', zh:'圖3-13。引擎艙。'},
{t:'p', en:'Propeller: rotating airfoil — high pressure behind, low pressure at the face (same principle as wing lift) → generates thrust; can be mounted as puller (front) or pusher (rear).',
 zh:'螺旋槳：一種旋轉翼型——後方為高壓、前方為低壓（與機翼產生升力的原理相同）→因而產生推力；可安裝於機首作為「拉進式」，或安裝於機尾作為「推進式」。'},
{t:'p', en:'Two key design factors: blade angle (keeps AOA roughly constant along the span, reduces/eliminates stall risk) and pitch (distance a prop would travel in one revolution through a solid) — combine to determine propeller efficiency; props are matched to specific aircraft/powerplant combos for best efficiency at a given power setting.',
 zh:'兩個關鍵設計因素：槳葉角（讓攻角沿槳葉展長方向大致保持一致，降低或消除失速風險——攻角在飛行中會持續變化）與槳距（螺旋槳若在固體中旋轉一圈所前進的距離）——兩者共同決定螺旋槳效率；螺旋槳通常會與特定的機身／動力系統組合搭配，以在特定功率設定下達到最佳效率。'},

{t:'h2', en:'Subcomponents', zh:'次系統元件'},
{t:'li', en:'Airframe — basic structure, withstands aerodynamic forces + weight stresses (fuel/crew/payload)', zh:'機體結構——基本構造，須承受空氣動力負荷與燃油／機組員／載重帶來的應力'},
{t:'li', en:'Electrical system — generates/regulates/distributes power; sources include engine-driven AC generators, APUs, external power; powers flight instruments, essential systems (e.g., anti-icing), passenger services (cabin lighting)',
 zh:'電力系統——產生、調節並分配電力；電源來源包含引擎驅動的交流發電機、輔助動力單元（APU）、外部電源；供應飛航儀表、必要系統（例如防除冰）、乘客服務（如機艙照明）用電'},
{t:'li', en:'Flight controls — govern attitude/flight path; conventional primary controls: elevators (pitch), ailerons (roll), rudder (yaw) — hinged trailing-edge surfaces, operated by pilot or autopilot',
 zh:'飛行操縱系統——控制姿態與飛行路徑；傳統主操縱面：升降舵（俯仰）、副翼（滾轉）、方向舵（偏航）——皆為鉸接式後緣翼面，由飛行員或自動駕駛操作'},
{t:'li', en:'Brakes — modern aircraft: multiple caliper pads hydraulically squeeze a rotating disk (rotor); steel or carbon material (carbon = lighter, absorbs more energy); brake life measured in landings, not miles (huge energy absorbed per use)',
 zh:'煞車系統——現代飛機：多組卡鉗來令片透過液壓夾緊旋轉的煞車碟盤；材質為鋼或碳纖維（碳纖維較輕、吸能較高）；煞車壽命以「落地次數」而非里程計算（每次使用需吸收極大能量）'},

{t:'h2', en:'Types of Aircraft Construction', zh:'飛機構造類型'},
{t:'p', en:'Evolution: wood truss → monocoque shell → semimonocoque (current standard).', zh:'演進過程：木製桁架 → 硬殼式外殼 → 半硬殼式（目前的主流標準）。'},
{t:'h3', en:'Truss Structure', zh:'桁架結構'},
{t:'p', en:'Drawback: not streamlined. Longerons (welded tubing lengths) form the braced framework; vertical/horizontal struts welded on give a square/rectangular cross-section. Stringers and bulkheads/formers shape the fuselage and support the covering. Originally enclosed with cloth fabric, later lightweight metals (aluminum) → led to stressed skin structures.',
 zh:'缺點：外型不夠流線化。縱樑（焊接的長管材）構成加強的骨架；焊接上去的垂直與水平支柱使橫截面呈方形或矩形。翼條與隔框（成形框）則用來塑造機身外形並支撐蒙皮。最初以布質蒙皮包覆，後改用鋁等輕質金屬→進而發展出應力蒙皮結構。'},
{t:'h3', en:'Monocoque', zh:'硬殼式結構'},
{t:'p', en:'Stressed skin supports almost all loads (like an aluminum beverage can). Very strong but not tolerant of surface deformation — a dented/deformed section collapses easily.',
 zh:'應力蒙皮承受幾乎所有的負荷（如同一個鋁製飲料罐）。非常堅固，但不耐受表面變形——一旦局部凹陷或變形，很容易整體潰陷。'},
{t:'p', en:'Historical note: Jack Northrop\'s 1918 monocoque fuselage technique for the Lockheed S-1 Racer — molded plywood half-shells glued together, each half less than ¼ inch thick; monocoque didn\'t reemerge for decades due to complexity; modern analog = automobile unibody construction.',
 zh:'歷史小知識：Jack Northrop 於1918年為 Lockheed S-1 Racer 開發的硬殼式機身技術——以膠合的模製夾板半殼組成，每一半殼厚度不到四分之一英吋；由於製程複雜，這種技術之後數十年未再被廣泛採用；現代的類似應用則是汽車的承載式車身（unibody）結構。'},
{t:'h3', en:'Semimonocoque', zh:'半硬殼式結構'},
{t:'p', en:'Uses a substructure (bulkheads/formers + stringers) the skin attaches to, taking some bending stress off the stressed skin. Main fuselage section also includes wing attachment points and a firewall (heat-resistant material, e.g. stainless steel — protects flight deck/cabin from engine fire).',
 zh:'採用一套次結構（隔框／成形框＋翼條），蒙皮附著其上，可分擔部分原本由應力蒙皮承受的彎曲應力。機身主要段落也包含機翼接合點與防火牆（耐熱材質，例如不鏽鋼——用以保護駕駛艙／機艙不受引擎火警波及）。'},
{t:'img', src:'figs/ch3/fig3-14.png', en:'Figure 3-14. Semimonocoque and monocoque fuselage design.', zh:'圖3-14。半硬殼式與硬殼式機身設計。'},

{t:'h3', en:'Composite Construction — History', zh:'複合材料構造——發展歷史'},
{t:'p', en:'WWII B-29 fiberglass insulation → late 1950s European sailplanes used fiberglass as primary structure → 1965: FAA type-certified first all-fiberglass normal-category aircraft (Diamant HBV, Swiss sailplane) → 1969: Windecker Eagle (4-seat single-engine) certified normal category → by 2005, >35% of new aircraft used composite materials.',
 zh:'二戰時期B-29轟炸機使用玻璃纖維隔熱材 → 1950年代末歐洲高性能滑翔機開始以玻璃纖維作為主結構 → 1965年：FAA首次核准全玻璃纖維飛機的正常類型別證書（瑞士滑翔機Diamant HBV） → 1969年：Windecker Eagle（四人座單引擎機）取得正常類認證 → 到2005年，超過35%的新飛機採用複合材料製造。'},
{t:'img', src:'figs/ch3/fig3-15.png', en:'Figure 3-15. Composite aircraft.', zh:'圖3-15。複合材料飛機。'},
{t:'p', en:'"Composite" = fiberglass, carbon fiber cloth, Kevlar™, or mixtures — a fiber-reinforced matrix system: matrix ("glue," commonly epoxy resin) holds fibers and gives shape; fibers carry most of the load.',
 zh:'「複合材料」泛指玻璃纖維、碳纖維布、克維拉（Kevlar™）或以上材料的混合物——本質是「纖維強化基材系統」：基材（也就是「膠」，常見為環氧樹脂）將纖維黏合並塑形；纖維則承受絕大部分的負荷。'},
{t:'p', en:'Fiberglass: good tensile/compressive strength, good impact resistance, easy to work with, inexpensive — but relatively heavy. Carbon fiber: stronger and stiffer than fiberglass, lighter — but poor impact resistance (brittle); more expensive but well-designed structures can be ~30% lighter than equivalent aluminum.',
 zh:'玻璃纖維：具良好的抗拉／抗壓強度、良好的抗衝擊性、易於加工、價格便宜——但相對較重。碳纖維：抗拉／抗壓強度與剛性均優於玻璃纖維、重量更輕——但抗衝擊性較差（質脆易碎）；價格較高，但設計良好的碳纖維結構可比同等鋁製結構輕約30%。'},
{t:'h3', en:'Advantages of Composites', zh:'複合材料的優點'},
{t:'p', en:'Lighter weight is often cited, but not automatic. Smooth, compound-curved aerodynamic shapes → reduced drag. Reduces radar signature (stealth aircraft). Corrosion resistance. Good flex performance (e.g., helicopter rotor blades) — doesn\'t suffer metal fatigue.',
 zh:'常被提及的優點是重量較輕，但這並非必然（取決於結構設計與所用複合材料種類）。表面平滑、可做出複雜曲面的空氣動力外形→降低阻力。降低雷達反射截面（用於匿蹤機設計）。抗腐蝕性佳。良好的撓曲特性（例如直升機旋翼葉片）——不會像金屬一樣產生疲勞裂紋。'},
{t:'h3', en:'Disadvantages of Composites', zh:'複合材料的缺點'},
{t:'p', en:'Lack of visual proof of damage is the big one. Low energy impact → may show no visible surface sign, but can cause a cone-shaped spread of delamination underneath. Medium energy impact → visible local crushing, repair needed. High energy impact (bird strike, hail) → visible puncture, severe damage.',
 zh:'最主要的缺點是「損傷難以從外觀判斷」。低能量撞擊→表面可能完全看不出痕跡，但內部可能已出現錐狀擴散的分層損傷。中能量撞擊→會出現可見的局部凹陷，須進行修復。高能量撞擊（鳥擊、冰雹）→會出現明顯穿孔，損傷嚴重。'},
{t:'img', src:'figs/ch3/fig3-16.png', en:'Figure 3-16. Impact energy affects the visibility, as well as the severity, of damage in composite structures. High and medium energy impacts, while severe, are easy to detect. Low energy impacts can easily cause hidden damage.', zh:'圖3-16。撞擊能量會影響複合材料結構損傷的可見程度與嚴重程度。高、中能量撞擊雖然嚴重，但容易察覺；低能量撞擊則容易造成不易發現的隱藏損傷。'},
{t:'p', en:'If delamination/crushing/puncture occurs → repair mandatory; cover/protect from rain while awaiting repair. Speed tape can protect from water short-term but is not a structural repair, nor is paste filler.',
 zh:'一旦出現分層、凹陷或穿孔→必須進行修復；等待維修期間應加以覆蓋、防止淋雨。「速修膠帶」可短暫防水，但並非結構性修復，補土填料同樣不算結構性修復。'},
{t:'p', en:'Heat sensitivity: many epoxies weaken above 150°F; black-painted composite surface on hot asphalt can reach ~220°F vs. ~140°F if painted white → composite aircraft often have specific approved paint-color guidance.',
 zh:'耐熱性限制：許多環氧樹脂在超過華氏150度時會開始弱化；黑色塗裝的複合材料表面停在炎熱柏油地面上，溫度可能高達約220°F，若為白色塗裝則通常不超過約140°F→因此複合材料飛機通常對可使用的塗裝顏色有特定規範。'},
{t:'p', en:'Chemical paint strippers are harmful — must not be used; only mechanical removal (gentle grit blasting/sanding). Fluid spills (fuel/oil/hydraulic) generally not a problem with modern epoxy-resin composites, unless using cheaper polyester resin fuel tanks with ethanol-blended auto gas.',
 zh:'化學脫漆劑具有破壞性——絕對不可使用；僅能以機械方式去除塗裝（輕度噴砂或砂磨）。燃油／機油／液壓油噴濺，對現代環氧樹脂複合材料通常不構成問題，除非是使用較便宜的聚酯樹脂油箱、又加了含乙醇的車用汽油。'},
{t:'h3', en:'Lightning Strike Protection', zh:'雷擊防護'},
{t:'p', en:'Goal: spread strike energy over a large surface area to keep amps/sq-inch to a safe level. Composite aircraft: fiberglass is an electrical insulator; carbon fiber conducts but not as well as aluminum → metal mesh (aluminum mesh on fiberglass, copper mesh on carbon fiber) bonded to the outer skin adds conductivity.',
 zh:'目標：將雷擊能量分散至大面積表面，將每平方英吋的安培數降到安全範圍。複合材料飛機：玻璃纖維是電絕緣體；碳纖維雖能導電但不如鋁材佳→因此外層蒙皮會黏貼金屬網（玻璃纖維上貼鋁網、碳纖維上貼銅網）以增加導電性。'},
{t:'p', en:'Aircraft with internal radio antennas need "windows" (gaps) in the lightning mesh over the antenna — fiberglass is radio-transparent, carbon fiber is not.',
 zh:'裝有內建式無線電天線的飛機，須在天線上方的防雷網中留出「窗口」——因為玻璃纖維對無線電波是透明的，碳纖維則不是。'},
{t:'img', src:'figs/ch3/fig3-17.png', en:'Figure 3-17. Composite materials in aircraft, such as Columbia 350 (top), Boeing 787 (middle), and a Coast Guard HH-65 (bottom).', zh:'圖3-17。飛機上的複合材料應用實例：Columbia 350（上）、波音787（中）、美國海岸防衛隊HH-65直升機（下）。'},

{t:'h2', en:'Instrumentation: Moving into the Future', zh:'儀表系統：邁向未來'},
{t:'p', en:'Electronic Flight Display (EFD) replaces individual analog instruments with LCD screens: Primary Flight Display (PFD) (in front of pilot) + Multi-Function Display (MFD) (center of panel) — reduces clutter, improves safety via solid-state instruments with far lower failure rates than analog.',
 zh:'電子飛行顯示器（EFD）以LCD螢幕取代個別的類比儀表：主飛行顯示器（PFD，位於飛行員正前方）＋多功能顯示器（MFD，位於儀表板中央）——減少儀表板雜亂，並透過故障率遠低於類比儀表的固態儀表提升安全性。'},
{t:'img', src:'figs/ch3/fig3-18.png', en:'Figure 3-18. Analog display (top) and digital display (bottom) from a Cessna 172.', zh:'圖3-18。Cessna 172的類比儀表板（上）與數位儀表板（下）。'},
{t:'p', en:'Regardless of analog or digital/glass, instruments fall into 3 categories: performance, control, navigation.',
 zh:'無論是類比或數位（玻璃座艙）儀表，儀表都可分為三大類：性能儀表、操縱儀表、導航儀表。'},
{t:'h3', en:'Performance Instruments', zh:'性能儀表'},
{t:'p', en:'Show actual aircraft performance — altimeter, airspeed indicator, VSI, heading indicator, turn-and-slip indicator, AOA indicator, slip-skid indicator.',
 zh:'顯示飛機實際的性能表現——高度表、空速表、垂直速度表（VSI）、航向指示器、轉彎側滑儀、攻角指示器、側滑儀。'},
{t:'img', src:'figs/ch3/fig3-19.png', en:'Figure 3-19. Performance instruments.', zh:'圖3-19。性能儀表。'},
{t:'h3', en:'Control Instruments', zh:'操縱儀表'},
{t:'p', en:'Show immediate attitude/power changes in precise increments — the attitude indicator is the key one. Control instruments do not show speed or altitude (need performance instruments for that).',
 zh:'以精確的增量顯示即時的姿態／動力變化——姿態指示器是其中最關鍵的一項。操縱儀表本身不顯示速度或高度（需依靠性能儀表才能得知）。'},
{t:'img', src:'figs/ch3/fig3-20.png', en:'Figure 3-20. Control instruments.', zh:'圖3-20。操縱儀表。'},
{t:'h3', en:'Navigation Instruments', zh:'導航儀表'},
{t:'p', en:'Show aircraft position relative to a selected navigation facility/fix — course indicators, range indicators, glideslope indicators, bearing pointers; display GPS/VOR/NDB/ILS information; modern aircraft blend these sources for more accurate positional info.',
 zh:'顯示飛機相對於所選定導航設施／定位點的位置——包含航道指示器、距離指示器、下滑道指示器、方位指針；顯示GPS／VOR／NDB／ILS資訊；現代飛機會混合多種資訊來源，提供更精確的位置資訊。'},
{t:'img', src:'figs/ch3/fig3-21.png', en:'Figure 3-21. A comparison of navigation information as depicted on both analog and digital displays.', zh:'圖3-21。類比與數位顯示器所呈現導航資訊的比較。'},
{t:'img', src:'figs/ch3/fig3-22.png', en:'Figure 3-22. Analog and digital indications for glideslope interception.', zh:'圖3-22。截收下滑道時的類比與數位指示方式。'},
{t:'h3', en:'Global Positioning System (GPS)', zh:'全球定位系統（GPS）'},
{t:'p', en:'Satellite-based navigation, DOD-operated constellation; originally military, opened to civilian use in the 1980s. Works in all weather, anywhere, 24 hours a day.',
 zh:'以衛星為基礎的導航系統，由美國國防部（DOD）操作的衛星星系；最初僅供軍事用途，1980年代起開放民間使用。可在任何天候、任何地點、全天24小時運作。'},
{t:'p', en:'3 satellites minimum → 2D position (lat/long) + track; 4+ satellites → 3D position (lat/long/altitude); additional satellites help offset signal loss/ambiguity. More detail: Chapter 16 (Navigation) and the AIM.',
 zh:'至少須鎖定3顆衛星→可算出二維位置（經緯度）與航跡；4顆以上衛星→可算出三維位置（經緯度＋高度）；額外的衛星有助於補償訊號中斷或模糊的問題。詳見第16章（導航）與AIM（航空資訊手冊）。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Overview of aircraft structures; deeper understanding available via flight-sim software, online interactive programs (e.g., AOPA), aviation periodicals, and free NASA/FAA resources (as noted in Ch.1).',
 zh:'本章概略介紹了飛機結構；若想更深入了解，可透過飛行模擬軟體、線上互動課程（例如AOPA提供的資源）、航空期刊，以及第一章提過的NASA／FAA免費資源進一步學習。'}
  ]
},

  subZh:'原文頁碼 4-1 至 4-9。',
  blocks:[
{t:'h2', en:'Air is a Fluid', zh:'空氣是一種流體'},
{t:'p', en:'Gases (including air) are fluids — they take the shape of their container and generally don\'t strongly resist deformation. Viscosity — a fluid\'s resistance to flowing; high-viscosity = "thick"/resists flow (grease > motor oil > gasoline); air has low viscosity, flows easily.',
 zh:'氣體（包含空氣）也是一種流體——會呈現容器的形狀，且通常不太抗拒變形。黏度——流體抵抗流動的特性；高黏度＝「濃稠」、抗拒流動（黃油＞機油＞汽油）；空氣的黏度很低，流動非常容易。'},
{t:'p', en:'Friction — resistance between two contacting surfaces; even a "smooth" wing surface has microscopic roughness that slows airflow near it; the layer of air molecules that adheres to the wing surface (near-zero relative velocity) = the boundary layer. Drag = boundary-layer friction + air\'s viscosity acting together to resist airflow over a wing.',
 zh:'摩擦——兩個接觸表面之間的阻力；即使機翼表面看似「光滑」，在微觀層面仍有粗糙度，會減緩貼近表面的氣流速度；黏附在機翼表面上（相對速度接近零）的那層空氣分子，稱為邊界層。阻力＝邊界層摩擦力＋空氣本身的黏性，兩者共同作用，阻礙氣流通過機翼。'},
{t:'img', src:'figs/ch4/fig4-1.png', en:'Figure 4-1. Microscopic surface of a wing.', zh:'圖4-1。機翼表面的微觀樣貌。'},

{t:'h2', en:'Pressure', zh:'壓力'},
{t:'p', en:'Pressure = force per unit area, perpendicular to a surface. Atmospheric pressure matters most to pilots — drives weather, helps generate lift, and actuates the altimeter, airspeed indicator, VSI, and manifold pressure gauge.',
 zh:'壓力＝垂直作用於表面單位面積上的力。大氣壓力對飛行員最為重要——驅動天氣變化、有助於產生升力，並驅動高度表、空速表、垂直速度表與歧管壓力表等儀表運作。'},
{t:'img', src:'figs/ch4/fig4-2.png', en:'Figure 4-2. Standard sea level pressure.', zh:'圖4-2。標準海平面壓力。'},
{t:'p', en:'Standard sea-level pressure: 14.70 psi ≈ 29.92"Hg ≈ 1,013.2 mb. Standard atmosphere (ISA / ICAO Standard Atmosphere): sea-level temp 59°F/15°C, pressure 29.92"Hg/1,013.2 mb. Standard temperature lapse rate: ~3.5°F (2°C) per 1,000 ft up to 36,000 ft, then constant to 80,000 ft. Standard pressure lapse rate: ~1"Hg per 1,000 ft up to 10,000 ft.',
 zh:'標準海平面壓力：14.70 psi≈29.92吋汞柱（"Hg）≈1,013.2毫巴（mb）。標準大氣（ISA／ICAO標準大氣）：海平面溫度59°F／15°C，壓力29.92"Hg／1,013.2 mb。標準溫度遞減率：每1,000呎約下降3.5°F（2°C），至36,000呎後維持恆定，直到80,000呎。標準氣壓遞減率：每1,000呎約下降1"Hg，適用至10,000呎。'},
{t:'h3', en:'Pressure Altitude', zh:'壓力高度'},
{t:'p', en:'Height above the Standard Datum Plane (SDP) — the theoretical level where atmospheric weight = 29.92"Hg. = indicated altitude when altimeter is set to 29.92. Basis for aircraft performance calcs and flight-level assignment at/above 18,000 ft.',
 zh:'標準基準面（SDP）之上的高度——即大氣重量等於29.92"Hg的理論高度層。當高度表撥定為29.92時的指示高度，即為壓力高度。它是計算飛機性能與18,000呎以上飛航空層指派的依據。'},
{t:'h3', en:'Density Altitude', zh:'密度高度'},
{t:'p', en:'= pressure altitude corrected for nonstandard temperature. Lower air density (higher density altitude) reduces power (engine takes in less air), thrust (prop less efficient), and lift (thin air exerts less force). High density altitude = thin air (high elevation/low pressure/high temp/high humidity); low density altitude = dense air (opposite conditions). Aircraft performs as though at an altitude equal to its density altitude, regardless of actual altitude.',
 zh:'密度高度＝依非標準溫度修正後的壓力高度。空氣密度較低（密度高度較高）會降低動力（引擎吸入的空氣較少）、推力（螺旋槳在稀薄空氣中效率較差）以及升力（稀薄空氣施加的作用力較小）。高密度高度＝空氣稀薄（高海拔／低氣壓／高溫／高濕度）；低密度高度＝空氣濃密（相反條件）。無論實際高度為何，飛機的表現都會如同在其密度高度所對應的高度上飛行。'},
{t:'p', en:'Effect of pressure on density: density ∝ pressure (at constant temp). Effect of temperature: density ∝ 1/temperature (at constant pressure) — pressure\'s drop with altitude usually dominates overall, so density decreases with altitude. Effect of humidity: water vapor is lighter than air, so moist air is less dense than dry air → higher humidity = higher density altitude = reduced performance.',
 zh:'壓力對密度的影響：在溫度不變的情況下，密度與壓力成正比。溫度的影響：在壓力不變的情況下，密度與溫度成反比——但整體而言，隨高度上升壓力下降的效應通常佔主導，因此密度整體隨高度增加而降低。濕度的影響：水蒸氣比空氣輕，因此潮濕空氣的密度低於乾燥空氣→濕度越高，密度高度越高，飛機性能也隨之下降。'},
{t:'img', src:'figs/ch4/fig4-3.png', en:'Figure 4-3. Properties of standard atmosphere.', zh:'圖4-3。標準大氣的特性。'},

{t:'h2', en:'Theories in the Production of Lift', zh:'升力產生的理論'},
{t:'h3', en:'Newton\'s Basic Laws of Motion', zh:'牛頓運動定律'},
{t:'p', en:'1st Law (inertia): an object at rest/in uniform motion stays that way unless acted on by an outside force. 2nd Law: force = mass × acceleration. 3rd Law: every action has an equal and opposite reaction — e.g., propeller pushes air back → air pushes aircraft forward; jet engine pushes hot gas backward → aircraft pushed forward.',
 zh:'第一定律（慣性）：靜止或等速運動的物體會維持該狀態，除非受到外力作用。第二定律：力＝質量×加速度。第三定律：每個作用力都有一個大小相等、方向相反的反作用力——例如螺旋槳將空氣往後推，空氣便將飛機向前推；噴射引擎將熱氣往後噴，飛機便被向前推動。'},
{t:'h3', en:'Bernoulli\'s Principle of Differential Pressure', zh:'白努利壓差原理'},
{t:'p', en:'As the velocity of a moving fluid increases, the pressure within it decreases. Demonstrated by a venturi tube: air speeds up through the constricted throat (to keep mass flow constant) → pressure drops there; slows and pressure rises again past the constriction. Explains why air passing over a wing\'s curved top accelerates → pressure there drops.',
 zh:'流動流體的速度增加時，其內部壓力會下降。可用文氏管（venturi tube）示範：空氣通過收縮的喉部時加速（以維持質量流量不變）→該處壓力隨之下降；通過收縮段之後氣流減速，壓力又再度回升。這解釋了為什麼氣流通過機翼上方彎曲表面時會加速→該處壓力因此下降。'},
{t:'img', src:'figs/ch4/fig4-4.png', en:'Figure 4-4. Air pressure decreases in a venturi tube.', zh:'圖4-4。文氏管內的空氣壓力下降。'},

{t:'h2', en:'Airfoil Design', zh:'翼型設計'},
{t:'p', en:'Airfoil: a structure shaped to get a useful aerodynamic reaction from air moving past it. Key features: camber (curvature — upper surface more pronounced than lower), leading edge (rounded, forward) and trailing edge (narrow, tapered), chord line (leading to trailing edge, straight reference line), mean camber line (equidistant from upper/lower surfaces).',
 zh:'翼型：一種經過設計的結構，能從流經其表面的空氣中獲得有用的空氣動力反應。主要特徵包括：翼弧（曲度——上表面的弧度比下表面明顯）、前緣（圓潤、朝前）與後緣（狹窄、漸尖）、翼弦線（連接前緣與後緣的直線參考線）、平均彎度線（與上下表面等距的線）。'},
{t:'img', src:'figs/ch4/fig4-5.png', en:'Figure 4-5. Typical airfoil section.', zh:'圖4-5。典型翼型剖面。'},
{t:'img', src:'figs/ch4/fig4-6.png', en:'Figure 4-6. Airfoil designs.', zh:'圖4-6。各種翼型設計。'},
{t:'p', en:'Lift comes from two combined actions: positive-pressure lift from air striking the relatively flat lower surface, and negative-pressure (suction) lift from accelerated air over the curved upper surface — the upper-surface contribution is the larger share. No single airfoil satisfies every flight requirement — shape is a tradeoff dictated by weight, speed, and mission.',
 zh:'升力來自兩種力量的結合：氣流撞擊相對平坦的下表面所產生的正壓升力，以及氣流加速通過彎曲上表面所產生的負壓（吸力）升力——上表面所貢獻的部分較大。沒有任何一種翼型能滿足所有飛行需求——形狀的選擇取決於重量、速度與任務需求之間的取捨。'},
{t:'h3', en:'Low Pressure Above / High Pressure Below', zh:'上表面低壓／下表面高壓'},
{t:'p', en:'Air over the upper surface must move faster than air along the bottom → by Bernoulli, pressure above the airfoil drops → contributes to lift. Underneath: airflow nearly stops at a stagnation point near the leading edge, then speeds back up — this net slowing beneath the airfoil creates positive pressure below. Both Newton\'s laws and Bernoulli\'s principle operate together whenever an airfoil generates lift.',
 zh:'上表面的氣流速度必須比下表面快→依白努利原理，翼型上方的壓力因此下降→有助於產生升力。下表面：氣流在靠近前緣的滯止點幾乎完全停止，之後再重新加速——這種下表面整體較慢的氣流，形成了正壓。翼型產生升力時，牛頓定律與白努利原理其實是同時運作的。'},
{t:'p', en:'Note: the pressure difference between upper/lower surfaces alone does not fully account for total lift — symmetrical airfoils (common on high-speed aircraft, many helicopter rotor blades, even a flat paper airplane) still produce lift through "flow turning"/angle relative to the oncoming airstream, not just camber-driven pressure differential.',
 zh:'補充說明：僅靠上下表面的壓差並不能完全解釋總升力——對稱翼型（常見於高速飛機、許多直升機旋翼葉片，甚至一架平坦的紙飛機）仍能產生升力，靠的是氣流相對來流角度的「轉向」效應，而不只是翼弧造成的壓差。'},
{t:'h3', en:'Pressure Distribution', zh:'壓力分布'},
{t:'p', en:'Pressure varies along the airfoil surface at different AOAs — the average for a given AOA = center of pressure (CP), through which aerodynamic force acts. CP moves forward at high AOA, aft at low AOA — this matters a lot for wing structural design and governs the aircraft\'s aerodynamic balance/controllability.',
 zh:'在不同攻角下，翼型表面的壓力分布會有所變化——某一攻角下的平均值即為壓力中心（CP），空氣動力即透過此點作用。攻角越大，CP越往前移；攻角越小，CP越往後移——這對機翼結構設計影響很大，也決定了飛機的空氣動力平衡與操控性。'},
{t:'img', src:'figs/ch4/fig4-7.png', en:'Figure 4-7. Pressure distribution on an airfoil and CP changes with AOA.', zh:'圖4-7。翼型上的壓力分布，以及CP隨攻角變化的情形。'},

{t:'h2', en:'A Third Dimension', zh:'第三維度'},
{t:'p', en:'Beyond the 2D upper/lower surface picture, the wingtip also has an aerodynamic effect: high pressure from below pushes around the tip to the low-pressure area above → creates a rotating tip vortex, trailing behind as a downwash → reduces lift for the outer portion of the wing. Countermeasures: winglets (act as a dam preventing the vortex) or a tapered wingtip (smooths airflow around the tip).',
 zh:'除了上下表面這個二維的觀點之外，翼尖也具有空氣動力效應：下方的高壓氣流會繞過翼尖流向上方的低壓區→形成旋轉的翼尖渦流，並在機翼後方拖曳出下洗流→降低機翼外側部分的升力。因應對策：翼尖小翼（如同一道屏障防止渦流形成）或漸縮式翼尖（讓氣流繞過翼尖時更為平順）。'},
{t:'img', src:'figs/ch4/fig4-8.png', en:'Figure 4-8. Tip vortex.', zh:'圖4-8。翼尖渦流。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Modern GA aircraft have high-performance characteristics, making it increasingly important for pilots to understand these underlying principles. Further reading: <a href="https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/bga-simulations/" target="_blank">NASA\'s Beginner\'s Guide to Aerodynamics</a>.',
 zh:'現代通用航空飛機具備高性能特性，因此飛行員理解這些基本原理變得日益重要。延伸閱讀：<a href="https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/bga-simulations/" target="_blank">NASA的《空氣動力學入門指南》</a>。'}
  ]
},
{

  titleZh:'第六章 — 飛行操縱系統',

  subZh:'原文頁碼 6-1 至 6-12。',
  blocks:[
{t:'h2', en:'Flight Control System Evolution', zh:'飛行操縱系統的演進'},
{t:'p', en:'Started mechanical (cables/pulleys/push rods). Hydromechanical — mechanical circuit + hydraulic circuit — reduced complexity/weight/limitations as aircraft got larger/faster. Fly-by-wire — physical linkage replaced by electrical interface; boosted controls feed back simulated "feel" to the pilot.',
 zh:'最初為機械式（纜線／滑輪／推桿）。液壓機械式——結合機械迴路與液壓迴路——隨著飛機日益龐大、快速，用以降低系統的複雜度、重量與限制。線傳飛控（Fly-by-wire）——以電子介面取代實體連桿；助力操縱系統會回饋模擬的「手感」給飛行員。'},
{t:'img', src:'figs/ch6/fig6-1.png', en:'Figure 6-1. Mechanical flight control system.', zh:'圖6-1。機械式飛行操縱系統。'},
{t:'img', src:'figs/ch6/fig6-2.png', en:'Figure 6-2. Hydromechanical flight control system.', zh:'圖6-2。液壓機械式飛行操縱系統。'},
{t:'p', en:'NASA Dryden research: Intelligent Flight Control Systems (IFCS) — adaptive neural-network flight control, helps maintain control/land safely after a control surface failure or airframe damage.',
 zh:'NASA Dryden研究中心的研究：智慧飛行操縱系統（IFCS）——採用自適應神經網路的飛控系統，能在操縱面失效或機身受損時，協助飛行員維持操控並安全落地。'},
{t:'img', src:'figs/ch6/fig6-3.png', en:'Figure 6-3. Helicopter flight control system.', zh:'圖6-3。直升機飛行操縱系統。'},

{t:'h2', en:'Flight Controls — Primary vs. Secondary', zh:'主操縱與次操縱'},
{t:'p', en:'Primary: ailerons, elevator (or stabilator), rudder — required for safe control. Secondary: wing flaps, leading edge devices, spoilers, trim systems — improve performance or relieve excess control forces.',
 zh:'主操縱面：副翼、升降舵（或全動平尾）、方向舵——為安全操控所必需。次操縱面：襟翼、前緣裝置、擾流板、配平系統——用於提升性能或減輕過大的操縱桿力。'},
{t:'table', head:['Surface','Movement / Axis'], headZh:['操縱面','運動方向／軸線'], rows:[
  {en:'Aileron', zh:'副翼', en2:'Roll — Longitudinal axis — Lateral stability', zh2:'滾轉——縱軸——側向穩定性'},
  {en:'Elevator / Stabilator', zh:'升降舵／全動平尾', en2:'Pitch — Lateral axis — Longitudinal stability', zh2:'俯仰——橫軸——縱向穩定性'},
  {en:'Rudder', zh:'方向舵', en2:'Yaw — Vertical axis — Directional stability', zh2:'偏航——垂直軸——方向穩定性'}
]},
{t:'img', src:'figs/ch6/fig6-4.png', en:'Figure 6-4. Airplane controls, movement, axes of rotation, and type of stability.', zh:'圖6-4。飛機操縱面、運動方式、旋轉軸與穩定性類型對照。'},

{t:'h2', en:'Ailerons', zh:'副翼'},
{t:'p', en:'Attached to outboard trailing edge of each wing, move opposite directions. Right control input → right aileron up (lift decreases) + left aileron down (lift increases) → roll right.',
 zh:'安裝於左右機翼的外側後緣，兩側朝相反方向偏轉。向右操縱→右副翼向上偏（升力減少）＋左副翼向下偏（升力增加）→產生向右滾轉。'},
{t:'h3', en:'Adverse Yaw', zh:'不利偏航'},
{t:'p', en:'Down-deflected aileron produces more lift AND more drag → that wing slows slightly → aircraft yaws toward the wing with increased lift/drag (opposite the bank direction, from the pilot\'s view). Worse at low airspeed. Rudder counteracts it. Coordinated turn = aileron (bank) + rudder (counter adverse yaw) + elevator back-pressure (more lift needed in a turn).',
 zh:'下偏的副翼會產生更多升力「也」產生更多阻力→該側機翼因而略微減速→飛機朝升力／阻力增加的那側偏航（從飛行員角度看，方向與坡度相反）。低速時此現象更明顯。方向舵可用來抵銷此效應。協調轉彎＝副翼（控制坡度）＋方向舵（抵銷不利偏航）＋升降舵拉桿力（轉彎時需要更多升力）。'},
{t:'img', src:'figs/ch6/fig6-5.png', en:'Figure 6-5. Adverse yaw is caused by higher drag on the outside wing that is producing more lift.', zh:'圖6-5。不利偏航是由升力較大那側機翼的較高阻力所造成。'},
{t:'p', en:'4 manufacturer solutions to reduce adverse yaw: Differential ailerons (up aileron deflects more than down); Frise-type ailerons (raised aileron\'s leading edge projects into airflow, creating balancing drag); Coupled ailerons and rudder (interconnect springs auto-deflect rudder with aileron input); Flaperons (combine flap+aileron function via a mixer).',
 zh:'廠商減少不利偏航的四種方案：差動式副翼（上偏角度大於下偏角度）；Frise型副翼（上偏副翼的前緣會凸入氣流中，產生平衡用的阻力）；副翼／方向舵連動系統（連動彈簧會隨副翼輸入自動偏轉方向舵）；襟副翼（透過混合器結合襟翼與副翼的功能）。'},
{t:'img', src:'figs/ch6/fig6-6.png', en:'Figure 6-6. Differential ailerons.', zh:'圖6-6。差動式副翼。'},
{t:'img', src:'figs/ch6/fig6-7.png', en:'Figure 6-7. Frise-type ailerons.', zh:'圖6-7。Frise型副翼。'},
{t:'img', src:'figs/ch6/fig6-8.png', en:'Figure 6-8. Coupled ailerons and rudder.', zh:'圖6-8。副翼與方向舵連動系統。'},
{t:'img', src:'figs/ch6/fig6-9.png', en:'Figure 6-9. Flaperons on a Skystar Kitfox MK 7.', zh:'圖6-9。Skystar Kitfox MK 7上的襟副翼。'},

{t:'h2', en:'Elevator', zh:'升降舵'},
{t:'p', en:'Aft column movement → elevator trailing edge up ("up-elevator") → downward aerodynamic force on tail → tail down, nose pitches up. Forward column movement → opposite effect.',
 zh:'操縱柱向後拉→升降舵後緣向上偏（「升降舵上偏」）→尾翼產生向下的空氣動力→尾部下沉、機首抬起。操縱柱向前推則產生相反效果。'},
{t:'img', src:'figs/ch6/fig6-10.png', en:'Figure 6-10. The elevator is the primary control for changing the pitch attitude of an aircraft.', zh:'圖6-10。升降舵是改變飛機俯仰姿態的主操縱面。'},
{t:'h3', en:'T-Tail', zh:'T型尾翼'},
{t:'p', en:'Elevator sits above prop downwash/fuselage-wing airflow disturbance → more consistent control response; popular on aft-fuselage-engine aircraft and seaplanes. Needs greater elevator deflection (higher control forces) at slow speed vs. conventional tail. Needs extra structural design against flutter.',
 zh:'升降舵位於螺旋槳下洗流／機身機翼氣流擾動之上→控制反應更為一致；常用於尾部裝發動機的飛機及水上飛機。低速時所需的升降舵偏轉量（及操縱桿力）比傳統尾翼更大。須額外加強結構設計以防止顫振。'},
{t:'img', src:'figs/ch6/fig6-11.png', en:'Figure 6-11. Aircraft with a T-tail design at a high AOA and an aft CG.', zh:'圖6-11。T型尾翼飛機在高攻角、重心偏後時的情形。'},
{t:'p', en:'Deep stall risk: at very high AOA + low airspeed + aft CG, the wing\'s turbulent wake can blanket the tail, drastically reducing elevator/stabilator effectiveness → hard to recover. Mitigations: control stops, elevator down springs, (on transport jets) stick pushers.',
 zh:'深度失速風險：在極高攻角＋低空速＋重心偏後的情況下，機翼產生的紊流尾流可能籠罩尾翼，大幅降低升降舵／全動平尾的效能→難以改出。因應措施：操縱行程限制器、升降舵下偏彈簧、（運輸類噴射機上的）推桿裝置。'},
{t:'img', src:'figs/ch6/fig6-12.png', en:'Figure 6-12. When the aerodynamic efficiency of the horizontal tail surface is inadequate due to an aft CG condition, an elevator down spring may be used to supply a mechanical load to lower the nose.', zh:'圖6-12。當重心偏後導致水平尾翼空氣動力效能不足時，可使用升降舵下偏彈簧提供機械力使機首下俯。'},

{t:'h2', en:'Stabilator', zh:'全動平尾'},
{t:'p', en:'One-piece horizontal stabilizer pivoting on a central hinge — pull back → nose up; push forward → nose down. Very sensitive to control inputs → antiservo tab on trailing edge increases required control force, reducing overcontrol tendency; a balance weight is also typically used.',
 zh:'一體式水平安定面，繞中央鉸鏈樞轉——向後拉→機首上仰；向前推→機首下俯。對操縱輸入非常敏感→後緣的反隨動片會增加所需操縱力，降低過度操縱的傾向；通常也會搭配配重使用。'},
{t:'img', src:'figs/ch6/fig6-13.png', en:'Figure 6-13. The stabilator is a one-piece horizontal tail surface that pivots up and down about a central hinge point.', zh:'圖6-13。全動平尾是繞中央鉸鏈上下樞轉的一體式水平尾翼面。'},

{t:'h2', en:'Canard', zh:'鴨翼'},
{t:'p', en:'A forward horizontal lifting surface ahead of the main wings — the canard actually generates lift and holds the nose up (vs. an aft-tail\'s downward force). Used on the Wright Flyer; regained popularity in modern designs (e.g., Piaggio P180).',
 zh:'位於主機翼前方的水平升力面——鴨翼本身會產生升力並用以撐住機首（相對地，傳統尾翼是靠向下的力來達成同樣效果）。曾用於萊特飛行者號，並在現代設計中重新受到青睞（例如Piaggio P180）。'},
{t:'img', src:'figs/ch6/fig6-14.png', en:'Figure 6-14. The Piaggio P180 includes a variable-sweep canard design that provides longitudinal stability about the lateral axis.', zh:'圖6-14。Piaggio P180採用可變後掠鴨翼設計，提供繞橫軸的縱向穩定性。'},

{t:'h2', en:'Rudder', zh:'方向舵'},
{t:'p', en:'Controls yaw about the vertical axis; hinged to the vertical stabilizer, controlled by rudder pedals. Left pedal → rudder moves left → nose yaws left. Effectiveness increases with airspeed; propeller slipstream over the rudder increases its effectiveness.',
 zh:'控制繞垂直軸的偏航運動；鉸接於垂直安定面上，由方向舵踏板操控。踩左踏板→方向舵向左偏→機首向左偏航。舵效隨空速增加而提升；螺旋槳滑流吹過方向舵也會增加其舵效。'},
{t:'img', src:'figs/ch6/fig6-15.png', en:'Figure 6-15. The effect of left rudder pressure.', zh:'圖6-15。左方向舵施力的效果。'},

{t:'h2', en:'V-Tail', zh:'V型尾翼'},
{t:'p', en:'Two slanted surfaces (ruddervators) combine elevator + rudder function. Control wheel moves both surfaces together (pitch); rudder pedals move them differentially (yaw). More complex control system, more susceptible to Dutch roll; drag reduction is minimal (e.g., Beechcraft Bonanza V35).',
 zh:'兩片傾斜的翼面（稱為「方向升降舵」ruddervator）結合了升降舵與方向舵的功能。操縱盤同步驅動兩片翼面（控制俯仰）；方向舵踏板則差動驅動（控制偏航）。控制系統較複雜，也更容易發生荷蘭滾；實際減阻效果有限（例如Beechcraft Bonanza V35）。'},
{t:'img', src:'figs/ch6/fig6-16.png', en:'Figure 6-16. Beechcraft Bonanza V35.', zh:'圖6-16。Beechcraft Bonanza V35。'},

{t:'h2', en:'Secondary Flight Controls', zh:'次要操縱面'},
{t:'h3', en:'Flaps', zh:'襟翼'},
{t:'table', head:['Type','Notes'], headZh:['類型','說明'], rows:[
  {en:'Plain', zh:'簡單式', en2:'Simplest; ↑camber →↑CL; also ↑drag significantly, moves CP aft → nose-down moment', zh2:'最簡單的類型；增加翼弧→提升升力係數；同時大幅增加阻力，並使壓力中心後移→產生機首下俯力矩'},
  {en:'Split', zh:'開裂式', en2:'Deflects from lower surface only; slightly more lift than plain, more drag', zh2:'僅下表面偏轉；升力略高於簡單式，阻力也較大'},
  {en:'Slotted', zh:'開縫式', en2:'Most popular today; ducts high-energy air to upper surface, delays flow separation → much higher CL-MAX', zh2:'目前最常見的類型；將高能量氣流導引至上表面，延遲氣流分離→大幅提升最大升力係數'},
  {en:'Fowler', zh:'佛勒式', en2:'A slotted-flap variant; slides backward on tracks (increases wing area, not just camber)', zh2:'開縫式襟翼的一種變體；沿軌道向後滑出（增加機翼面積，不只是翼弧）'}
]},
{t:'img', src:'figs/ch6/fig6-17.png', en:'Figure 6-17. Five common types of flaps.', zh:'圖6-17。五種常見的襟翼類型。'},
{t:'h3', en:'Leading Edge Devices', zh:'前緣裝置'},
{t:'p', en:'Fixed slots — direct airflow to upper surface, delay separation. Movable slats — leading-edge segments on tracks, admit under-wing air over the upper surface at high AOA. Leading edge flaps — increase CL-MAX and camber, often paired with trailing-edge flaps. Leading edge cuffs — fixed devices, improve upper-surface airflow attachment at high AOA (lowers stall speed) at some cruise-speed cost.',
 zh:'固定式縫翼——將氣流導引至上表面，延遲氣流分離。可動式前緣縫翼——沿軌道移動的前緣分段構造，在高攻角時讓下表面氣流流向上表面。前緣襟翼——增加最大升力係數與翼弧，常與後緣襟翼搭配使用。前緣翼刀（固定式）——為固定式裝置，改善高攻角時上表面氣流的附著性（降低失速速度），但會犧牲部分巡航速度。'},
{t:'img', src:'figs/ch6/fig6-18.png', en:'Figure 6-18. Leading edge high lift devices.', zh:'圖6-18。前緣高升力裝置。'},
{t:'h3', en:'Spoilers', zh:'擾流板'},
{t:'p', en:'High-drag devices deployed from the wing to spoil smooth airflow → reduce lift, increase drag. Gliders: control descent rate. Other aircraft: roll control (no adverse yaw) or descend without gaining speed, or reduce ground roll after landing (transfer weight to wheels, improve braking).',
 zh:'從機翼展開的高阻力裝置，用以破壞平順氣流→降低升力、增加阻力。滑翔機：用於控制下降速率。其他飛機：可用於滾轉操縱（不產生不利偏航），或在不增加速度的情況下下降，也可用於落地後縮短滑行距離（將重量轉移至機輪、提升煞車效能）。'},
{t:'img', src:'figs/ch6/fig6-19.png', en:'Figure 6-19. Spoilers reduce lift and increase drag during descent and landing.', zh:'圖6-19。擾流板在下降與落地時降低升力、增加阻力。'},
{t:'h3', en:'Trim Systems', zh:'配平系統'},
{t:'p', en:'Relieve the pilot from holding constant control pressure. Trim tabs (most common — single tab on elevator trailing edge). Balance tabs (auto-move opposite the primary surface, reducing pilot force). Servo tabs (mainly large aircraft — tab moves with input, airflow force on tab moves the primary surface). Antiservo tabs (move same direction as the stabilator — reduce sensitivity + function as trim). Ground adjustable tabs (fixed rudder tab, bent on the ground by trial and error). Adjustable stabilizer (jackscrew pivots the whole horizontal stabilizer — used on most jet transports).',
 zh:'讓飛行員不必持續施加操縱桿力。配平片（最常見——單一配平片位於升降舵後緣）。平衡片（會自動朝主操縱面相反方向移動，降低所需操縱力）。伺服片（主要用於大型飛機——配平片隨輸入移動，氣流作用於配平片上的力再帶動主操縱面）。反隨動片（與全動平尾同方向移動——降低敏感度並兼具配平功能）。地面可調式配平片（固定式方向舵配平片，於地面透過試誤法彎折調整）。可調式安定面（透過絲桿樞轉整片水平安定面——大多數噴射客機採用此設計）。'},
{t:'img', src:'figs/ch6/fig6-20.png', en:'Figure 6-20. The movement of the elevator is opposite to the direction of movement of the elevator trim tab.', zh:'圖6-20。升降舵的偏轉方向與升降舵配平片的移動方向相反。'},
{t:'img', src:'figs/ch6/fig6-21.png', en:'Figure 6-21. An antiservo tab attempts to streamline the control surface and is used to make the stabilator less sensitive by opposing the force exerted by the pilot.', zh:'圖6-21。反隨動片藉由對抗飛行員施加的力，使操縱面趨於順流並降低全動平尾的敏感度。'},
{t:'img', src:'figs/ch6/fig6-22.png', en:'Figure 6-22. A ground adjustable tab is used on the rudder of many small airplanes to correct for a tendency to fly with the fuselage slightly misaligned with the relative wind.', zh:'圖6-22。許多小型飛機的方向舵上會裝設地面可調式配平片，用以修正機身相對氣流略微偏斜的傾向。'},
{t:'img', src:'figs/ch6/fig6-23.png', en:'Figure 6-23. Some aircraft, including most jet transports, use an adjustable stabilizer to provide the required pitch trim forces.', zh:'圖6-23。包含大多數噴射客機在內，部分飛機採用可調式安定面來提供所需的俯仰配平力。'},

{t:'h2', en:'Autopilot', zh:'自動駕駛'},
{t:'p', en:'Automatic flight control system keeping the aircraft level or on a set course; reduces pilot workload, increases safety; common features: altitude hold, heading hold. Single-axis autopilot controls the longitudinal axis only; three-axis controls all three axes. Includes a disconnect safety feature; can always be manually overridden.',
 zh:'自動維持飛機水平或依設定航向飛行的自動飛行操縱系統；能降低飛行員工作負荷、提升安全性；常見功能包含高度保持與航向保持。單軸自動駕駛僅控制縱軸；三軸自動駕駛則同時控制三個軸向。系統內建解除安全裝置；且飛行員隨時可手動接管操控。'},
{t:'img', src:'figs/ch6/fig6-24.png', en:'Figure 6-24. Basic autopilot system integrated into the flight control system.', zh:'圖6-24。整合於飛行操縱系統中的基本自動駕駛系統。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Flight control systems and aerodynamic characteristics vary a lot between aircraft — pilots must become familiar with the primary/secondary flight control systems of the specific aircraft flown, primarily via the AFM/POH.',
 zh:'不同飛機的操縱系統與空氣動力特性差異很大——飛行員必須熟悉所駕駛飛機的主／次操縱系統，主要依據為飛航手冊（AFM）或飛行員操作手冊（POH）。'}
  ]
},
{
  id:'ch9', num:9,
  titleEn:'Chapter 9 — Flight Manuals and Other Documents',
  titleZh:'第九章 — 飛航手冊與其他文件',
  subEn:'Original pages 9-1 to 9-13.',
  subZh:'原文頁碼 9-1 至 9-13。',
  blocks:[
{t:'h2', en:'AFM vs. POH vs. Owner/Information Manual', zh:'AFM 與 POH 及一般使用手冊的差異'},
{t:'p', en:'Owner/information manual — general info only, not FAA-approved, not aircraft-specific, not kept current — cannot substitute for the AFM/POH. AFM (Airplane Flight Manual) — FAA-approved, aircraft-specific (usually by serial number); 14 CFR Part 91 requires compliance with its limits. POH (Pilot\'s Operating Handbook) — contains FAA-approved AFM info; for most light aircraft built after 1975, the POH IS the designated AFM.',
 zh:'使用者／資訊手冊——僅提供一般性資訊，未經FAA核准，也非針對特定飛機，內容也不會持續更新——不能取代AFM／POH。AFM（飛機飛航手冊）——經FAA核准、針對特定飛機（通常依序號區分）；14 CFR Part 91規定須遵守其中的限制。POH（飛行員操作手冊）——內含經FAA核准的AFM資訊；對於1975年後製造的大多數輕型飛機，POH本身就是經指定的AFM。'},
{t:'p', en:'Each individual AFM/POH is unique to that aircraft (serial number + registration on title page) — a manual without a specific registration/serial is for general study only.',
 zh:'每一份AFM／POH都是針對特定飛機的獨立文件（標題頁會列出序號與登記號）——若手冊未標明特定的登記號與序號，則僅供一般學習參考用。'},
{t:'p', en:'Standard 9 sections: General (dimensions, definitions); Limitations (only regulatory/safety-required limits, instrument markings, placards); Emergency Procedures (checklists, often red-tabbed); Normal Procedures (airspeeds + phase-by-phase checklists); Performance; Weight and Balance/Equipment List; Systems Description; Handling/Service/Maintenance; Supplements (optional equipment). Optional 10th section: Safety Tips.',
 zh:'標準九大章節：一般說明（尺寸、定義）；限制（僅列出法規／安全所需的限制、儀表標示、標牌）；緊急程序（檢查表，通常以紅色分隔標籤標示）；正常程序（空速資料＋各飛行階段的檢查表）；性能；重量與平衡／裝備清單；系統說明；操作、維護與保養；補充資料（選配裝備）。選填的第十章節：安全提示。'},
{t:'h3', en:'Airspeed Indicator Markings', zh:'空速表標示'},
{t:'p', en:'Red line = VNE (never-exceed speed). Yellow arc = between VNO and VNE (smooth air only). Green arc = normal operating range (VNO to VS1). White arc = flap operating range (VFE to VS0). Small multi-engine aircraft add: red radial line = VMC; blue radial line = VYSE.',
 zh:'紅線＝VNE（絕不可超過速度）。黃弧＝介於VNO與VNE之間（僅限平穩氣流下使用）。綠弧＝正常操作範圍（VNO至VS1）。白弧＝襟翼操作範圍（VFE至VS0）。小型多發動機飛機另加：紅色放射線＝VMC（單發最小可控速度）；藍色放射線＝VYSE（單發最佳爬升率速度）。'},

{t:'h2', en:'Aircraft Documents', zh:'飛機文件'},
{t:'h3', en:'Certificate of Aircraft Registration', zh:'航空器登記證'},
{t:'p', en:'Must be carried in the aircraft at all times. Invalid when: aircraft registered under a foreign country\'s laws; registration cancelled; aircraft destroyed/scrapped; ownership transferred; certificate holder loses U.S. citizenship. FAA does not issue ownership certificates.',
 zh:'須隨時攜帶於機上。以下情況登記證失效：飛機依外國法律登記、登記遭撤銷、飛機報廢或全毀、所有權轉移、持證人喪失美國公民身分。FAA不核發所有權證明。'},
{t:'h3', en:'Airworthiness Certificate', zh:'適航證'},
{t:'p', en:'Issued once inspected and found to meet 14 CFR Part 21 and safe for operation. Must be displayed/legible to passengers/crew whenever operated. Standard Airworthiness Certificate — normal/utility/acrobatic/commuter/transport/balloon categories. Special Airworthiness Certificate — Experimental/Restricted/Limited/Provisional/LSA (usually pink).',
 zh:'經檢查確認符合14 CFR Part 21且適於飛行後核發。飛行期間須展示於機上、乘客與機組員皆可清楚看見。標準適航證——適用於正常／效用／特技／通勤／運輸類及氣球。特殊適航證——適用於實驗類／限用類／限制類／臨時類／LSA（通常為粉紅色）。'},

{t:'h2', en:'Aircraft Inspections', zh:'飛機檢查'},
{t:'table', head:['Inspection','Interval / Who performs'], headZh:['檢查項目','週期／執行者'], rows:[
  {en:'Annual', zh:'年度檢查', en2:'Recip/single-engine turbine small aircraft, business/pleasure use — every 12 calendar months, by an A&P mechanic with IA or a rated repair station', zh2:'活塞式或單發渦輪動力小型飛機，商務／娛樂用途——每12個月一次，由具IA資格的A&P機工或合格維修站執行'},
  {en:'100-hour', zh:'百小時檢查', en2:'Aircraft <12,500 lb used for hire (passengers/instruction) — every 100 flight hours (can exceed by ≤10 hrs to reach maintenance), by A&P/repair station/manufacturer', zh2:'12,500磅以下、用於收費載客或教學的飛機——每100飛行小時一次（可超出不超過10小時以飛往維修地點），由A&P機工／維修站／製造商執行'},
  {en:'Altimeter/pitot-static', zh:'高度表／靜壓系統', en2:'Aircraft operating IFR in controlled airspace — every 24 months', zh2:'於管制空域內以IFR飛行的飛機——每24個月一次'},
  {en:'Transponder', zh:'雷達詢答機', en2:'Any aircraft using a transponder — every 24 months, regardless of airspace', zh2:'任何使用詢答機的飛機——每24個月一次，不論空域為何'},
  {en:'ELT', zh:'緊急定位發報器', en2:'Aircraft with an ELT — within 12 calendar months of last inspection', zh2:'裝有ELT的飛機——距上次檢查12個月內'}
]},
{t:'p', en:'Annual and 100-hour requirements don\'t apply to large aircraft (>12,500 lb), turbojets/turboprop multi-engine airplanes, or aircraft under a progressive inspection program. An aircraft overdue for annual inspection may fly to a maintenance location under a Special Flight Permit — but all due ADs must still be complied with first.',
 zh:'年度檢查與百小時檢查的規定不適用於大型飛機（超過12,500磅）、渦輪噴射／渦輪螺旋槳多發動機飛機，或採用漸進式檢查計畫的飛機。逾期未做年度檢查的飛機，可依特殊飛行許可飛往維修地點——但出發前仍須先完成所有到期的適航指令（AD）。'},

{t:'h2', en:'Minimum Equipment Lists (MEL) & Inoperative Equipment', zh:'最低裝備需求清單（MEL）與失效裝備'},
{t:'p', en:'Two methods for small rotorcraft/non-turbine airplanes/gliders under Part 91: (1) 91.213(d) deferral provision — most common; pilot determines the item isn\'t required and can be operated safely without it → deactivate/remove, placard INOPERATIVE. Not for inflight discrepancies. (2) FAA-approved MEL — once requested with an LOA, becomes mandatory for that aircraft; functions like an STC for that specific aircraft.',
 zh:'適用於Part 91規範下的小型旋翼機／非渦輪動力飛機／滑翔機的兩種處理方式：（1）91.213(d)展延條款——最常見；由飛行員判斷該項目非屬必要、且在缺少該裝備的情況下仍可安全操作→予以停用或移除，並掛上「INOPERATIVE（無法作用）」標牌。此條款不適用於飛行中發生的故障。（2）經FAA核准的MEL——一旦提出申請並取得授權函（LOA），該MEL即成為該架飛機的強制規範；其效力如同針對該特定飛機核發的補充型別證書（STC）。'},

{t:'h2', en:'Preventive Maintenance', zh:'預防性維護'},
{t:'p', en:'Simple/minor preservation + replacement of small standard parts, no complex assembly. Who may perform it: any certificated pilot except student/sport/recreational pilots, on aircraft they own/operate, not used in air carrier service. Requires a maintenance-record entry: description of work, date, pilot\'s name/signature/certificate number/type.',
 zh:'指簡單或次要的保養工作，以及更換小型標準零件，不涉及複雜的組裝作業。可執行者：任何合格飛行員（學生、運動、休閒飛行員除外），限於自己擁有或營運、且未用於航空承運業務的飛機。須於維修紀錄中記載：工作內容說明、完成日期、飛行員姓名／簽名／證照號碼／證照類別。'},

{t:'h2', en:'Repairs, Alterations, and Special Flight Permits', zh:'修理、改裝與特殊飛行許可'},
{t:'p', en:'Major repairs/alterations — approved for return to service via FAA Form 337, by a rated repair station, an A&P mechanic with IA, or an FAA representative. Minor repairs — approved via a proper maintenance-record entry. Special flight permit — allows operation of an aircraft that doesn\'t currently meet airworthiness requirements but is safe for a specific flight (e.g., ferry to a repair base, delivery/export, evacuation, overweight ferry flight).',
 zh:'重大修理／改裝——須以FAA表格337核准恢復使用，由合格維修站、具IA資格的A&P機工，或FAA代表簽署。輕微修理——以正確的維修紀錄登載即可核准恢復使用。特殊飛行許可——允許目前未完全符合適航要求、但對特定飛行而言仍屬安全的飛機進行操作（例如換場飛往維修基地、交機／出口、疏散撤離，或超重換場飛行）。'},

{t:'h2', en:'Airworthiness Directives (ADs)', zh:'適航指令（AD）'},
{t:'p', en:'FAA\'s mechanism to require correction of an unsafe condition in an aircraft/engine/propeller/appliance. 2 categories: emergency (immediate compliance before further flight) and less urgent (compliance within a specified time). Regulatory — must comply unless a specific exemption is granted. Owner/operator responsible for compliance, including recurring ADs.',
 zh:'FAA用來要求修正飛機／引擎／螺旋槳／裝備中不安全狀況的機制。分為兩類：緊急類（須在下次飛行前立即遵循）與非緊急類（須於指定期限內遵循）。屬法規性質——除非取得特定豁免，否則必須遵守。適航指令的遵循責任由所有人／營運人承擔，包含重複性適航指令。'},

{t:'h2', en:'Aircraft Owner/Operator Responsibilities', zh:'飛機所有人／營運人的責任'},
{t:'li', en:'Keep current Airworthiness Certificate + Certificate of Aircraft Registration onboard', zh:'機上須備妥有效的適航證與航空器登記證'},
{t:'li', en:'Maintain airworthy condition, including AD compliance, with maintenance properly recorded', zh:'維持飛機處於適航狀態，包含遵循適航指令，並確實記錄維修內容'},
{t:'li', en:'Stay current on applicable regulations for operation/maintenance', zh:'隨時掌握適用於飛機操作與維修的最新法規'},
{t:'li', en:'Notify FAA Aircraft Registry immediately of address change, sale/export, or loss of registration eligibility', zh:'地址變更、飛機出售／出口，或喪失登記資格時，須立即通知FAA航空器登記處'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Understanding the AFM/POH and related documentation (ADs, etc.) gives pilots ready access to what\'s needed to fly a given aircraft safely — informs good flight decisions and helps keep the aircraft airworthy.',
 zh:'了解AFM／POH與相關文件（如適航指令等），能讓飛行員隨時掌握安全駕駛特定飛機所需的資訊——有助於做出正確的飛行決策，並維持飛機處於適航狀態。'}
  ]
},
{
  id:'ch10', num:10,
  titleEn:'Chapter 10 — Weight and Balance',
  titleZh:'第十章 — 重量與平衡',
  subEn:'Original pages 10-1 to 10-11.',
  subZh:'原文頁碼 10-1 至 10-11。',
  blocks:[
{t:'h2', en:'Weight Control', zh:'重量控制'},
{t:'p', en:'Overloading may prevent liftoff or cause unexpectedly poor flight characteristics. Performance deficiencies: higher takeoff speed, longer takeoff run, reduced climb rate/angle, lower max altitude, shorter range, reduced cruise speed/maneuverability, higher stall/approach/landing speed, longer landing roll.',
 zh:'超重可能導致飛機無法離地，或出現意料之外的不良飛行特性。性能上的缺陷包括：起飛速度提高、起飛滑跑距離增長、爬升率與爬升角降低、最大高度降低、航程縮短、巡航速度與機動性下降、失速速度／進場速度／落地速度提高、落地滑跑距離增長。'},
{t:'p', en:'Fuel (6 lb/gal) is the main weight variable during flight — burning fuel makes the aircraft lighter and improves performance as flight progresses.',
 zh:'燃油（每加侖6磅）是飛行過程中重量變化的主要因素——隨著燃油消耗，飛機會變輕，性能也會隨飛行進行而改善。'},

{t:'h2', en:'Balance, Stability, and Center of Gravity', zh:'平衡、穩定性與重心'},
{t:'p', en:'Balance = location of the CG — the point at which the aircraft would balance if suspended there. Too far forward = nose-heavy, too far aft = tail-heavy (potentially uncontrollable). Longitudinal (fore/aft) balance is the primary concern.',
 zh:'平衡＝重心的位置——若將飛機懸掛於該點，飛機能保持平衡。重心過於偏前＝機首過重，過於偏後＝機尾過重（可能導致無法操控）。縱向（前後方向）平衡是主要關注重點。'},
{t:'p', en:'Forward CG limit: often set by landing characteristics — exceeding it → excess nosewheel load, decreased performance, higher stall speed, higher control forces; also ensures sufficient elevator authority remains at minimum airspeed. Aft CG limit: moving aft = progressively less stable; extreme aft CG → severe control difficulty, violent stall characteristics, very light control forces (overstress risk).',
 zh:'前重心限制：通常依落地特性訂定——超出限制時會導致前輪負荷過大、性能下降、失速速度提高、操縱桿力增加；同時也確保在最低空速下仍有足夠的升降舵操縱權限。後重心限制：重心越後移，穩定性越差；重心過度偏後時，會導致操控困難、失速特性劇烈、操縱桿力過輕（有過度施力損壞結構的風險）。'},

{t:'h2', en:'Management of Weight and Balance Control', zh:'重量與平衡的管理'},
{t:'p', en:'14 CFR 91.9 requires PIC compliance with AFM operating limits, which include weight and balance. Negligible weight change thresholds (don\'t require a new W&B check): ≤1 lb (empty weight <5,000 lb) · ≤2 lb (5,000–50,000 lb) · ≤5 lb (>50,000 lb). Negligible CG change: <0.05% MAC (fixed-wing) or <0.2% (rotary-wing).',
 zh:'14 CFR 91.9規定機長須遵守AFM中的操作限制，其中包含重量與平衡限制。可視為「可忽略」的重量變化門檻（不須重新進行W&B檢查）：空機重量低於5,000磅者，變化≤1磅；5,000至50,000磅者，變化≤2磅；超過50,000磅者，變化≤5磅。可忽略的重心變化：固定翼飛機低於平均氣動力弦（MAC）的0.05%，旋翼機低於0.2%。'},

{t:'h2', en:'Terms and Definitions', zh:'名詞與定義'},
{t:'table', head:['Term','Definition'], headZh:['名詞','定義'], rows:[
  {en:'Arm (moment arm)', zh:'力臂', en2:'Horizontal distance (in) from datum to an item\'s CG; + if aft, − if forward', zh2:'從基準點到該項目重心的水平距離（吋）；位於基準點後方為正值，前方為負值'},
  {en:'CG', zh:'重心', en2:'The point the aircraft would balance around if suspended there', zh2:'若將飛機懸掛於該點，飛機能維持平衡的位置'},
  {en:'CG limits / range', zh:'重心限制／範圍', en2:'Forward & aft points the CG must stay within / the distance between them', zh2:'重心必須維持在其間的前後限制點／此兩點間的距離'},
  {en:'Datum (reference datum)', zh:'基準點', en2:'Manufacturer-established point all arm measurements are taken from', zh2:'由製造商設定、所有力臂測量的起始參考點'},
  {en:'Moment', zh:'力矩', en2:'Weight × arm (in-lb)', zh2:'重量×力臂（磅－吋）'},
  {en:'Useful load', zh:'可用載重', en2:'Pilot+passengers+baggage+usable fuel+drainable oil = max gross weight − basic empty weight', zh2:'飛行員＋乘客＋行李＋可用燃油＋可排放機油＝最大總重－基本空機重量'},
  {en:'Standard weights', zh:'標準重量', en2:'Gasoline 6 lb/gal · Jet A/A-1 6.8 lb/gal · Jet B 6.5 lb/gal · Oil 7.5 lb/gal · Water 8.35 lb/gal', zh2:'汽油每加侖6磅・Jet A／A-1每加侖6.8磅・Jet B每加侖6.5磅・機油每加侖7.5磅・水每加侖8.35磅'}
]},

{t:'h2', en:'Principles of Weight and Balance Computations', zh:'重量與平衡計算原理'},
{t:'p', en:'CG is normally placed slightly forward of the center of lift → mild nose-down tendency, desirable at high AOA/slow speed. Moment = weight × arm; to balance, opposing-side moments must be equal.',
 zh:'重心通常設定在略微偏前於升力中心的位置→產生輕微的機首下俯傾向，這在高攻角、低速飛行時是有利的。力矩＝重量×力臂；要達成平衡，兩側的力矩必須相等。'},
{t:'p', en:'3 methods to determine loaded weight and CG: Computational method (CG = total moment ÷ total weight, checked against the CG range); Graph method (manufacturer graphs plot weight vs. moment, checked against a CG moment envelope); Table method (manufacturer tables give moment values for standard weight increments per station).',
 zh:'決定載重後的重量與重心，有三種方法：計算法（重心＝總力矩÷總重量，再與重心範圍比對）；圖表法（依製造商提供的圖表繪出重量與力矩，並與重心力矩包絡線比對）；表格法（依製造商提供的表格，查出各站位標準重量增量所對應的力矩值）。'},

{t:'h2', en:'Shifting, Adding, and Removing Weight', zh:'重量的移動、增加與移除'},
{t:'p', en:'Weight shifting: total weight unchanged; total moment changes based on direction/distance moved. Shortcut: ΔCG = (weight shifted ÷ total weight) × distance shifted, then add if CG shifts aft, subtract if forward.',
 zh:'重量移動：總重量不變；總力矩則依移動的方向與距離而改變。速算公式：重心變化量（ΔCG）＝（移動的重量÷總重量）×移動的距離；若重心後移則相加，前移則相減。'},
{t:'p', en:'Weight addition/removal: ΔCG = (weight added/removed ÷ new total weight) × (distance between the weight\'s station and the old CG). Add ΔCG to old CG if the change shifts CG aft; subtract if it shifts forward.',
 zh:'重量的增加／移除：重心變化量（ΔCG）＝（增加或移除的重量÷新總重量）×（該重量所在站位與原重心之間的距離）。若此變化使重心後移，則將ΔCG加到原重心；若使重心前移，則相減。'},

{t:'h2', en:'Chapter Summary', zh:'本章摘要'},
{t:'p', en:'Operating within weight and balance limits is critical to flight safety — pilots must ensure the CG stays within approved limits throughout every phase of flight.',
 zh:'在重量與平衡限制範圍內操作，對飛航安全至關重要——飛行員必須確保在整個飛行的每個階段，重心都維持在核准的範圍之內。'}
  ]
},

  {en:'Restricted area (R + number)', zh:'限航區（R＋編號）', en2:'Hazardous to nonparticipating aircraft (artillery, gunnery, missiles); IFR may transit if inactive/released', zh2:'對非參與飛機具危險性（如砲擊、射擊、飛彈演習）；若該區未啟用或已釋出，IFR飛機可穿越'},

{t:'h2', en:'Other Airspace Areas', zh:'其他空域類型'},
{t:'p', en:'Military Training Routes (MTRs) — IR (IFR) / VR (VFR) + number; 4-digit = no segment above 1,500 ft AGL, 3-digit = includes a segment above 1,500 ft AGL. Temporary Flight Restrictions (TFRs) — issued via FDC NOTAM; check www.tfr.faa.gov during flight planning.',
 zh:'軍事訓練航路（MTR）——分為IR（IFR）與VR（VFR），後接編號；四位數編號＝所有航段皆在1,500呎AGL以下，三位數編號＝含有1,500呎AGL以上的航段。暫時飛航限制（TFR）——透過FDC NOTAM發布；飛行前規劃時應查詢www.tfr.faa.gov確認。'},
{t:'p', en:'Terminal Radar Service Areas (TRSAs) — voluntary additional radar separation service; primary airport(s) = Class D, remainder usually Class E. National Security Areas (NSAs) — flight may be temporarily prohibited via NOTAM; voluntary avoidance requested otherwise.',
 zh:'終端雷達服務區（TRSA）——提供自願性質的額外雷達隔離服務；主要機場劃為D類空域，其餘部分通常為E類。國家安全區（NSA）——可能透過NOTAM暫時禁止飛越；其餘情況則呼籲飛行員自願避開。'},

{t:'h2', en:'Basic VFR Weather Minimums', zh:'基本VFR天氣最低標準'},

{t:'h2', en:'Entry / Equipment / Pilot Certificate Requirements', zh:'進入資格／裝備／飛行員證照要求'},

{t:'p', en:'Lost-comm procedures: VFR — may continue and land if weather is at/above basic VFR minimums, tower visual contact maintained, light-signal landing clearance received. IFR — continue via the last ATC clearance route → the route ATC said to expect → the filed flight-plan route.',
 zh:'失去通訊時的處置：VFR——若天氣達到或優於基本VFR標準，且維持與塔台的目視接觸並收到燈號落地許可，則可繼續飛行並落地。IFR——依序依循：最後一次收到的航管許可航路→航管曾告知「可預期」的航路→原申報的飛航計畫航路。'},

{t:'li', en:'Parachute jumps — not allowed in/into A/B/C/D airspace without ATC authorization', zh:'跳傘活動——未經航管授權，不得在A／B／C／D類空域內或進入該空域進行'},
{t:'li', en:'Ultralight vehicles — not allowed in A/B/C/D or the surface area of airport-designated Class E without prior ATC authorization', zh:'超輕型載具——未經航管事先授權，不得進入A／B／C／D類空域，或機場劃定的E類空域地面區域'},
